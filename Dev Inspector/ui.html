    var pages = iconPageCount(d);
    if (pages < 2) return "";
    var i = iconPageIndex(d);
    var from = i * ICONS_PER_PAGE + 1;
    var to = Math.min(d.icons.length, from + ICONS_PER_PAGE - 1);
    return '<div class="pager">' +
      '<button class="xs ghost pgbtn" data-icon-page="prev"' + (i === 0 ? " disabled" : "") +
      ' title="' + esc(t("prevPage")) + '">' + navArrow(false) + "</button>" +
      '<span class="pg-n">' + esc(t("pageOf")(i + 1, pages)) + "</span>" +
      '<button class="xs ghost pgbtn" data-icon-page="next"' + (i >= pages - 1 ? " disabled" : "") +
      ' title="' + esc(t("nextPage")) + '">' + navArrow(true) + "</button>" +
      '<span class="pg-range">' + esc(t("showingRange")(from, to, d.icons.length)) + "</span>" +
      "</div>";
  }

  function iconsHtml(d) {
    if (!d.icons || !d.icons.length) return "";
    var page = iconPageSlice(d);
    var h = "";
    for (var i = 0; i < page.length; i++) {
      var ic = page[i];
      var relKey = ic.rel === "self" ? "iconSelf" : (ic.rel === "ancestor" ? "iconAncestor" : "iconChild");
      var meta = [ic.w + "×" + ic.h, t(relKey)];
      if (ic.path) meta.push(ic.path);
      if (ic.hidden) meta.push(t("hidden"));
      var cached = S.previews[ic.nodeId];
      var o = iconOpts(ic.nodeId);
      h += '<div class="card clickable' + (ic.nodeId === S.pickedId ? " picked" : "") +
        '" data-icon="' + esc(ic.nodeId) + '" data-pick="' + esc(ic.nodeId) +
        '" title="' + esc(t("selectOnCanvas")) + '">' +
        '<div class="card-head">' +
        '<div class="icon-prev"><img data-prev="' + esc(ic.nodeId) + '"' +
        (cached ? ' src="' + cached + '"' : ' style="display:none"') + " /></div>" +
        '<div style="flex:1;min-width:0">' +
        '<div class="ch-name">' + esc(ic.label || ic.name) + "</div>" +
        '<div class="ch-sub">' + esc(meta.join(" · ")) + "</div>" +
        "</div>" +
        "</div>" +
        '<div class="exp-controls">' +
        '<select data-scale>' +
        [1, 2, 3, 4].map(function (n) {
          return '<option value="' + n + '"' + (n === o.scale ? " selected" : "") + ">" + n + "×</option>";
        }).join("") +
        "</select>" +
        '<select data-fmt class="grow">' +
        ["SVG", "PNG", "JPG", "PDF"].map(function (f) {
          return '<option value="' + f + '"' + (f === o.fmt ? " selected" : "") + ">" + f + "</option>";
        }).join("") +
        "</select>" +
        '<button class="xs ghost dots' + (o.open ? " on" : "") + '" data-icon-more title="' +
        esc(t("exportSettings")) + '">•••</button>' +
        '<button class="xs" data-copysvg>' + esc(t("exportCopy")) + "</button>" +
        '<button class="primary xs" data-exp>' + esc(t("exportBtn")) + "</button>" +
        "</div>" + iconOptsHtml(o) + "</div>";
    }
    return h;
  }

  function iconOptsHtml(o) {
    if (!o.open) return "";
    return '<div class="exp-more" style="margin-top:8px">' +
      '<div class="exp-checks">' +
      expCheck("data-icon-patch", o.patchStroke, t("svgPatch"), t("svgPatchTip")) +
      expCheck("data-icon-label", o.labelParts, t("svgLabel"), t("svgLabelTip")) +
      expCheck("data-icon-hidden", o.dropInvisible, t("svgDropHidden"), t("svgDropHiddenTip")) +
      expCheck("data-icon-clip", o.cleanClip, t("svgCleanClip"), t("svgCleanClipTip")) +
      expCheck("data-icon-svgid", o.svgIdAttribute, t("svgId"), t("svgIdTip")) +
      expCheck("data-icon-svgstroke", o.svgSimplifyStroke, t("svgSimplify"), t("svgSimplifyTip")) +
      expCheck("data-icon-svgtext", o.svgOutlineText, t("svgOutlineText"), t("svgOutlineTextTip")) +
      expCheck("data-icon-contents", o.contentsOnly, t("ignoreOverlap"), t("ignoreOverlapTip")) +
      "</div></div>";
  }

  // Thumbnails are exported on demand and cached, so re-renders don't re-export.
  // Each preview is an export on the main thread, so a library of hundreds must
  // not ask for them all at once. Paging bounds it instead: whatever is on the
  // current page is requested, and nothing else.
  //
  // This deliberately does NOT key off whether a card is visible. An icon with
  // no preview yet renders its <img> as display:none, and an element with no
  // box never intersects anything — so a visibility-driven version loads
  // almost nothing, which is exactly what it did.
  function requestPreviews(d) {
    if (!d.icons || !d.icons.length) return;
    var page = iconPageSlice(d);
    var want = [];
    for (var i = 0; i < page.length; i++) {
      var id = page[i].nodeId;
      if (id && !S.previews[id] && !S.previewAsked[id]) {
        S.previewAsked[id] = true;
        want.push(id);
      }
    }
    if (want.length) post({ type: "icon-previews", nodeIds: want });
  }

  function bytesToPng(bytes) {
    var bin = "", chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return "data:image/png;base64," + btoa(bin);
  }

  /* --- component properties --- */

  function propsHtml(d) {
    if (!d.props || !d.props.length) return "";
    var h = "";
    for (var i = 0; i < d.props.length; i++) {
      var p = d.props[i];
      h += '<div class="prow"><span class="pk">' + esc(p.name) + "</span>" +
        '<span class="pv"><span class="copy" data-copy="' + esc(p.value) + '">' + esc(val(p.value)) + "</span>" +
        (p.tok ? tokHtml(p.tok) : "") + "</span></div>";
    }
    return h;
  }

  /* --- scroll behavior --- */

  // Two rows, worded the way the editor's own Scroll behavior dropdowns are.
  // The enum goes straight into the string key, so an unknown future value
  // falls through t() and shows itself rather than an empty cell.
  function scrollHtml(d) {
    var sb = d.scroll;
    if (!sb) return "";
    // Scrolling with the parent and not scrolling your own contents is what
    // every layer starts as. Spelling that out as two rows implies somebody
    // chose it; one line says the same thing honestly.
    var isDefault = (!sb.position || sb.position === "SCROLLS") &&
                    (!sb.overflow || sb.overflow === "NONE");
    if (isDefault) return '<div class="muted" style="padding:2px">' + esc(t("scrollNone")) + "</div>";
    var rows = [];
    if (sb.position) rows.push({ k: t("lblScrollPos"), v: t("scroll" + sb.position), raw: true });
    if (sb.overflow) rows.push({ k: t("lblOverflow"), v: t("ov" + sb.overflow), raw: true });
    return rowsHtml(rows);
  }

  /* --- layout: the auto layout control, drawn the way the editor draws it,
         because "align primary / align counter" reads as jargon --- */

  // A read-only mirror of the editor's Auto layout panel: labelled rows of
  // field boxes, shaped by which layout mode the node is actually in.
  function layoutHtml(d) {
    var L = d.layout;
    if (!L) return "";
    var h = '<div class="lp">';

    if (L.sizing) {
      h += lpRow(t("lblResizing"), [
        lpField("W", L.sizing.w.v, L.sizing.w.tok, L.sizing.w.mode),
        lpField("H", L.sizing.h.v, L.sizing.h.tok, L.sizing.h.mode),
      ]);
    }

    if (L.span && (L.span.colSpan || L.span.rowSpan || L.span.colStart || L.span.rowStart)) {
      h += lpRow(t("lblGridPlace"), [
        lpField(t("abbrCol"), L.span.colSpan, null, null),
        lpField(t("abbrRow"), L.span.rowSpan, null, null),
        L.span.colStart ? lpField(t("abbrColStart"), L.span.colStart, null, null) : "",
        L.span.rowStart ? lpField(t("abbrRowStart"), L.span.rowStart, null, null) : "",
      ]);
    }

    if (L.grid) {
      h += lpRow(t("lblGrid"), [
        lpField(t("abbrCols"), L.grid.cols, null, null),
        lpField(t("abbrRows"), L.grid.rows, null, null),
      ]);
      h += lpRow(t("lblGaps"), [
        lpField(t("abbrColGap"), L.grid.colGap.v, L.grid.colGap.tok, null),
        lpField(t("abbrRowGap"), L.grid.rowGap.v, L.grid.rowGap.tok, null),
      ]);
    }

    if (L.align) {
      h += lpRow(t("lblAlignment"), [
        alignWidget(L.align),
        L.gap ? lpField(t("abbrGap"), L.gap.v, L.gap.tok, L.gap.auto ? t("spaceBetween") : null) : "",
        L.crossGap ? lpField(t("abbrCrossGap"), L.crossGap.v, L.crossGap.tok, null) : "",
      ]);
    }

    if (L.pad) h += lpRow(t("lblPadding"), padFields(L.pad));

    if (L.pos) {
      h += lpRow(t("lblPosition"), [
        lpField("X", L.pos.x, null, null),
        lpField("Y", L.pos.y, null, null),
      ]);
      // The four edge distances belong to Position, laid out as equal columns
      // so they line up rather than wrapping at content width.
      if (L.edges) {
        h += lpRow("", [
          lpField(t("edgeT"), L.edges.t, null, null),
          lpField(t("edgeR"), L.edges.r, null, null),
          lpField(t("edgeB"), L.edges.b, null, null),
          lpField(t("edgeL"), L.edges.l, null, null),
        ], "cols4");
      }
    }

    var flags = [];
    if (L.absolute) flags.push(lpField(t("abbrPos"), t("absolute"), null, null));
    if (L.clips !== null && L.clips !== undefined) {
      flags.push('<span class="lp-check' + (L.clips ? " on" : "") + '">' +
        '<span class="box">' + (L.clips ? "✓" : "") + "</span>" + esc(t("clipContent")) + "</span>");
    }
    if (flags.length) h += lpRow("", flags);

    h += "</div>";
    if (L.rows && L.rows.length) h += '<div style="margin-top:10px">' + rowsHtml(L.rows) + "</div>";
    return h;
  }

  function lpRow(label, fields, mod) {
    var body = fields.filter(function (f) { return !!f; }).join("");
    if (!body) return "";
    return '<div class="lp-row"><div class="lp-label">' + esc(label) + "</div>" +
      '<div class="lp-fields' + (mod ? " " + mod : "") + '">' + body + "</div></div>";
  }

  // key = the short prefix inside the box (W, H, GAP…); mode = the trailing
  // muted qualifier (Fill, Hug, Space between…).
  function lpField(key, value, tok, mode, keyIsHtml) {
    if (value === null || value === undefined || value === "") return "";
    return '<span class="lp-field">' +
      (key ? (keyIsHtml ? key : '<span class="lp-fk">' + esc(key) + "</span>") : "") +
      '<span class="lp-fv copy" data-copy="' + esc(value) + '">' + esc(val(value)) + "</span>" +
      (mode ? '<span class="lp-fm">' + esc(val(mode)) + "</span>" : "") +
      (tok ? tokHtml(tok) : "") +
      "</span>";
  }

  // Edge icons in the editor's idiom: a faint box with the relevant sides drawn
  // solid, so which padding a field controls is readable without a label.
  var PAD_EDGES = {
    all: ["T", "R", "B", "L"], v: ["T", "B"], h: ["L", "R"],
    T: ["T"], R: ["R"], B: ["B"], L: ["L"],
  };
  var PAD_PATHS = {
    T: "M3.1 2.6H8.9", B: "M3.1 9.4H8.9", L: "M2.6 3.1V8.9", R: "M9.4 3.1V8.9",
  };
  function padIcon(kind) {
    var edges = PAD_EDGES[kind] || [];
    var lines = edges.map(function (e) {
      return '<path d="' + PAD_PATHS[e] + '" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>';
    }).join("");
    return '<span class="lp-ic"><svg viewBox="0 0 12 12">' +
      '<rect x="2.6" y="2.6" width="6.8" height="6.8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1" opacity=".3"/>' +
      lines + "</svg></span>";
  }

  // One field per axis when the two sides match, separate fields when they don't.
  function padFields(pad) {
    if (pad.uniform) return [lpField(padIcon("all"), pad.t.v, pad.t.tok, null, true)];
    var out = [];
    if (pad.pairedV) out.push(lpField(padIcon("v"), pad.t.v, pad.t.tok, null, true));
    else {
      out.push(lpField(padIcon("T"), pad.t.v, pad.t.tok, null, true));
      out.push(lpField(padIcon("B"), pad.b.v, pad.b.tok, null, true));
    }
    if (pad.pairedH) out.push(lpField(padIcon("h"), pad.l.v, pad.l.tok, null, true));
    else {
      out.push(lpField(padIcon("L"), pad.l.v, pad.l.tok, null, true));
      out.push(lpField(padIcon("R"), pad.r.v, pad.r.tok, null, true));
    }
    return out;
  }

  function alignWidget(a) {
    var horiz = a.mode === "HORIZONTAL";
    var spread = a.primary === "SPACE_BETWEEN";
    // Primary axis runs along the direction; counter axis crosses it.
    var pos = { MIN: 1, CENTER: 2, MAX: 3, SPACE_BETWEEN: 1, BASELINE: 3 };
    var pIdx = pos[a.primary] || 1;
    var cIdx = pos[a.counter] || 1;
    var barCol = horiz ? pIdx : cIdx;
    var barRow = horiz ? cIdx : pIdx;

    var bars = '<div class="al-bars ' + (horiz ? "h" : "v") + (spread ? " spread" : "") + '" style="grid-row:' +
      (horiz ? barRow : (spread ? "1 / 4" : barRow)) + ";grid-column:" +
      (horiz ? (spread ? "1 / 4" : barCol) : barCol) + '">' +
      '<span class="al-bar"></span><span class="al-bar"></span><span class="al-bar"></span></div>';

    var cells = "";
    for (var r = 1; r <= 3; r++) {
      for (var c = 1; c <= 3; c++) {
        var covered = horiz
          ? (r === barRow && (spread || c === barCol))
          : (c === barCol && (spread || r === barRow));
        if (covered) continue;
        cells += '<div class="al-cell" style="grid-row:' + r + ";grid-column:" + c + '"><span class="dot"></span></div>';
      }
    }

    // MIN/MAX are Figma's internal enum names, not something a dev should have
    // to decode — resolve each axis to the actual side it means (Top/Left/etc)
    // based on which physical direction that axis runs.
    var sub = [axisWord(horiz, a.primary), axisWord(!horiz, a.counter)].join(" · ");
    return '<div class="al-widget">' +
      '<div class="al-grid" title="' + esc(sub) + '">' + cells + bars + "</div>" +
      '<div class="al-caption"><div class="al-dir">' + esc(val(pretty(a.mode))) +
      (a.wrap ? " · " + esc(val("Wrap")) : "") + "</div>" +
      '<div class="al-sub">' + esc(sub) + "</div></div></div>";
  }

  function pretty(v) {
    if (!v) return "";
    var x = String(v).toLowerCase().replace(/_/g, " ");
    return x.charAt(0).toUpperCase() + x.slice(1);
  }

  // isHorizontalAxis: true if this particular axis runs left-right.
  function axisWord(isHorizontalAxis, value) {
    if (value === "SPACE_BETWEEN") return val("Space between");
    if (value === "CENTER") return val("Center");
    if (value === "BASELINE") return val("Baseline");
    if (isHorizontalAxis) return val(value === "MAX" ? "Right" : "Left");
    return val(value === "MAX" ? "Bottom" : "Top");
  }

  /* --- layout grids --- */

  function gridsHtml(d) {
    if (!d.grids) return "";
    var h = d.grids.style ? '<div class="prow"><span class="pk">' + esc(t("gridStyle")) + '</span><span class="pv">' + tokHtml(d.grids.style) + "</span></div>" : "";
    for (var i = 0; i < d.grids.grids.length; i++) {
      h += '<div class="card">' + rowsHtml(d.grids.grids[i].rows) + "</div>";
    }
    return h;
  }

  /* --- typography --- */

  function typeHtml(d) {
    var tx = d.text;
    if (!tx) return "";
    var h = "";

    if (tx.mixed) {
      h += '<div class="muted" style="margin-bottom:6px">' + esc(t("mixedStyles")) + "</div>";
      for (var i = 0; i < tx.segments.length; i++) {
        var sg = tx.segments[i];
        h += '<div class="card"><div class="card-head"><div class="ch-name">' +
          esc(t("segment")) + (i + 1) + '</div></div><div class="ch-sub" style="margin:2px 0 4px">"' + esc(sg.text) + '"</div>' +
          (sg.style ? stylePill(sg.style, "", "seg" + i) : "") +
          (S.detail["seg" + i] ? '<div class="detail-box">' + rowsHtml(sg.rows) + "</div>" : "") +
          "</div>";
      }
    } else if (tx.styleName) {
      // Style applied: the name is the spec. Click it to copy, "details" for metrics.
      h += stylePill(tx.styleName, "", "type");
      if (S.detail["type"]) h += '<div class="detail-box">' + rowsHtml(tx.detailRows) + "</div>";
    } else {
      h += '<div class="muted" style="margin-bottom:6px">' + esc(t("noStyle")) + "</div>";
      h += rowsHtml(tx.detailRows);
    }

    h += rowsHtml(tx.rows);
    h += paintsHtml(tx.fills, t("fill"));
    return h;
  }

  // Shared pill: optional category icon, copyable name, optional summary,
  // details toggle right.
  function stylePill(name, summary, key, iconHtml) {
    return '<div class="style-pill">' +
      (iconHtml || "") +
      '<span class="sp-name copy" data-copy="' + esc(name) + '" title="' + esc(name) + '">' + esc(name) + "</span>" +
      (summary ? '<span class="sp-hint mono">' + esc(summary) + "</span>" : "") +
      '<button class="xs ghost sp-toggle" data-detail="' + esc(key) + '">' +
      esc(S.detail[key] ? t("hideDetails") : t("showDetails")) + "</button>" +
      "</div>";
  }

  // Small glyphs standing in for Figma's own effect-category icons — the
  // plugin sandbox can't reach Figma's icon assets over the network, so these
  // are drawn to read the same way at a glance: a shadow pair, an inset
  // shadow, a soft blurred dot, a blurred dot behind a frame.
  var EFFECT_ICONS = {
    DROP_SHADOW: '<svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="6" y="6" width="8" height="8" rx="1.5" fill="currentColor" opacity=".38"/></svg>',
    INNER_SHADOW: '<svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4.3 4.3c3.4.3 5.7 2.6 6 6" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".55"/></svg>',
    LAYER_BLUR: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.3 1.7" opacity=".65"/><circle cx="8" cy="8" r="2.1" fill="currentColor"/></svg>',
    BACKGROUND_BLUR: '<svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.3 1.5" opacity=".7"/><circle cx="8" cy="8" r="2.3" fill="currentColor" opacity=".55"/></svg>',
    GLASS: '<svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5" fill="currentColor" opacity=".16"/><rect x="2.5" y="2.5" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5 11.2 10.6 4.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".85"/><path d="M8.4 12 11.6 8.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity=".5"/></svg>',
    NOISE: '<svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="5.5" cy="6" r=".85" fill="currentColor"/><circle cx="9.2" cy="4.9" r=".7" fill="currentColor"/><circle cx="11.2" cy="7.6" r=".85" fill="currentColor"/><circle cx="6.6" cy="9.4" r=".7" fill="currentColor"/><circle cx="9.6" cy="11" r=".85" fill="currentColor"/><circle cx="4.9" cy="11.4" r=".6" fill="currentColor"/></svg>',
    TEXTURE: '<svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4 10.5 10.5 4M6.5 12.5 12.5 6.5M3.5 7 7 3.5" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity=".7"/></svg>',
  };
  function effectIcon(type) {
    var svg = EFFECT_ICONS[type];
    return svg ? '<span class="sp-icon">' + svg + "</span>" : "";
  }

  function contentHtml(d) {
    if (!d.text) return "";
    var tx = d.text;
    if (!tx.characters && !tx.contentVar) return "";
    var h = "";
    if (tx.contentVar) {
      h += '<div class="prow"><span class="pk">' + esc(t("variable")) + '</span><span class="pv">' + tokHtml(tx.contentVar) + "</span></div>";
    }
    if (tx.characters) {
      h += '<div class="content-box copy" data-copy="' + esc(tx.characters) + '">' + esc(tx.characters) + "</div>";
    }
    return h;
  }

  /* --- appearance --- */

  // Grouped the way the editor groups it: layer-level properties first, then a
  // Fill block, then a Stroke block that owns everything about the stroke —
  // paint, position, weight, dashes and ends. Previously "Stroke" appeared
  // twice and Style/Ends read as top-level categories of their own.
  function appearanceHtml(d) {
    var a = d.appearance;
    if (!a) return "";
    var fills = d.text ? [] : a.fills;   // text fills live in the Type section
    var h = rowsHtml(a.rows);

    if (fills.length) {
      h += subsec(t("fill")) + paintList(fills);
    }
    if (a.strokes.length || a.stroke) {
      h += subsec(t("stroke")) + paintList(a.strokes) + strokeHtml(a.stroke);
    }
    return h;
  }

  function subsec(label) {
    return '<div class="subsec">' + esc(label) + "</div>";
  }

  // Paints under a sub-header need no label column — the header names them.
  function paintList(list) {
    if (!list || !list.length) return "";
    return list.map(function (p) {
      return '<div class="paint-row' + (p.visible === false ? " muted" : "") + '">' +
        (p.kind === "gradient" ? gradientBody(p) : solidBody(p)) +
        (p.visible === false ? ' <span class="hidden-flag">(' + esc(t("hidden")) + ")</span>" : "") +
        "</div>";
    }).join("");
  }

  // The editor's stroke section, minus width profile: position and weight, the
  // four sides when they differ, then the dash and corner settings.
  function strokeHtml(sk) {
    if (!sk) return "";
    var h = '<div class="lp" style="margin:6px 0 4px">';

    h += lpRow(t("lblStrokePos"), [
      lpField("", val(sk.align), null, null),
      lpField(t("abbrWeight"), sk.weight, sk.weightTok, null),
    ]);

    if (sk.perSide && sk.sides) {
      h += lpRow(t("lblSides"), [
        lpField(padIcon("T"), sk.sides.t.v, sk.sides.t.tok, null, true),
        lpField(padIcon("R"), sk.sides.r.v, sk.sides.r.tok, null, true),
        lpField(padIcon("B"), sk.sides.b.v, sk.sides.b.tok, null, true),
        lpField(padIcon("L"), sk.sides.l.v, sk.sides.l.tok, null, true),
      ], "cols4");
    }

    var styleFields = [lpField("", val(sk.style), null, null)];
    if (sk.style === "Dashed") {
      styleFields.push(lpField(t("abbrDash"), sk.dash, null, null));
      styleFields.push(lpField(t("abbrGap"), sk.gap, null, null));
    } else if (sk.pattern) {
      styleFields.push(lpField(t("abbrPattern"), sk.pattern, null, null));
    }
    h += lpRow(t("lblStrokeStyle"), styleFields);

    var ends = [];
    if (sk.cap) ends.push(lpField(t("abbrEnds"), val(sk.cap), null, null));
    if (sk.join) ends.push(lpField(t("abbrJoin"), val(sk.join), null, null));
    if (sk.miter) ends.push(lpField(t("abbrMiter"), sk.miter + "°", null, null));
    if (ends.length) h += lpRow(t("lblEnds"), ends);

    return h + "</div>";
  }

  /* --- selection colours: every colour inside the selection, hover to
         highlight every layer using it (Dev Mode's "Selection colors") --- */

  function colorsCount(d) {
    return d.colors && d.colors.colors.length ? String(d.colors.colors.length) : "";
  }

  function colorsHtml(d) {
    if (!d.colors) return "";
    var list = d.colors.colors;
    var h = "";
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      var fill = c.kind === "solid"
        ? "background:" + c.hex + ";opacity:" + (c.alpha === undefined ? 1 : c.alpha)
        : (c.kind === "gradient" && c.stops && c.stops.length
            ? "background:linear-gradient(135deg," + c.stops.join(",") + ")"
            : "background:var(--bg-2)");
      var copyTarget = c.kind === "solid" ? c.hex : (c.token || c.style || c.summary);
      var ids = c.nodeIds.join(",");
      h += '<div class="sc-row' + (ids === S.pickedId ? " picked" : "") + '"' +
        (ids ? ' data-pick="' + esc(ids) + '" title="' +
          esc(c.nodeIds.length > 1 ? t("selectAllUsing")(c.nodeIds.length) : t("selectOnCanvas")) + '"' : "") + ">" +
        '<span class="sc-sw"><i style="' + esc(fill) + '"></i></span>' +
        '<span class="sc-mid">' +
        '<span class="sc-val copy" data-copy="' + esc(copyTarget) + '">' + esc(c.summary) + "</span>" +
        (c.tokens
          ? c.tokens.map(function (tk) {
              return tk ? tokHtml(tk) : '<span class="tok-none">' + esc(t("noToken")) + "</span>";
            }).join('<span class="arrow">→</span>')
          : (c.token ? tokHtml(c.token) : (c.style ? tokHtml(c.style) : ""))) +
        "</span>" +
        "</div>";
    }
    if (d.colors.truncated) h += '<div class="muted" style="padding:4px 6px">' + esc(t("truncatedList")) + "</div>";
    return h;
  }

  /* --- translation: variable × language, name column pinned left --- */

  // Shown on hover so it's obvious a cell can be clicked to copy.
  var CP_ICON = '<span class="cp-ic">⧉</span>';

  var DEFAULT_COLS = { name: 128, desc: 150, mode: 165 };

  function colW(key, fallback) {
    var w = S.langCols[key];
    return typeof w === "number" && w > 0 ? w : fallback;
  }

  // A grip on the right edge of every header cell. The header is sticky, which
  // is a positioned element, so it already anchors this absolutely. It carries
  // the column's current width so the drag has an exact starting point rather
  // than having to read a computed style back out of the DOM.
  function grip(key, width) {
    return '<span class="colres" data-colres="' + esc(key) + '" data-colw="' + width +
      '" title="' + esc(t("dragResize")) + '"></span>';
  }

  function translationHtml(d) {
    var tr = d.translation;
    if (!tr) return "";

    var keys = ["name", "desc"];
    for (var q = 0; q < tr.modes.length; q++) keys.push("m:" + tr.modes[q].modeId);
    var widths = keys.map(function (k, i) {
      return colW(k, i === 0 ? DEFAULT_COLS.name : (i === 1 ? DEFAULT_COLS.desc : DEFAULT_COLS.mode));
    });

    var h = '<div class="tr-wrap"><table class="tr-table"><colgroup>' +
      widths.map(function (w) { return '<col style="width:' + w + 'px">'; }).join("") +
      "<col></colgroup><thead><tr>" +
      '<th class="tr-name">' + esc(t("variable")) + grip("name", widths[0]) + "</th>" +
      '<th class="tr-desc">' + esc(t("description")) + grip("desc", widths[1]) + "</th>";
    for (var m = 0; m < tr.modes.length; m++) {
      h += "<th>" + esc(tr.modes[m].name) +
        (tr.modes[m].isDefault ? ' <span class="tr-def">' + esc(t("defaultMode")) + "</span>" : "") +
        grip("m:" + tr.modes[m].modeId, widths[2 + m]) + "</th>";
    }
    h += '<th class="tr-pad"></th></tr></thead><tbody>';

    for (var i = 0; i < tr.rows.length; i++) {
      var r = tr.rows[i];
      // The row is the layer: hover previews it, click selects it. The copy
      // button next to the name is the way to grab the variable name itself.
      // Every cell is a copy target; nothing here selects. Hovering the row
      // previews the text layer that uses this string on the canvas.
      h += '<tr data-hover="' + esc(r.nodeId) + '">' +
        '<th class="tr-name copy" data-copy="' + esc(r.name) + '" title="' + esc(r.fullName || r.name) + '">' +
        esc(r.name) + CP_ICON +
        '<div class="tr-sub">' + esc(r.nodeName) + (r.count > 1 ? " ×" + r.count : "") + "</div></th>";
      var desc = r.desc ? String(r.desc).trim() : "";
      h += '<td class="tr-desc' + (desc ? " copy" : " none") + '"' +
        (desc ? ' data-copy="' + esc(desc) + '"' : "") + ">" +
        esc(desc || t("noDescription")) + (desc ? CP_ICON : "") + "</td>";
      for (var k = 0; k < tr.modes.length; k++) {
        var v = r.values[tr.modes[k].modeId];
        var missing = v === null || v === undefined || v === "" || v === "--";
        h += '<td class="' + (missing ? "empty" : "copy") + '"' +
          (missing ? "" : ' data-copy="' + esc(v) + '"') + ">" +
          esc(missing ? t("noValue") : v) + (missing ? "" : CP_ICON) + "</td>";
      }
      h += '<td class="tr-pad"></td></tr>';
    }
    h += "</tbody></table></div>";
    if (tr.truncated) h += '<div class="muted" style="margin-top:6px">' + esc(t("truncatedList")) + "</div>";
    return h;
  }

  /* --- effects --- */

  function effectsCount(d) {
    if (!d.effects || !d.effects.groups.length) return "";
    var n = 0;
    for (var i = 0; i < d.effects.groups.length; i++) n += d.effects.groups[i].items.length;
    return String(n);
  }

  function effectsHtml(d) {
    if (!d.effects) return "";
    var g = d.effects.groups;
    if (!g.length) return '<div class="muted">' + esc(t("effectsNone")) + "</div>";
    var h = "";
    for (var i = 0; i < g.length; i++) {
      var grp = g[i];
      // The whole card jumps to the layer, like an icon card — except the
      // currently-selected layer's own card, which has nowhere to jump to.
      var jumpable = !grp.own;
      h += '<div class="card' + (grp.own ? " own" : " clickable") +
        (grp.nodeId === S.pickedId ? " picked" : "") + '"' +
        (jumpable ? ' data-pick="' + esc(grp.nodeId) + '" title="' + esc(t("selectOnCanvas")) + '"' : "") +
        ">" +
        '<div class="card-head">' +
        '<div style="flex:1;min-width:0">' +
        '<div class="ch-name">' + esc(grp.own ? d.name : grp.nodeName) + "</div>" +
        '<div class="ch-sub">' + esc(grp.own ? t("effectsHere") : t("effectsNested") + " · " + grp.depth) + "</div>" +
        "</div></div>";

      var summary = grp.items.map(function (it) { return val(it.label) + " " + it.summary; }).join("  ·  ");
      var firstIcon = effectIcon(grp.items[0] && grp.items[0].type);

      if (grp.style) {
        // A named effect style is the spec — show the token, hide the numbers.
        var key = "eff" + i;
        h += stylePill(grp.style, "", key, firstIcon);
        if (S.detail[key]) {
          h += '<div class="detail-box">';
          for (var j = 0; j < grp.items.length; j++) {
            h += '<div class="prow"><span class="pk">' + esc(val(grp.items[j].label)) + "</span>" +
              '<span class="pv mono">' + esc(grp.items[j].summary) + "</span></div>" +
              rowsHtml(grp.items[j].rows);
          }
          h += "</div>";
        } else {
          h += '<div class="muted mono" style="font-size:10px">' + esc(summary) + "</div>";
        }
      } else {
        for (var k = 0; k < grp.items.length; k++) {
          var it = grp.items[k];
          var ikey = "eff" + i + "_" + k;
          h += stylePill(val(it.label), it.summary, ikey, effectIcon(it.type));
          if (S.detail[ikey]) h += '<div class="detail-box">' + rowsHtml(it.rows) + "</div>";
        }
      }
      h += "</div>";
    }
    if (d.effects.truncated) h += '<div class="muted">' + esc(t("truncatedList")) + "</div>";
    return h;
  }

  /* ---------------- wiring ---------------- */

  function wire(d) {
    main.querySelectorAll("[data-sec]").forEach(function (el) {
      el.onclick = function () {
        var id = el.getAttribute("data-sec");
        S.open[id] = !S.open[id];
        var body = main.querySelector('[data-secbody="' + id + '"]');
        el.classList.toggle("closed", !S.open[id]);
        if (body) body.classList.toggle("hidden", !S.open[id]);
      };
    });

    // Deliberately does NOT stop propagation: copying a value or token should
    // also select the layer its row points at, so the click falls through to
    // the row's [data-pick] handler. Rows without one just copy.
    main.querySelectorAll("[data-copy]").forEach(function (el) {
      el.onclick = function () { copyText(el.getAttribute("data-copy")); };
    });

    main.querySelectorAll("[data-nav]").forEach(function (el) {
      el.onclick = function (ev) {
        ev.stopPropagation();
        // Remember which tree row we jumped from, so stepping back can point
        // at it again — the tree re-roots at the main component in between and
        // would otherwise come back fully collapsed. Filed under the tree it
        // belongs to: jumping from A into A's main and then on from 가 leaves a
        // marker in each, so every step back finds its own.
        var from = el.getAttribute("data-nav-from");
        var root = S.node && S.node.tree ? S.node.tree.rootId : null;
        if (from && root) S.origins[root] = { id: from, gen: -1 };
        navTo(el.getAttribute("data-nav"), false, el.hasAttribute("data-focus"));
      };
    });

    // Selecting a layer from a row: canvas follows, panel stays where it is.
    main.querySelectorAll("[data-pick]").forEach(function (el) {
      el.onclick = function (ev) {
        ev.stopPropagation();
        pickLayer(el.getAttribute("data-pick"), el);
      };
    });

    main.querySelectorAll("[data-tree]").forEach(function (el) {
      el.onclick = function (ev) {
        ev.stopPropagation();
        S.treeOpen[el.getAttribute("data-tree")] = el.classList.contains("closed");
        renderBody();
      };
    });

    // Double-clicking anywhere on a row expands/collapses it — the caret is a
    // small target. The single clicks that precede it still select the layer.
    main.querySelectorAll("[data-expand]").forEach(function (el) {
      el.ondblclick = function (ev) {
        ev.stopPropagation();
        var id = el.getAttribute("data-expand");
        S.treeOpen[id] = !treeIsOpen({ id: id });
        renderBody();
      };
    });

    main.querySelectorAll("[data-hover]").forEach(function (el) {
      var id = el.getAttribute("data-hover");
      el.addEventListener("mouseenter", function () { hoverStart(id); });
      el.addEventListener("mouseleave", function () { hoverStop(id); });
    });

    main.querySelectorAll("[data-tip]").forEach(function (el) {
      var text = el.getAttribute("data-tip");
      el.addEventListener("mouseenter", function () { showTip(el, text); });
      el.addEventListener("mouseleave", hideTip);
    });

    main.querySelectorAll("[data-tab]").forEach(function (el) {
      el.onclick = function (ev) {
        ev.stopPropagation();
        if (el.disabled) return;
        settleScroll();
        S.tab = el.getAttribute("data-tab");
        renderBody();
      };
    });

    var propsBtn = main.querySelector("[data-props-toggle]");
    if (propsBtn) {
      propsBtn.onclick = function (ev) {
        ev.stopPropagation();
        S.propsOpen = !S.propsOpen;
        renderBody();
      };
    }

    wireExport();

    var thumbBtn = main.querySelector("[data-thumb-toggle]");
    if (thumbBtn) {
      thumbBtn.onclick = function (ev) {
        ev.stopPropagation();  // don't collapse the section
        S.showThumbs = !S.showThumbs;
        savePrefs();
        renderBody();
      };
    }

    var sizeInput = main.querySelector("[data-thumb-size]");
    if (sizeInput) {
      sizeInput.onclick = function (ev) { ev.stopPropagation(); };
      // Resize live while dragging; only persist once the drag settles.
      sizeInput.oninput = function (ev) {
        ev.stopPropagation();
        S.thumbSize = parseInt(sizeInput.value, 10) || 24;
        main.querySelectorAll("[data-thumb]").forEach(function (img) {
          if (img.parentNode && img.parentNode.style) {
            img.parentNode.style.width = S.thumbSize + "px";
            img.parentNode.style.height = S.thumbSize + "px";
          }
        });
      };
      sizeInput.onchange = function (ev) { ev.stopPropagation(); savePrefs(); };
    }

    var collapseBtn = main.querySelector("[data-collapse-tree]");
    if (collapseBtn && d && d.tree) {
      collapseBtn.onclick = function (ev) {
        ev.stopPropagation();
        // Every row defaults collapsed, so a clean reset is a full collapse.
        S.treeOpen = {};
        renderBody();
      };
    }

    main.querySelectorAll("[data-detail]").forEach(function (el) {
      el.onclick = function (ev) {
        ev.stopPropagation();
        var k = el.getAttribute("data-detail");
        S.detail[k] = !S.detail[k];
        renderBody();
      };
    });

    // Column drag in the language table. The <col> is what actually sizes the
    // column, so the drag writes there and the cells follow.
    main.querySelectorAll("[data-tok-fmt]").forEach(function (b) {
      b.onclick = function (ev) {
        if (ev.stopPropagation) ev.stopPropagation();
        S.tokenDots = b.getAttribute("data-tok-fmt") === "dot";
        savePrefs();
        renderBody();
      };
    });

    main.querySelectorAll("[data-colres]").forEach(function (g) {
      g.onmousedown = function (ev) {
        if (ev.preventDefault) ev.preventDefault();
        if (ev.stopPropagation) ev.stopPropagation();
        var key = g.getAttribute("data-colres");
        var table = main.querySelector(".tr-table");
        var cols = table ? table.querySelectorAll("col") : [];
        // The grip lives in its own header cell, so its index is the column's.
        var idx = -1, all = main.querySelectorAll("[data-colres]");
        for (var i = 0; i < all.length; i++) if (all[i] === g) idx = i;
        var col = cols[idx];
        if (!col) return;

        var startX = ev.clientX;
        var startW = parseInt(g.getAttribute("data-colw"), 10) || DEFAULT_COLS.mode;
        S.dragging = true;
        g.classList.add("on");

        var move = function (e) {
          // Floors at a readable width; no ceiling, since the wrapper scrolls.
          var next = Math.max(56, Math.round(startW + (e.clientX - startX)));
          col.style.width = next + "px";
          S.langCols[key] = next;
        };
        var up = function () {
          document.removeEventListener("mousemove", move, true);
          document.removeEventListener("mouseup", up, true);
          S.dragging = false;
          g.classList.remove("on");
          savePrefs();
        };
        document.addEventListener("mousemove", move, true);
        document.addEventListener("mouseup", up, true);
      };
      // The header row toggles nothing, but the cell underneath is a copy
      // target — a drag must not also copy.
      g.onclick = function (ev) { if (ev.stopPropagation) ev.stopPropagation(); };
    });

    main.querySelectorAll("[data-resize]").forEach(function (h) {
      h.addEventListener("mousedown", function (ev) {
        var key = h.getAttribute("data-resize");
        var box = main.querySelector('[data-rbox="' + key + '"]');
        if (!box) return;
        if (ev.preventDefault) ev.preventDefault();
        var startY = ev.clientY, startH = box.offsetHeight;
        S.dragging = true;

        var move = function (e) {
          var next = Math.max(70, Math.min(700, startH + (e.clientY - startY)));
          box.style.height = next + "px";
          S.heights[key] = next;
        };
        var up = function () {
          document.removeEventListener("mousemove", move, true);
          document.removeEventListener("mouseup", up, true);
          S.dragging = false;
          savePrefs();
        };
        document.addEventListener("mousemove", move, true);
        document.addEventListener("mouseup", up, true);
      });
    });

    if (d) requestPreviews(d);
    requestThumbs();

    // Export cards: scale is meaningless for SVG/PDF, and copying markup only
    // makes sense for SVG — both mirror how Figma's own export row behaves.
    main.querySelectorAll("[data-icon]").forEach(function (card) {
      var fmt = card.querySelector("[data-fmt]");
      var scale = card.querySelector("[data-scale]");
      var copyBtn = card.querySelector("[data-copysvg]");
      // wire() runs for every card on every render; one missing control here
      // would throw and leave the whole panel unwired, not just this card.
      if (!fmt || !scale || !copyBtn) return;
      // The card itself navigates, so its controls must swallow their clicks.
      card.querySelectorAll("select").forEach(function (el) {
        el.onclick = function (ev) { ev.stopPropagation(); };
      });
      var sync = function () {
        var vector = fmt.value === "SVG" || fmt.value === "PDF";
        scale.disabled = vector;
        copyBtn.style.display = fmt.value === "SVG" ? "" : "none";
      };
      var id = card.getAttribute("data-icon");
      var o = iconOpts(id);

      // Written straight back to state, without a re-render: the DOM already
      // shows the change, and Export all reads state.
      fmt.onchange = function () { o.fmt = fmt.value; sync(); };
      scale.onchange = function () { o.scale = parseFloat(scale.value || "1"); };
      sync();

      function rowFor(format) {
        var r = iconRow(id);
        r.format = format;
        return r;
      }

      var more = card.querySelector("[data-icon-more]");
      if (more) more.onclick = function (ev) { ev.stopPropagation(); o.open = !o.open; renderBody(); };

      [["data-icon-patch", "patchStroke"], ["data-icon-label", "labelParts"],
       ["data-icon-hidden", "dropInvisible"], ["data-icon-clip", "cleanClip"],
       ["data-icon-svgid", "svgIdAttribute"],
       ["data-icon-svgstroke", "svgSimplifyStroke"],
       ["data-icon-svgtext", "svgOutlineText"], ["data-icon-contents", "contentsOnly"]]
        .forEach(function (pair) {
          var el = card.querySelector("[" + pair[0] + "]");
          if (el) el.onclick = function (ev) { ev.stopPropagation(); o[pair[1]] = !o[pair[1]]; renderBody(); };
        });

      card.querySelector("[data-exp]").onclick = function (ev) {
        ev.stopPropagation();
        post({ type: "export-run", runId: startRun("download"), nodeId: id,
               rows: [rowFor(fmt.value)] });
      };
      copyBtn.onclick = function (ev) {
        ev.stopPropagation();
        post({ type: "export-run", runId: startRun("copy"), nodeId: id,
               rows: [rowFor("SVG")] });
      };
    });

    // Export all and its settings. Every icon goes out in one run, so the
    // results come back as a single zip rather than N blocked downloads.
    var expAll = main.querySelector("[data-export-all]");
    if (expAll && d && d.icons && d.icons.length) {
      var a = iconAllOpts();

      var allFmt = main.querySelector("[data-all-fmt]");
      if (allFmt) allFmt.onchange = function (ev) {
        ev && ev.stopPropagation && ev.stopPropagation();
        a.fmt = allFmt.value;
        applyToAllIcons(d, "fmt", a.fmt);
        renderBody();                       // cards and the scale control follow
      };
      var allScale = main.querySelector("[data-all-scale]");
      if (allScale) allScale.onchange = function (ev) {
        ev && ev.stopPropagation && ev.stopPropagation();
        a.scale = parseFloat(allScale.value || "1");
        applyToAllIcons(d, "scale", a.scale);
        renderBody();
      };
      var allMore = main.querySelector("[data-all-more]");
      if (allMore) allMore.onclick = function (ev) {
        ev.stopPropagation(); a.open = !a.open; renderBody();
      };
      [["data-all-patch", "patchStroke"], ["data-all-label", "labelParts"],
       ["data-all-hidden", "dropInvisible"], ["data-all-clip", "cleanClip"],
       ["data-all-svgid", "svgIdAttribute"], ["data-all-svgstroke", "svgSimplifyStroke"],
       ["data-all-svgtext", "svgOutlineText"], ["data-all-contents", "contentsOnly"]]
        .forEach(function (pair) {
          var el = main.querySelector("[" + pair[0] + "]");
          if (el) el.onclick = function (ev) {
            ev.stopPropagation();
            a[pair[1]] = !a[pair[1]];
            applyToAllIcons(d, pair[1], a[pair[1]]);
            renderBody();
          };
        });

      // Paging keeps the rendered card count flat; every setting and Export all
      // still act on the whole list, not just what is on screen.
      main.querySelectorAll("[data-icon-page]").forEach(function (b) {
        b.onclick = function (ev) {
          ev.stopPropagation();
          if (b.disabled) return;
          var pages = iconPageCount(d);
          var next = iconPageIndex(d) + (b.getAttribute("data-icon-page") === "next" ? 1 : -1);
          S.iconPage = Math.min(Math.max(0, next), pages - 1);
          renderBody();
          // A new page starts at its top, not wherever the last one was left.
          var tb = main.querySelector("[data-tabbody]");
          if (tb) tb.scrollTop = 0;
        };
      });

      expAll.onclick = function (ev) {
        ev.stopPropagation();
        post({
          type: "export-batch",
          runId: startRun("download", safeFile(S.node ? S.node.name : "icons")),
          items: d.icons.map(function (ic) {
            return { nodeId: ic.nodeId, row: iconRow(ic.nodeId) };
          }),
        });
      };
    }
  }

  /* ---------------- export handling ---------------- */

  var EXT  = { SVG: "svg", PNG: "png", JPG: "jpg", PDF: "pdf" };
  var MIME = { SVG: "image/svg+xml;charset=utf-8", PNG: "image/png",
               JPG: "image/jpeg", PDF: "application/pdf" };

  // A run is opened before posting and closed by "export-done". Results are
  // held until then, because a plugin iframe is only allowed ONE automatic
  // download per gesture — firing several drops all but the first, however far
  // apart they are spaced. So many files leave as a single zip, the same thing
  // Figma's own multi-asset export does.
  function startRun(mode, zipName) {
    var id = ++S.runSeq;
    S.runs[id] = { files: [], mode: mode, zipName: zipName || "export" };
    return id;
  }

  function handleExport(msg) {
    var run = S.runs[msg.runId];
    if (!run) return;                       // a run we already closed
    if (run.mode === "copy") {
      copyText(msg.svg !== undefined ? msg.svg : new TextDecoder().decode(msg.bytes));
      return;
    }
    // A patched SVG comes back as a string; everything else as bytes.
    run.files.push(msg.svg !== undefined
      ? { name: msg.name + ".svg", bytes: utf8(msg.svg), mime: MIME.SVG }
      : { name: msg.name + "." + (EXT[msg.format] || "png"), bytes: msg.bytes,
          mime: MIME[msg.format] || MIME.PNG });
  }

  // Counting up on the button itself, patched in place: a re-render per icon
  // would be hundreds of full redraws. S.exporting keeps the truth so any
  // render that does happen mid-run still shows the right label.
  function showExportProgress(msg) {
    if (!S.runs[msg.runId]) return;
    S.exporting = { done: msg.done, total: msg.total };
    var btn = main.querySelector("[data-export-all]");
    if (btn) btn.textContent = t("exportingN")(msg.done, msg.total);
  }

  function finishExport(msg) {
    var run = S.runs[msg.runId];
    delete S.runs[msg.runId];
    var wasRunning = !!S.exporting;
    S.exporting = null;
    if (wasRunning) renderBody();
    if (!run || run.mode === "copy" || !run.files.length) return;
    if (run.files.length === 1) {
      var f = run.files[0];
      download(new Blob([f.bytes], { type: f.mime }), f.name);
      return;
    }
    // A very large batch can run the tab out of memory building one buffer.
    // Failing loudly beats a button that quietly does nothing.
    var archive;
    try {
      archive = zip(run.files);
    } catch (e) {
      post({ type: "notify", message: t("exportTooBig") });
      return;
    }
    download(new Blob([archive], { type: "application/zip" }), run.zipName + ".zip");
  }

  /* --- a minimal store-only zip writer: no dependencies, and SVG/PNG payloads
         gain little from deflate anyway --- */

  function utf8(str) {
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xC0 | (c >> 6), 0x80 | (c & 63));
      else if (c >= 0xD800 && c <= 0xDBFF && i + 1 < str.length) {
        var cp = 0x10000 + ((c - 0xD800) << 10) + (str.charCodeAt(++i) - 0xDC00);
        out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      } else out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return new Uint8Array(out);
  }

  var CRC_TABLE = null;
  function crc32(bytes) {
    if (!CRC_TABLE) {
      CRC_TABLE = [];
      for (var i = 0; i < 256; i++) {
        var c = i;
        for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        CRC_TABLE[i] = c >>> 0;
      }
    }
    var crc = 0xFFFFFFFF;
    for (var j = 0; j < bytes.length; j++) {
      crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[j]) & 0xFF];
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  // Entry names are UTF-8 with the 0x0800 flag set, which is what the spec
  // says and what Finder, Windows and current tools all read. The `unzip`
  // binary macOS still ships is Info-ZIP 5.52, which predates that flag and
  // mangles non-ASCII names; the Info-ZIP Unicode Path extra field doesn't help
  // (it still prefers the name field), and the only encoding that satisfies it
  // replaces every non-ASCII character with an underscore. A correct name that
  // one obsolete tool misreads beats a destroyed name everywhere.
  function zip(files) {
    // Two icons can share a name; a zip with duplicate entries unpacks badly.
    var used = {}, entries = files.map(function (f) {
      var name = f.name;
      if (used[name]) {
        var dot = name.lastIndexOf(".");
        var stem = dot > 0 ? name.slice(0, dot) : name;
        var ext = dot > 0 ? name.slice(dot) : "";
        name = stem + " (" + (++used[f.name]) + ")" + ext;
      } else used[name] = 1;
      return { nameBytes: utf8(name), bytes: f.bytes, crc: crc32(f.bytes) };
    });

    var total = 22;
    entries.forEach(function (e) { total += 30 + e.nameBytes.length + e.bytes.length + 46 + e.nameBytes.length; });

    var buf = new Uint8Array(total), dv = new DataView(buf.buffer), o = 0;
    function u32(v) { dv.setUint32(o, v, true); o += 4; }
    function u16(v) { dv.setUint16(o, v, true); o += 2; }
    function raw(b) { buf.set(b, o); o += b.length; }

    entries.forEach(function (e) {
      e.offset = o;
      u32(0x04034b50); u16(20); u16(0x0800); u16(0);   // flag 0x800 = UTF-8 names
      u16(0); u16(0);                                   // no meaningful timestamp
      u32(e.crc); u32(e.bytes.length); u32(e.bytes.length);
      u16(e.nameBytes.length); u16(0);
      raw(e.nameBytes); raw(e.bytes);
    });

    var cdStart = o;
    entries.forEach(function (e) {
      u32(0x02014b50); u16(20); u16(20); u16(0x0800); u16(0);
      u16(0); u16(0);
      u32(e.crc); u32(e.bytes.length); u32(e.bytes.length);
      u16(e.nameBytes.length); u16(0); u16(0);
      u16(0); u16(0); u32(0);
      u32(e.offset);
      raw(e.nameBytes);
    });

    // Capture the directory's extent BEFORE the trailer starts moving o along,
    // or its reported size comes out as long as the trailer written so far.
    var cdSize = o - cdStart;
    u32(0x06054b50); u16(0); u16(0);
    u16(entries.length); u16(entries.length);
    u32(cdSize); u32(cdStart); u16(0);
    return buf;
  }

  function safeFile(name) {
    return String(name || "export").replace(/[\\/:*?"<>|]+/g, "-").replace(/^\.+/, "").slice(0, 60) || "export";
  }

  function download(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------------- language ---------------- */

  function applyLang() {
    $("apptitle").textContent = t("title");
    render(); // renderNavbar redraws the language toggle from S.lang
  }

  function setLang(l) {
    if (S.lang === l) return;
    S.lang = l;
    post({ type: "set-lang", lang: l });
    applyLang();
  }
  $("refresh").onclick = function () { post({ type: "refresh" }); };

  // A wheel scroll slides rows under a stationary pointer, firing mouseenter on
  // each one — that would thrash the canvas selection and, when a queued state
  // flushed, re-render mid-scroll. Lock hovering until the pointer really moves.
  // Never re-render mid-scroll: replacing innerHTML kills the browser's scroll
  // momentum, and restoring scrollTop afterwards then fights it.
  main.addEventListener("scroll", function () {
    hideTip();
    S.hoverLock = true;   // rows sliding under a still pointer must not preview
    cancelHover();
    S.scrolling = true;
    if (S.scrollTimer) clearTimeout(S.scrollTimer);
    S.scrollTimer = setTimeout(function () {
      S.scrolling = false;
      S.scrollTimer = null;
      flushPending();
    }, 180);
  }, true);

  // Real pointer movement releases the scroll hover-lock. A DOM swap fires
  // mouseenter but never mousemove, which is exactly what we want to ignore.
  document.addEventListener("mousemove", function () {
    if (S.hoverLock && !S.dragging) S.hoverLock = false;
  }, true);

  // The pointer can leave without a row's mouseleave arriving (fast exits, the
  // window losing focus); without this the canvas would keep the preview.
  document.addEventListener("mouseleave", function () { endHover(); });
  window.addEventListener("blur", function () { endHover(); });

  applyLang();
  post({ type: "ready" });
</script>
</body>
</html>
