<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
/* @ds:begin — generated from doc/design-system. Edit there, then run `node scripts/sync-ds.mjs`. */
/* =========================================================================
   Figma Plugins — Shared Design Tokens
   Source of truth: doc/design-system/. Synced into each plugin by
   `node scripts/sync-ds.mjs` (see doc/design-system/README.md).
   =========================================================================
   Foundation layer: colors, type, resets. Load this before components.css.

   These are Figma plugin UI tokens: every color variable maps to a
   `--figma-color-*` CSS variable that the Figma desktop app injects at
   runtime (so the UI auto-matches the user's light/dark theme), with a
   static fallback for contexts where that variable isn't defined (e.g.
   previewing this file outside a Figma plugin iframe).

   If you're building a plain web app (not a Figma plugin), just drop the
   var(--figma-color-*, ...) wrapper and keep the fallback hex as the value.
   ========================================================================= */

:root {
  /* ---- color: surfaces ---- */
  --bg:        var(--figma-color-bg, #fff);              /* page / panel background */
  --bg-2:      var(--figma-color-bg-secondary, #f5f5f5);  /* recessed surface: headers, code blocks, field backgrounds */
  --bg-hover:  var(--figma-color-bg-hover, #f0f0f0);      /* hover state for rows, buttons, tabs */
  --bg-sel:    var(--figma-color-bg-selected, #e5f0ff);   /* selected / active row background */

  /* ---- color: borders & text ---- */
  --border:    var(--figma-color-border, #e6e6e6);
  --text:      var(--figma-color-text, #1a1a1a);          /* primary text */
  --text-2:    var(--figma-color-text-secondary, #888);   /* secondary / muted text, labels, hints */
  --text-3:    var(--figma-color-text-tertiary, #b3b3b3); /* faint text: prefixes, placeholders, chevrons */
  --bg-3:      var(--figma-color-bg-tertiary, #e9e9e9);   /* pills, switch track, scrollbar thumb */

  /* ---- color: brand & semantic ---- */
  --brand:      var(--figma-color-bg-brand, #0d99ff);     /* primary action, active states, focus accents */
  --brand-text: var(--figma-color-text-onbrand, #fff);    /* text/icon color on top of --brand */
  --text-brand: var(--figma-color-text-brand, #007be5);   /* brand-colored text on a normal surface (links, aliases) */
  --red:        var(--figma-color-text-danger, #f24822);  /* error text */
  /* Status surfaces are mixed from the text color rather than taken from Figma's
     bg-*-secondary tokens, which are solid fills in the dark theme. */
  --red-bg:     color-mix(in srgb, var(--red) 12%, var(--bg));   /* error surface (tint) */
  --red-solid:  var(--figma-color-bg-danger, #f24822);     /* destructive fill (danger button, danger menu hover) */
  --warn:       var(--figma-color-text-warning, #b86200);  /* warning text */
  --warn-bg:    color-mix(in srgb, var(--warn) 14%, var(--bg));  /* warning surface (tint) */
  --success:    var(--figma-color-icon-success, #14ae5c);  /* "live" / ok indicator dot */

  /* ---- elevation (floating layers only: tooltip, menu, dialog) ---- */
  --shadow-float: 0 8px 24px rgba(0, 0, 0, .3);
  --scrim:        rgba(0, 0, 0, .35);

  /* ---- typography ---- */
  --font-ui:   Inter, -apple-system, system-ui, sans-serif;
  --mono:      ui-monospace, Menlo, Consolas, monospace;

  /* ---- type scale (used inline throughout components.css) ----
     11px  – secondary/meta text (counts, hints, table sub-lines)
     12px  – base body size (default on <html>)
     13px  – panel title
     Weights: 400 body, 500 buttons/tabs/labels, 600 emphasis/headings */
}

/* Two extra reference-only tokens some UI components below hard-code by hex
   rather than a --figma-* variable, because they're Figma editor accent
   colors (component purple, slot pink) rather than theme-adaptive tokens.
   Keep them literal if you copy those components. */
:root {
  --figma-component-purple: #8a38f5;
  --figma-slot-pink: #ff45c0;
}

* { box-sizing: border-box; }

/* Native scrollbars render light-on-light in dark theme, so paint them from
   theme tokens instead. color-scheme covers overlay scrollbars some
   platforms draw; the webkit rules cover the rest. */
html { color-scheme: light dark; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--figma-color-bg-tertiary, #c9c9cd);
  border: 3px solid transparent;
  border-radius: 6px;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background-color: var(--text-2); background-clip: padding-box; }

/* Figma injects its theme <style> ahead of the plugin's HTML, so the page runs
   in quirks mode, where tables don't inherit font size (they fall back to 16px). */
table { font-size: inherit; }

html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: var(--font-ui);
  font-size: 12px; color: var(--text); background: var(--bg);
}

/* =========================================================================
   Figma Plugins — Shared Component Library
   =========================================================================
   Source of truth: doc/design-system/. Do not edit the copy inside a plugin's
   ui.html (between the @ds markers) — edit here, then `node scripts/sync-ds.mjs`.
   Load tokens.css first. Every color/spacing value here references a
   variable from tokens.css — don't hard-code new hex values into a
   component; add a token instead so both files stay themeable.

   General conventions used throughout:
   - Border radius: 4px (xs controls) / 5-6px (default) / 50% (circular icon buttons)
   - Border: 1px solid var(--border) almost everywhere
   - Font sizes: 11px (meta/secondary), 12px (body/default), 13px (title)
   - Font weights: 400 (body), 500 (interactive labels), 600 (emphasis)
   - Hover = var(--bg-hover) background swap, no color/shadow tricks
   - Active/selected = var(--bg-sel) background + var(--brand) border
   ========================================================================= */

body { display: flex; flex-direction: column; height: 100vh; }

/* ---- app header ---- */
header {
  display: flex; flex-direction: column; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
header .hrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
header .title { font-weight: 600; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* right-hand cluster of the top row: actions, then the language toggle last */
.hactions { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-shrink: 0; }

/* ---- segmented control (e.g. language switch, unit toggle) ---- */
.lang-toggle, .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.lang-btn, .seg-btn {
  border: none; border-radius: 0; padding: 4px 11px; font-size: 12px;
  background: var(--bg); color: var(--text-2); font-weight: 500; cursor: pointer;
}
.seg-btn { padding: 4px 10px; font-size: 11px; font-family: var(--mono); }
.seg-btn + .seg-btn { border-left: 1px solid var(--border); }
.lang-btn.active, .seg-btn.active { background: var(--brand); color: var(--brand-text); }
.seg-btn.active { font-weight: 600; }
.lang-btn:hover:not(.active), .seg-btn:hover:not(.active) { background: var(--bg-hover); }

/* ---- layout shell: header / scrolling body ---- */
/* `main` itself never scrolls — only `.tabbody` does, so scrolling inside a
   tab can't drag the whole panel. */
main {
  flex: 1; min-height: 0; padding: 0; position: relative;
  display: flex; flex-direction: column; overflow: hidden;
}
.top-fixed { flex-shrink: 0; padding: 12px 12px 0; }
.tabbody { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; }

.muted { color: var(--text-2); }
.center-msg {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; height: 100%; gap: 10px; color: var(--text-2); padding: 24px;
}
.empty-pane {
  height: 100%; display: flex; align-items: center; justify-content: center;
  color: var(--text-2); text-align: center; padding: 8px;
}
.empty { padding: 34px 18px; text-align: center; color: var(--text-2); line-height: 1.5; }
.empty .empty-t { font-weight: 600; color: var(--text); margin-bottom: 4px; font-size: 12px; }

/* ---- buttons ---- */
button {
  padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-family: inherit; font-size: 12px;
  cursor: pointer; font-weight: 500;
}
button:hover:not(:disabled) { background: var(--bg-hover); }
button:disabled { opacity: 0.38; cursor: default; }
button.primary { background: var(--brand); color: var(--brand-text); border-color: var(--brand); }
button.primary:hover:not(:disabled) { filter: brightness(1.05); }
button.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
button.ghost:hover:not(:disabled) { background: var(--bg-hover); }
button.full { width: 100%; }
button.sm { padding: 4px 8px; }
/* Secondary note inside a button, e.g. the scope of an action: "토큰 정리 · 현재 페이지" */
button .scope { color: var(--text-2); font-weight: 400; }
button .scope::before { content: '· '; }
button.xs { padding: 3px 7px; font-size: 11px; border-radius: 4px; }

.icon-btn {
  width: 30px; height: 26px; padding: 0; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn svg { width: 22px; height: 22px; display: block; }

/* ---- breadcrumb / back bar (navigation history) ---- */
.navbar {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; background: var(--bg-2);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.navbar .trail {
  flex: 1; min-width: 0; font-size: 11px; color: var(--text); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.navbtn {
  width: 26px; height: 26px; padding: 0; border-radius: 50%; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
}
.navbtn svg { width: 15px; height: 15px; display: block; }
.navbtn:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--text-2); }
.navbar .lang-toggle, header .lang-toggle { flex-shrink: 0; }
/* the language toggle is always compact in the top row (header or navbar) */
.navbar .lang-btn, header .lang-btn { padding: 2px 8px; font-size: 11px; }

/* ---- floating tooltip ---- */
/* position:fixed and outside scroll containers, so a pane with overflow:auto
   can't clip it. */
.tip {
  position: fixed; z-index: 200; max-width: 250px;
  background: var(--figma-color-bg-inverse, #1e1e1e);
  color: var(--figma-color-text-oninverse, #fff);
  padding: 7px 9px; border-radius: 6px; font-size: 11px; line-height: 1.45;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .3); pointer-events: none;
}
.tinfo {
  width: 11px; height: 11px; margin-left: 4px; flex-shrink: 0;
  display: inline-flex; align-items: center; vertical-align: -1px;
  opacity: .8; cursor: help; pointer-events: auto;
}
.tinfo:hover { opacity: 1; }
.tinfo svg { width: 100%; height: 100%; display: block; }

/* ---- resizable panes (drag handle, like a layers panel) ---- */
.rbox { position: relative; }
.rbox-body { overflow-y: auto; overflow-x: hidden; }
.rhandle {
  height: 11px; margin: 0 0 4px; cursor: ns-resize; user-select: none;
  display: flex; align-items: center; justify-content: center;
}
.rhandle::after {
  content: ""; width: 30px; height: 2px; border-radius: 2px;
  background: var(--border); transition: background .1s ease;
}
.rhandle:hover::after { background: var(--text-2); }

/* ---- tabs ---- */
.tabs {
  display: flex; gap: 2px; margin: 0 -12px 0; padding: 0 10px;
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.tab {
  border: none; background: transparent; border-radius: 0; margin-bottom: -1px;
  padding: 9px 10px; font-size: 12px; font-weight: 500; color: var(--text-2);
  border-bottom: 2px solid transparent; cursor: pointer;
  display: flex; align-items: center; gap: 5px; white-space: nowrap;
}
.tab:hover:not(:disabled) { background: transparent; }
.tab:hover:not(:disabled):not(.active) { color: var(--text); }
.tab.active { color: var(--text); font-weight: 600; border-bottom-color: var(--brand); }
.tab:disabled { opacity: .35; cursor: default; }
.tab .tb {
  font-size: 10px; font-weight: 600; color: var(--text-2);
  background: var(--figma-color-bg-tertiary, #e9e9e9);
  border-radius: 8px; padding: 0 6px; line-height: 15px;
}
.tab.active .tb { color: var(--text); }

/* ---- collapsible section ---- */
.sec { margin: 0 -12px; }
.sec-head {
  position: sticky; top: -12px; z-index: 5;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; background: var(--bg-2);
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: 12px; cursor: pointer; user-select: none;
}
.sec-head:hover { background: var(--bg-hover); }
.sec-head .caret {
  width: 15px; flex-shrink: 0; color: var(--text-2); font-size: 14px;
  line-height: 1; transition: transform .1s ease; display: inline-block;
  transform-origin: 45% 50%;
}
.sec-head.closed .caret { transform: rotate(-90deg); }
.sec-head .sc { color: var(--text-2); font-weight: 400; }
.sec-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.sec-actions button { font-weight: 500; }
.sec-actions .mini {
  padding: 2px 4px; font-size: 11px; border: 1px solid var(--border);
  border-radius: 5px; background: var(--bg); color: var(--text);
  font-family: inherit; font-weight: 500;
}
.sec-actions .mini:disabled { opacity: .45; }
.sec-body { padding: 8px 12px 10px; }
.sec-body.hidden { display: none; }

/* ---- property row (label / value pair) ---- */
.prow { display: flex; align-items: baseline; gap: 8px; padding: 2px 0; line-height: 1.5; }
.prow .pk { color: var(--text-2); width: 104px; flex-shrink: 0; }
.prow .pv { flex: 1; min-width: 0; word-break: break-word; }
.prow.flag .pv { color: var(--brand); font-weight: 600; }
.copy { cursor: pointer; border-radius: 3px; padding: 1px 3px; margin: 0 -3px; }
.copy:hover { background: var(--bg-hover); }
.mono { font-family: var(--mono); }

/* ---- token pill (e.g. a bound variable name) ---- */
.tok {
  display: inline-block; margin-left: 6px; font-size: 11px; font-family: var(--mono);
  padding: 1px 6px; border-radius: 4px; word-break: break-all; cursor: pointer;
  background: var(--figma-color-bg-tertiary, #e9e9e9);
  color: var(--text); border: 1px solid var(--border);
}
.tok:hover { background: var(--bg-hover); border-color: var(--text-2); }
.tok-none {
  display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px;
  color: var(--text-2); border: 1px dashed var(--border); font-style: italic;
}

/* ---- swatch (color preview square) ---- */
.sw {
  width: 10px; height: 10px; border-radius: 2px; border: 1px solid var(--border);
  display: inline-block; vertical-align: -1px; margin-right: 5px; flex-shrink: 0;
}

/* checkerboard background for translucent/transparent content previews */
.checker {
  background-color: #f0f0f2;
  background-image:
    linear-gradient(45deg, #dededf 25%, transparent 25%, transparent 75%, #dededf 75%),
    linear-gradient(45deg, #dededf 25%, transparent 25%, transparent 75%, #dededf 75%);
  background-size: 10px 10px;
  background-position: 0 0, 5px 5px;
}

/* ---- labeled field chip (e.g. layout inspector: "W 240") ---- */
.lp { display: flex; flex-direction: column; gap: 8px; }
.lp-row { display: flex; align-items: flex-start; gap: 8px; }
.lp-row .lp-label { width: 96px; flex-shrink: 0; color: var(--text-2); padding-top: 5px; line-height: 1.3; }
.lp-fields { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lp-fields.cols4 { display: grid; grid-template-columns: repeat(4, 1fr); flex-wrap: nowrap; }
.lp-fields.cols4 .lp-field { min-width: 0; }
.lp-fields.cols4 .lp-fv { overflow: hidden; text-overflow: ellipsis; }
.lp-field {
  display: inline-flex; align-items: center; gap: 5px; min-width: 0;
  padding: 4px 7px; border: 1px solid var(--border); border-radius: 5px;
  background: var(--bg-2); max-width: 100%;
}
.lp-field .lp-fk {
  font-size: 10px; font-weight: 600; color: var(--text-2); flex-shrink: 0;
  letter-spacing: .02em; text-transform: uppercase;
}
.lp-field .lp-fv { font-family: var(--mono); word-break: break-all; }
.lp-field .lp-fm { color: var(--text-2); font-size: 11px; flex-shrink: 0; }
.lp-field .tok { margin-left: 1px; }
.lp-ic { width: 12px; height: 12px; flex-shrink: 0; color: var(--text-2); display: inline-flex; }
.lp-ic svg { width: 100%; height: 100%; display: block; }

/* ---- checkbox row (custom checkbox, ticks/toggles) ---- */
.lp-check, .hcheck {
  display: inline-flex; align-items: center; gap: 6px; color: var(--text-2);
}
.hcheck { gap: 5px; flex-shrink: 0; padding: 2px 5px; border-radius: 4px; cursor: pointer; user-select: none; font-weight: 500; }
.hcheck:hover { background: var(--bg-hover); color: var(--text); }
.hcheck.on { color: var(--text); }
.lp-check .box, .hcheck .box {
  width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; line-height: 1; flex-shrink: 0; background: var(--bg);
}
.lp-check.on .box, .hcheck.on .box { background: var(--brand); border-color: var(--brand); color: var(--brand-text); }
.lp-check.on { color: var(--text); }

/* ---- subsection divider inside a section (e.g. Fill / Stroke groups) ---- */
.subsec {
  font-weight: 600; margin: 12px 0 6px; padding-top: 10px;
  border-top: 1px solid var(--border);
}
.subsec:first-child { margin-top: 0; padding-top: 0; border-top: none; }

/* ---- data table ---- */
.tr-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
/* table-layout:fixed makes a dragged column width land exactly */
.tr-table { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 12px; table-layout: fixed; }
.tr-table th, .tr-table td {
  padding: 6px 9px; text-align: left; vertical-align: top;
  border-bottom: 1px solid var(--border); white-space: pre-wrap; overflow-wrap: break-word;
}
.tr-table tr:last-child th, .tr-table tr:last-child td { border-bottom: none; }
.tr-table thead th {
  background: var(--bg-2); font-weight: 600; position: sticky; top: 0; z-index: 2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tr-table thead th .tr-def { color: var(--text-2); font-weight: 400; font-size: 11px; }
.tr-name {
  position: sticky; left: 0; z-index: 1; background: var(--bg);
  font-weight: 600; word-break: break-all; border-right: 1px solid var(--border);
}
.tr-desc { color: var(--text-2); font-weight: 400; word-break: break-word; border-right: 1px solid var(--border); }
.tr-desc.none { color: var(--text-2); opacity: .55; }
.tr-table thead .tr-name { z-index: 3; background: var(--bg-2); }
.tr-table tbody tr { cursor: pointer; }
.tr-table tbody td:hover, .tr-table tbody .tr-name:hover { background: var(--bg-hover); }
.tr-table td.empty { color: var(--red); font-style: italic; }
.tr-sub { color: var(--text-2); font-weight: 400; font-size: 11px; margin-top: 2px; }
/* copy affordance revealed on cell hover */
.cp-ic { margin-left: 5px; color: var(--text-2); visibility: hidden; font-size: 11px; }
.tr-table td:hover .cp-ic, .tr-table .tr-name:hover .cp-ic { visibility: visible; }
/* column resize handle */
.colres { position: absolute; top: 0; right: -4px; bottom: 0; width: 9px; cursor: col-resize; z-index: 6; }
.colres::after {
  content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 1px;
  background: var(--brand); opacity: 0; transition: opacity .1s ease;
}
.colres:hover::after, .colres.on::after { opacity: 1; }
.tr-pad { padding: 0 !important; }

/* ---- form controls ---- */
select, .exp-num, .exp-suffix {
  padding: 5px 6px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); font-family: inherit; font-size: 12px;
}
select { font-size: 11px; cursor: pointer; }
select:disabled { opacity: .4; cursor: default; }
.exp-num { width: 56px; padding: 5px 6px; }

/* range slider */
.thumb-size {
  width: 64px; height: 20px; margin: 0 3px; padding: 0; cursor: pointer; flex-shrink: 0;
  -webkit-appearance: none; appearance: none; background: transparent;
}
.thumb-size::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--text-2); opacity: .5; }
.thumb-size:hover::-webkit-slider-runnable-track { opacity: .75; }
.thumb-size::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; margin-top: -4px;
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--brand); cursor: pointer;
  border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--text-2);
}

/* ---- card ---- */
.card { border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; margin-bottom: 6px; }
.card-head { display: flex; align-items: center; gap: 6px; }
.card-head .ch-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.card-head .ch-sub { color: var(--text-2); font-size: 11px; }
.card.own { border-color: var(--brand); }
.card.clickable { cursor: pointer; }
.card.clickable:hover { background: var(--bg-hover); }
/* selected/picked state, reused for tree rows and cards alike */
.picked { background: var(--bg-sel) !important; border-color: var(--brand) !important; border-radius: 6px; }

/* ---- header/summary card (e.g. an inspected item's identity block) ---- */
.var-head { background: var(--bg-2); border-radius: 6px; padding: 8px 10px; }
.var-head .leaf { font-weight: 600; word-break: break-all; }
.var-head .grp { color: var(--text-2); font-size: 11px; word-break: break-all; margin-top: 3px; }
.var-head .desc {
  margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border);
  color: var(--text-2); line-height: 1.45; white-space: pre-wrap; word-break: break-word;
}
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.badge {
  font-size: 11px; padding: 1px 7px; border-radius: 10px;
  background: var(--bg); border: 1px solid var(--border); color: var(--text-2);
}

/* ---- style pill (e.g. a picked text/fill/effect style) ---- */

/* ---- tree row (nested, expandable list — e.g. a layer/component tree) ---- */
.trow {
  display: flex; align-items: center; gap: 6px;

.tcount { color: var(--text-2); font-size: 11px; flex-shrink: 0; }
.tcaret {
  width: 17px; height: 17px; flex-shrink: 0; text-align: center; color: var(--text-2);

}
.tcaret:hover { background: var(--bg-hover); color: var(--text); }

}
.tthumb img, .icon-prev img { max-width: 100%; max-height: 100%; display: block; }
.icon-prev {
  width: 44px; height: 44px; margin-right: 9px; border-radius: 4px;

  background-image:

}
.icon-prev img { max-width: 82%; max-height: 82%; }

/* ---- category tags (fixed brand colors — match Figma's own editor accents) ---- */
/* Slot pink, matching the color Figma gives slots in the editor. */
.tslot {
  flex-shrink: 0; font-size: 10px; font-weight: 600; line-height: 16px;
  text-transform: uppercase; letter-spacing: .03em; padding: 0 6px; border-radius: 8px;

}
/* Component purple, matching the color Figma gives components in the editor. */
.tvariant {
  flex-shrink: 0; font-size: 10px; font-weight: 600; line-height: 16px;
  text-transform: uppercase; letter-spacing: .03em; padding: 0 6px; border-radius: 8px;

}
.text-badge {
  flex-shrink: 0; font-size: 10px; font-weight: 600; line-height: 16px;

/* ---- auto layout direction widget ---- */
.al-widget { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.al-grid {
  width: 46px; height: 46px; flex-shrink: 0; padding: 4px;

}

.al-bars { display: flex; align-items: center; justify-content: center; gap: 2px; }
.al-bars.spread { justify-content: space-between; }
.al-bars.h { flex-direction: row; height: 100%; }
.al-bars.v { flex-direction: column; width: 100%; }
.al-bar { background: var(--brand); border-radius: 1px; }

.content-box {

/* ---- pagination ---- */
.pager {

}

.arrow { color: var(--text-2); flex-shrink: 0; }

.sc-sw {

  position: relative; overflow: hidden;
}
.sc-sw i { position: absolute; inset: 0; display: block; }
.sc-val { font-family: var(--mono); flex-shrink: 0; }
.sc-mid { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sc-count { color: var(--text-2); font-size: 11px; flex-shrink: 0; }
.eff-item { padding: 4px 0 0; }

.eff-title { display: flex; align-items: center; gap: 6px; }

/* ---- Export-panel specific composites ---- */
.exp-row { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; flex-shrink: 0; }
.exp-row .grow { flex: 1; min-width: 0; }
.exp-row select { min-width: 0; }
.dots { letter-spacing: 1px; padding: 4px 6px; }

.exp-more { border: 1px solid var(--border); border-radius: 6px; padding: 8px 9px; margin: 0 0 8px; background: var(--bg-2); }

/* =========================================================================
   Additions shared by i18n / Config Manager / Arrow Connect /
   Change Marker. Same visual language as above: tokens only, 6px radius,
   12px text, hover = --bg-hover, focus/selected = --brand.
   ========================================================================= */

/* ---- text inputs ---- */
input:not([type]), input[type="text"], input[type="password"], input[type="number"],
input[type="search"], input[type="date"], textarea {
  padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); font-family: inherit; font-size: 12px;
  min-width: 0;
}
textarea { line-height: 1.4; resize: vertical; }
input:not([type]):focus, input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus,
input[type="search"]:focus, input[type="date"]:focus, textarea:focus, select:focus { outline: none; border-color: var(--brand); }
input:disabled, textarea:disabled { opacity: .4; }
input.invalid, textarea.invalid { border-color: var(--red); }
::placeholder { color: var(--text-3); }
/* borderless until hovered — inline rename fields */
input.bare { border-color: transparent; background: transparent; }
input.bare:hover { border-color: var(--border); }
input.bare:focus { border-color: var(--brand); background: var(--bg); }

/* labeled field: small muted label above its control */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field > label, .field > .lbl { color: var(--text-2); font-size: 11px; font-weight: 500; }
.field-err { color: var(--red); font-size: 11px; }

/* ---- semantic buttons ---- */
button.danger { color: var(--red); }
button.danger-fill { background: var(--red-solid); border-color: var(--red-solid); color: var(--brand-text); }
button.danger-fill:hover:not(:disabled) { background: var(--red-solid); filter: brightness(1.05); }
button.selected { background: var(--bg-sel); border-color: transparent; color: var(--text-brand); }
button.selected:disabled { opacity: 1; }

/* ---- small pills: warning / danger / link variants of .badge ---- */
.badge.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.badge.danger { background: var(--red-bg); border-color: transparent; color: var(--red); }
.badge.link { background: var(--bg-sel); border-color: transparent; color: var(--text-brand); cursor: pointer; }

/* ---- inline notices ---- */
.notice {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px; margin-bottom: 8px;
  border: 1px dashed var(--border); border-radius: 6px; color: var(--text-2); font-size: 11px; line-height: 1.4;
}
.notice > span:not(.ico) { flex: 1; }
/* Colored text on a tinted surface is hard to read (especially in dark mode),
   so status notices keep body text at --text and carry the color in a left bar. */
.notice.err, .notice.warn, .notice.info {
  border-style: solid; border-width: 1px 1px 1px 3px; color: var(--text); font-size: 12px; line-height: 1.45;
}
.notice.err { border-color: var(--red); background: var(--red-bg); }
.notice.warn { border-color: var(--warn); background: var(--warn-bg); }
.notice.info { border-color: var(--border); border-left-color: var(--brand); background: var(--bg-2); }
.notice .ico { flex: 0 0 14px; width: 14px; height: 14px; margin-top: 1px; }
.notice.err .ico { color: var(--red); }
.notice.warn .ico { color: var(--warn); }

/* ---- toast (in-panel, bottom) ---- */
.toast {
  position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 60;
  padding: 8px 10px; border-radius: 6px; font-size: 12px; white-space: pre-line;
  background: var(--red-bg); color: var(--red); display: none;
}
.toast.show { display: block; }
.toast.warn { background: var(--warn-bg); color: var(--warn); }

/* ---- modal dialog (Figma's iframe blocks window.confirm/prompt) ---- */
.overlay {

}
.dialog {

}
.dialog input { width: 100%; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 6px; }

/* ---- dropdown menu (dark, like Figma's own menus) ---- */
.menu {

  background: var(--figma-color-bg-menu, #1e1e1e); color: var(--figma-color-text-menu, #fff);

.menu-item { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
.menu-item .meta { margin-left: auto; opacity: .55; font-size: 11px; white-space: nowrap; }
.menu-item .check { width: 12px; flex: none; text-align: center; }
.menu-item:hover, .menu-item.active { background: var(--brand); color: var(--brand-text); }
.menu-item:hover .meta, .menu-item.active .meta { opacity: .85; }
.menu-item.danger { color: var(--figma-color-text-menu-danger, #ff8a7a); }
.menu-item.danger:hover, .menu-item.danger.active { background: var(--red-solid); color: var(--brand-text); }
.menu-empty { padding: 8px; opacity: .6; }
.menu-sep { height: 1px; margin: 4px 2px; background: rgba(255, 255, 255, .12); }

/* ---- toggle switch (on <input type=checkbox class=switch> or a <span>) ---- */
.switch {
  appearance: none; -webkit-appearance: none; position: relative; flex: none; margin: 0; cursor: pointer;
  width: 28px; height: 16px; border-radius: 8px; background: var(--bg-3); transition: background .12s;

.switch:checked, .switch.on { background: var(--brand); }
.switch:checked::after, .switch.on::after { left: 14px; }
.switch:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* ---- window resize grip (bottom-right; plugin resizes itself via figma.ui.resize) ---- */
.resize-grip {
  position: fixed; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; z-index: 120;
  background: linear-gradient(135deg, transparent 50%, var(--text-3) 50%, var(--text-3) 58%, transparent 58%,
    transparent 70%, var(--text-3) 70%, var(--text-3) 78%, transparent 78%);
}

/* ---- busy spinner ---- */
.spin {
  width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; display: inline-block;
  border: 2px solid var(--border); border-top-color: var(--brand); animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- footer bar ---- */
.foot {
  flex-shrink: 0; padding: 8px 12px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-2); line-height: 1.4;
}

      "Top": "위", "Bottom": "아래", "Scale": "비율", "Columns": "열", "Rows": "행",
      "Truncate": "잘라내기",
      "Solid": "실선", "Dashed": "점선", "Custom": "사용자 지정",
      "Left and right": "좌우", "Top and bottom": "상하",
      "Inside": "안쪽", "Outside": "바깥쪽",
      "Space between": "양끝 정렬", "Balance": "균형", "Uppercase": "대문자",
      "Lowercase": "소문자", "Title": "첫 글자 대문자", "Underline": "밑줄",
      "Strikethrough": "취소선", "Height": "높이", "Width and height": "너비와 높이",
      "Truncate (…)": "말줄임 (…)", "Image": "이미지",
    },
  };

  function t(k) {
    var d = T[S.lang] || T.en;
    return d[k] !== undefined ? d[k] : (T.en[k] !== undefined ? T.en[k] : k);
  }
  function lbl(k) {
    var d = L[S.lang];
    if (d && d[k]) return d[k];
    return k.replace(/([A-Z])/g, " $1").replace(/^./, function (c) { return c.toUpperCase(); });
  }
  function val(v) {
    var d = V[S.lang];
    if (d && d[v]) return d[v];
    return v;
  }

  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function post(m) { parent.postMessage({ pluginMessage: m }, "*"); }

  function copyText(s) {
    var ta = document.createElement("textarea");
    ta.value = s;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    var short = s.length > 40 ? s.slice(0, 40) + "…" : s;
    post({ type: "notify", message: t("copied") + short });
  }

  /* ---------------- incoming ---------------- */

  onmessage = function (e) {
    var msg = e.data.pluginMessage;
    if (!msg) return;

    if (msg.type === "state") {
      // Rendering replaces main.innerHTML, which destroys the row under the
      // cursor; the browser then fires mouseenter on its replacement and a new
      // hover starts by itself. With a state push already in flight that loops,
      // and the canvas flickers with the mouse completely still. So while a
      // hover is live we hold the newest state and apply it once it ends.
      if (S.hoveredId || S.scrolling) { S.pendingState = msg; return; }
      applyState(msg);
    } else if (msg.type === "export-data") {
      handleExport(msg);
    } else if (msg.type === "export-progress") {
      showExportProgress(msg);
    } else if (msg.type === "export-done") {
      finishExport(msg);
    } else if (msg.type === "thumb-data") {
      var turl = bytesToPng(msg.bytes);
      S.thumbs[msg.nodeId] = turl;
      // more than one row can be an instance of the same component
      main.querySelectorAll('[data-thumb="' + msg.nodeId + '"]').forEach(function (im) {
        im.src = turl;
        im.style.display = "";
      });
    } else if (msg.type === "preview-data") {
      var url = bytesToPng(msg.bytes);
      S.previews[msg.nodeId] = url;
      var img = main.querySelector('[data-prev="' + msg.nodeId + '"]');
      if (img) { img.src = url; img.style.display = ""; }
    }
  };

  function applyState(msg) {
    {
      if (msg.lang) S.lang = msg.lang;
      if (msg.prefs && !S.prefsInit) {
        if (msg.prefs.heights) S.heights = msg.prefs.heights;
        if (msg.prefs.thumbs) {
          if (typeof msg.prefs.thumbs.show === "boolean") S.showThumbs = msg.prefs.thumbs.show;
          if (msg.prefs.thumbs.size) S.thumbSize = msg.prefs.thumbs.size;
        }
        if (msg.prefs.langCols) S.langCols = msg.prefs.langCols;
        if (typeof msg.prefs.tokenDots === "boolean") S.tokenDots = msg.prefs.tokenDots;
        S.prefsInit = true;
      }
      // Walking the trail keeps every marker on it; picking a different layer
      // is a fresh start and drops them all. Note that one navigation produces
      // TWO state pushes — selectionchange fires as the selection is set, and
      // navNode pushes again — so "same layer as we're already showing" has to
      // count as no movement, or the second push wipes the trail.
      var sameNode = !!(S.node && msg.node && msg.node.id === S.node.id);
      var onTarget = !!(S.navTarget && msg.node && msg.node.id === S.navTarget);
      recordHistory(msg.node);
      if (!sameNode && !onTarget) S.origins = {};
      // The suppression belongs to the layer Forward landed on, and one
      // navigation pushes twice, so it survives until the selection moves on.
      if (!msg.node || msg.node.id !== S.noMark) S.noMark = null;

      S.selection = msg.selection;
      S.node = msg.node || null;
      S.pinned = !!msg.pinned;
      S.count = msg.count || 0;
      S.error = msg.error || "";
      if (S.node && S.node.id !== S.lastId) {
        S.detail = {};
        S.pickedId = null;
        S.iconPage = 0;
        S.exportInner = true;
        S.lastId = S.node.id;
      }
      // Export settings belong to the layer, so reseed when the layer changes.
      if (S.node && S.exportFor !== S.node.id) {
        S.exportRows = (S.node.exportSettings && S.node.exportSettings.length)
          ? S.node.exportSettings.map(function (r) { return Object.assign({}, r); })
          : [defaultExportRow(0)];
        S.exportFor = S.node.id;
      }
      // Collapsed/expanded rows survive selection changes inside the same tree;
      // they only reset once the tree re-roots somewhere else.
      var rootId = S.node && S.node.tree ? S.node.tree.rootId : null;
      if (rootId !== S.lastTreeRoot) {
        S.treeOpen = {};
        S.treeGen++;
        S.lastPathId = null;
        S.lastTreeRoot = rootId;
      }
      applyLang();
    }
  }

  /* ---------------- render ---------------- */

  function render() {
    renderNavbar();
    renderBody();
  }

  // The tab bar is part of the panel, not part of the selection: switching
  // layers — or deselecting entirely — leaves you on the tab you were on, and
  // each tab answers for itself with an empty state.
  function renderBody() {
    hideTip();
    cancelHover();
    var d = (S.selection === "node" && S.node) ? S.node : null;

    var body = tabBody(d);
    if (d && d.warnings && d.warnings.length) {
      body += '<div class="muted" style="margin-top:12px;font-size:11px">⚠ ' +
        d.warnings.map(esc).join("<br>⚠ ") + "</div>";
    }

    var h =
      '<div class="top-fixed">' + structureBlock(d) + "</div>" +
      tabsHtml(d, tabCounts(d)) +
      '<div class="tabbody" data-tabbody>' + body + "</div>";

    // Replacing innerHTML throws away scrollTop; without this, a re-render
    // triggered mid-scroll (a queued state flushing, say) snaps the tree and
    // the tab body back to the top.
    var scrolls = captureScroll();
    main.innerHTML = h;
    restoreScroll(scrolls);
    wire(d);
  }

  function captureScroll() {
    var out = {};
    main.querySelectorAll("[data-rbox]").forEach(function (el) {
      out["r:" + el.getAttribute("data-rbox")] = el.scrollTop;
    });
    var tb = main.querySelector("[data-tabbody]");
    if (tb) out.tab = tb.scrollTop;
    return out;
  }

  function restoreScroll(pos) {
    main.querySelectorAll("[data-rbox]").forEach(function (el) {
      var v = pos["r:" + el.getAttribute("data-rbox")];
      if (v) el.scrollTop = v;
    });
    var tb = main.querySelector("[data-tabbody]");
    if (tb && pos.tab) tb.scrollTop = pos.tab;
  }

  function tabBody(d) {
    if (!d) {
      if (S.selection === "multiple") return emptyState(t("multipleTitle"), t("multipleBody"));
      if (S.selection === "error")    return emptyState(t("errorTitle"), S.error);
      return emptyState(t("nothingTitle"), t("nothingBody"));
    }
    if (S.tab === "info")     return headerCard(d);
    if (S.tab === "language") {
      return d.translation ? languageTab(d) : emptyState(t("noLangTitle"), t("noLangBody"));
    }
    if (S.tab === "icons") {
      return (d.icons && d.icons.length) ? iconsTab(d) : emptyState(t("noIconsTitle"), t("noIconsBody"));
    }
    if (S.tab === "export") {
      return d.exportable ? exportTab(d) : emptyState(t("noExportTitle"), t("noExportBody"));
    }
    return inspectTab(d);
  }

  function emptyPane(text) {
    return '<div class="empty-pane">' + esc(text) + "</div>";
  }

  function emptyState(title, body) {
    return '<div class="empty"><div class="empty-t">' + esc(title) + "</div>" +
      (body ? "<div>" + esc(body) + "</div>" : "") + "</div>";
  }

  // A pane with a user-draggable max height; content scrolls inside it.
  function rbox(key, inner) {
    if (!inner) return "";
    var hgt = S.heights[key] || DEFAULT_HEIGHTS[key];
    return '<div class="rbox">' +
      '<div class="rbox-body" data-rbox="' + esc(key) + '" style="height:' + hgt + 'px">' + inner + "</div>" +
      '<div class="rhandle" data-resize="' + esc(key) + '" title="' + esc(t("dragResize")) + '"></div>' +
      "</div>";
  }

  function navArrow(forward) {
    var d = forward ? "M6 3.5L10.5 8L6 12.5" : "M10 3.5L5.5 8L10 12.5";
    return '<svg viewBox="0 0 16 16"><path d="' + d + '" fill="none" stroke="currentColor" ' +
      'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function renderNavbar() {
    var nav = $("navbar");
    nav.innerHTML =
      '<button id="navback" class="navbtn"' + (S.back.length ? "" : " disabled") +
      ' title="' + esc(t("back")) + '">' + navArrow(false) + "</button>" +
      '<button id="navfwd" class="navbtn"' + (S.fwd.length ? "" : " disabled") +
      ' title="' + esc(t("forward")) + '">' + navArrow(true) + "</button>" +
      '<span class="trail">' + esc(S.node ? S.node.name : "") + "</span>";
    $("navback").onclick = function () { step(S.back, S.fwd, false); };
    $("navfwd").onclick = function () { step(S.fwd, S.back, true); };
    // Language toggle: header, right end — the same spot in every plugin.
    var lt = $("langtoggle");
    lt.innerHTML =
      '<button class="lang-btn' + (S.lang === "ko" ? " active" : "") + '" data-lang="ko">한국어</button>' +
      '<button class="lang-btn' + (S.lang === "en" ? " active" : "") + '" data-lang="en">EN</button>';
    lt.querySelectorAll("[data-lang]").forEach(function (el) {
      el.onclick = function () { setLang(el.getAttribute("data-lang")); };
    });
  }

  // Move one entry between the two history stacks, browser-style. focus:true —
  // stepping through history lands on layers that are usually off-screen, so
  // the viewport follows, the same as Go to Main Component.
  function step(from, to, forward) {
    var target = from.pop();
    if (!target) return;
    settleScroll();
    if (S.node) to.push({ id: S.node.id, name: S.node.name });
    S.navTarget = target.id;
    // Back returns you to somewhere you left, so "you went on from here" is
    // worth pointing at. Forward moves toward where you had already gone —
    // there is nothing to point back at, so it lands unmarked.
    S.noMark = forward ? target.id : null;
    post({ type: "nav-node", nodeId: target.id, focus: true });
  }

  // Opening something from the tree also selects it on the canvas, so the state
  // comes back through selectionchange.
  // keepTree is set only by rows inside the structure tree: browsing the tree
  // shouldn't re-root it, but selecting a layer anywhere else should.
  // focus moves the canvas viewport, which only "Go to Main Component" wants —
  // every other row leaves the camera alone.
  function navTo(id, keepTree, focus) {
    if (!id || (S.node && id === S.node.id)) return;
    settleScroll();
    if (S.node) { S.back.push({ id: S.node.id, name: S.node.name }); S.fwd = []; }
    S.navTarget = id;
    S.noMark = null;            // a fresh move, not a step forward
    post({ type: "nav-node", nodeId: id, keepTree: !!keepTree, focus: !!focus });
  }

  // Every node we land on becomes a history entry, however we got there —
  // clicking the tree, or just selecting a different layer on the canvas.
  function recordHistory(newNode) {
    // Deselecting ends the session's trail — nothing to go back to.
    if (!newNode) { S.back = []; S.fwd = []; S.navTarget = null; return; }
    // A repeat push for the layer already on screen isn't a move. Leaving it
    // alone matters: one navigation pushes twice (selectionchange, then
    // navNode), and treating the second as a move logs a duplicate entry, which
    // is what makes Back appear to skip a step.
    if (S.node && S.node.id === newNode.id) return;
    if (S.navTarget && newNode.id === S.navTarget) {
      S.navTarget = null;      // a deliberate back/forward/tree move; stacks already set
      return;
    }
    S.navTarget = null;
    if (S.node) {
      S.back.push({ id: S.node.id, name: S.node.name });
      S.fwd = [];
    }
  }

  /* --- building blocks --- */

  function sec(id, title, bodyHtml, countLabel, actionsHtml) {
    if (!bodyHtml) return "";
    var closed = !S.open[id];
    return '<div class="sec">' +
      '<div class="sec-head' + (closed ? " closed" : "") + '" data-sec="' + id + '">' +
      '<span class="caret">▾</span><span>' + esc(title) + "</span>" +
      (countLabel ? ' <span class="sc">' + esc(countLabel) + "</span>" : "") +
      (actionsHtml ? '<span class="sec-actions">' + actionsHtml + "</span>" : "") +
      "</div>" +
      '<div class="sec-body' + (closed ? " hidden" : "") + '" data-secbody="' + id + '">' +
      bodyHtml + "</div></div>";
  }

  function rowsHtml(rows) {
    if (!rows || !rows.length) return "";
    var h = "";
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      h += '<div class="prow' + (r.flag ? " flag" : "") + '">' +
        '<span class="pk">' + esc(r.raw ? r.k : lbl(r.k)) + "</span>" +
        '<span class="pv"><span class="copy" data-copy="' + esc(r.c !== undefined ? r.c : r.v) + '">' + esc(val(r.v)) + "</span>" +
        (r.tok ? tokHtml(r.tok) : "") + "</span></div>";
    }
    return h;
  }

  // Figma groups variables with slashes; most code-side token systems address
  // them with dots. The copied value follows the display, since pasting into
  // code is the whole point of the pill — the tooltip keeps the Figma path so
  // the original name is never lost.
  function tokenFormat(name, dots) {
    var s = String(name === null || name === undefined ? "" : name);
    return dots ? s.replace(/\//g, ".") : s;
  }

  function tokenName(name) { return tokenFormat(name, S.tokenDots); }

  function tokHtml(name) {
    var shown = tokenName(name);
    var title = shown === String(name) ? shown : shown + "  ·  " + name;
    return '<span class="tok copy" data-copy="' + esc(shown) + '" title="' + esc(title) + '">' +
      esc(shown) + "</span>";
  }

  function paintsHtml(list, label) {
    if (!list || !list.length) return "";
    var h = "";
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var name = label + (list.length > 1 ? " " + (i + 1) : "");
      h += '<div class="prow' + (p.visible === false ? " muted" : "") + '">' +
        '<span class="pk">' + esc(name) + "</span>" +
        '<span class="pv">' + (p.kind === "gradient" ? gradientBody(p) : solidBody(p)) +
        (p.visible === false ? ' <span class="hidden-flag">(' + esc(t("hidden")) + ")</span>" : "") +
        "</span></div>";
    }
    return h;
  }

  function solidBody(p) {
    return (p.swatch ? '<span class="sw" style="background:' + esc(p.swatch) + '"></span>' : "") +
      '<span class="copy mono" data-copy="' + esc(p.swatch || p.summary) + '">' + esc(val(p.summary)) + "</span>" +
      (p.style ? tokHtml(p.style) : "") +
      (p.tok ? tokHtml(p.tok) : "");
  }

  // Gradients need room: the kind on one line, the stops on the next, and the
  // per-stop tokens on a third — all joined by the same arrow so the columns
  // line up visually.
  function gradientBody(p) {
    var css = "linear-gradient(90deg," + (p.gradient || []).join(",") + ")";
    var h = '<span class="sw" style="background:' + esc(css) + '"></span>' +
      '<span>' + esc(val(p.label || "Gradient")) + "</span>" +
      (p.style ? tokHtml(p.style) : "") +
      '<div class="pv-line mono copy" data-copy="' + esc(p.summary) + '">' + esc(p.summary) + "</div>";
    if (p.hasTokens) {
      h += '<div class="pv-line">' + p.tokens.map(function (tk) {
        return tk ? tokHtml(tk) : '<span class="tok-none">' + esc(t("noToken")) + "</span>";
      }).join('<span class="arrow">→</span>') + "</div>";
    }
    return h;
  }

  /* --- node view --- */

  // Hover preview exists only in the Language table: hovering a string row
  // shows which text layer uses it. Everywhere else, clicking is the way to
  // reach a layer.
  function hoverStart(id) {
    // hoverLock covers scrolling: rows sliding under a stationary pointer fire
    // mouseenter, which would thrash the canvas selection. Released by real
    // pointer movement.
    if (!id || S.hoverLock || S.hoveredId === id) return;
    S.hoveredId = id;
    post({ type: "hover-layer", nodeId: id });
  }

  // Cancel without flushing a queued state (used by render, so applying a
  // state can't recurse).
  function cancelHover() {
    if (!S.hoveredId) return;
    S.hoveredId = null;
    post({ type: "hover-end" });
  }

  function endHover() {
    cancelHover();
    if (!S.scrolling) flushPending();
  }

  // Only act if this row still owns the hover — the browser can fire a
  // sibling's mouseenter before this row's mouseleave.
  function hoverStop(id) {
    if (S.hoveredId !== id) return;
    endHover();
  }

  function showTip(el, text) {
    var tip = $("tip");
    if (!tip || !text || !el.getBoundingClientRect) return;
    tip.textContent = text;
    tip.style.display = "block";
    var r = el.getBoundingClientRect();
    var vw = (typeof window !== "undefined" && window.innerWidth) || 400;
    var left = Math.max(6, Math.min(r.left - 4, vw - tip.offsetWidth - 6));
    // Prefer above the icon; drop below when there isn't room.
    var top = r.top - tip.offsetHeight - 6;
    if (top < 6) top = r.bottom + 6;
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }

  function hideTip() {
    var tip = $("tip");
    if (tip) tip.style.display = "none";
  }

  function wireExport() {
    var rows = S.exportRows;
    if (!rows) return;

    // Every control writes into the row and re-renders; the panel is small
    // enough that a full re-render is cheaper than surgical DOM updates.
    function bind(sel, handler) {
      main.querySelectorAll(sel).forEach(function (el, i) {
        var row = rows[rowIndexOf(el, i)];
        if (!row) return;
        var run = function (ev) { if (ev && ev.stopPropagation) ev.stopPropagation(); handler(row, el); renderBody(); };
        if (el.tagName === "SELECT" || el.tagName === "INPUT") { el.onchange = run; el.onclick = stop; }
        else el.onclick = run;
      });
    }
    function stop(ev) { if (ev && ev.stopPropagation) ev.stopPropagation(); }
    function rowIndexOf(el, fallback) { return fallback; }

    bind("[data-exp-scale]", function (row, el) {
      var v = el.value;
      if (v === "W") { row.scaleMode = "WIDTH"; row.scaleValue = row.scaleValue || 100; }
      else if (v === "H") { row.scaleMode = "HEIGHT"; row.scaleValue = row.scaleValue || 100; }
      else { row.scaleMode = "SCALE"; row.scaleValue = parseFloat(v); }
    });
    bind("[data-exp-scaleval]", function (row, el) { row.scaleValue = parseFloat(el.value) || 1; });
    bind("[data-exp-format]", function (row, el) {
      var was = row.format;
      row.format = el.value;
      // SVG has options of its own; open the panel so they're not two clicks deep
      if (row.format === "SVG" && was !== "SVG") row.open = true;
    });
    bind("[data-exp-suffix]", function (row, el) { row.suffix = el.value; });
    bind("[data-exp-profile]", function (row, el) { row.colorProfile = el.value; });
    bind("[data-exp-resample]", function (row, el) { row.resampling = el.value; });
    bind("[data-exp-more]", function (row) { row.open = !row.open; });
    bind("[data-exp-contents]", function (row) { row.contentsOnly = !row.contentsOnly; });
    bind("[data-exp-patch]", function (row) { row.patchStroke = !row.patchStroke; });
    bind("[data-exp-label]", function (row) { row.labelParts = !row.labelParts; });
    bind("[data-exp-hidden]", function (row) { row.dropInvisible = !row.dropInvisible; });
    bind("[data-exp-clip]", function (row) { row.cleanClip = !row.cleanClip; });
    bind("[data-exp-svgid]", function (row) { row.svgIdAttribute = !row.svgIdAttribute; });
    bind("[data-exp-svgstroke]", function (row) { row.svgSimplifyStroke = !row.svgSimplifyStroke; });
    bind("[data-exp-svgtext]", function (row) { row.svgOutlineText = !row.svgOutlineText; });

    main.querySelectorAll("[data-exp-del]").forEach(function (el, i) {
      el.onclick = function (ev) {
        stop(ev);
        rows.splice(i, 1);
        renderBody();
      };
    });

    var add = main.querySelector("[data-export-add]");
    if (add) add.onclick = function (ev) { stop(ev); rows.push(defaultExportRow(rows.length)); renderBody(); };

    var prev = main.querySelector("[data-export-preview]");
    if (prev) prev.onclick = function (ev) { stop(ev); S.exportPreview = !S.exportPreview; renderBody(); };

    var inner = main.querySelector("[data-export-inner]");
    if (inner) inner.onclick = function (ev) { stop(ev); S.exportInner = !S.exportInner; renderBody(); };

    var run = main.querySelector("[data-export-run]");
    if (run && S.node) {
      run.onclick = function (ev) {
        stop(ev);
        var target = exportTarget(S.node);
        post({ type: "export-run", runId: startRun("download", safeFile(target.name)),
               nodeId: target.id, rows: rows.map(function (r) {
          return {
            format: r.format, scaleMode: r.scaleMode, scaleValue: r.scaleValue,
            suffix: r.suffix, contentsOnly: r.contentsOnly,
            colorProfile: r.colorProfile, resampling: r.resampling,
            svgIdAttribute: r.svgIdAttribute,
            svgOutlineText: r.svgOutlineText,
            svgSimplifyStroke: r.svgSimplifyStroke,
            patchStroke: r.patchStroke,
            labelParts: r.labelParts,
            dropInvisible: r.dropInvisible,
            cleanClip: r.cleanClip,
          };
        }) });
      };
    }
  }

  function savePrefs() {
    post({ type: "set-prefs", prefs: {
      heights: S.heights,
      thumbs: { show: S.showThumbs, size: S.thumbSize },
      langCols: S.langCols,
      tokenDots: S.tokenDots,
    } });
  }

  function flushPending() {
    if (!S.pendingState) return;
    var m = S.pendingState;
    S.pendingState = null;
    applyState(m);
  }

  // Selecting a layer from a row never re-points the panel — the main thread
  // swallows that selectionchange — so the canvas is the only feedback. Mark
  // the clicked row too, so the panel shows which one you picked.
  function pickLayer(raw, el) {
    if (!raw) return;
    S.pickedId = raw;   // the whole list, so the row marker matches on re-render
    // Clicking marks the row immediately instead of waiting for a re-render, so
    // this has to enforce the single-highlight rule too: clearing only .picked
    // would leave the previous selection's green sitting next to the new one.
    if (el && el.classList) {
      main.querySelectorAll(".picked").forEach(function (p) { p.classList.remove("picked"); });
      main.querySelectorAll(".trow").forEach(function (p) {
        p.classList.remove("self");
        p.classList.remove("origin");
      });
      el.classList.add("picked");
    }
    post({ type: "select-layer", nodeIds: raw.split(",") });
  }

  // A click means any in-progress scroll is over, so a fresh state can render.
  function settleScroll() {
    cancelHover();
    S.pendingState = null;
    S.scrolling = false;
    if (S.scrollTimer) { clearTimeout(S.scrollTimer); S.scrollTimer = null; }
  }

  /* --- tabs --- */

  function tabCounts(d) {
    if (!d) return { language: 0, icons: 0 };
    return {
      language: d.translation ? d.translation.rows.length : 0,
      icons:    d.icons ? d.icons.length : 0,
    };
  }

  function tabsHtml(d, c) {
    var defs = [
      ["info", t("tabInfo"), null],
      ["inspect", t("tabInspect"), null],
      ["language", t("tabLanguage"), c.language],
      ["icons", t("tabIcons"), c.icons],
      ["export", t("tabExport"), null],
    ];
    return '<div class="tabs">' + defs.map(function (def) {
      var id = def[0], count = def[2];
      return '<button class="tab' + (S.tab === id ? " active" : "") + '" data-tab="' + id + '">' +
        esc(def[1]) + (count ? '<span class="tb">' + count + "</span>" : "") + "</button>";
    }).join("") + "</div>";
  }

  /* --- tab bodies --- */

  function inspectTab(d) {
    var h = tokenOptsHtml();
    h += sec("scroll", t("secScroll"), scrollHtml(d));
    h += sec("layout", t("secLayout"), layoutHtml(d));
    h += sec("typography", t("secTypography"), typeHtml(d));
    h += sec("content", t("secContent"), contentHtml(d));
    h += sec("appearance", t("secAppearance"), appearanceHtml(d));
    h += sec("colors", t("secColors"), colorsHtml(d), colorsCount(d));
    h += sec("effects", t("secEffects"), effectsHtml(d), effectsCount(d));
    h += sec("grids", t("secGrids"), gridsHtml(d));
    h += sec("modes", t("secModes"), d.modes ? rowsHtml(d.modes) : "");
    return h;
  }

  // Both options are spelled out rather than described, so choosing is a
  // comparison instead of a guess: each button IS its format. The labels come
  // from the same formatter the pills use, so the control can never advertise
  // something the panel doesn't do.
  var TOKEN_EXAMPLE = "group/sub-group/token";

  function tokenOptsHtml() {
    function seg(dots) {
      return '<button class="seg-btn' + (S.tokenDots === dots ? " active" : "") +
        '" data-tok-fmt="' + (dots ? "dot" : "slash") + '">' +
        esc(tokenFormat(TOKEN_EXAMPLE, dots)) + "</button>";
    }
    return '<div class="tok-opts">' +
      '<div class="tok-opts-head">' + esc(t("tokenFmtHead")) + infoIcon(t("tokenFmtTip")) + "</div>" +
      '<div class="seg">' + seg(true) + seg(false) + "</div></div>";
  }

  function structureBlock(d) {
    var body = d ? structureHtml(d) : emptyPane(t("noSelection"));
    var n = d && d.tree ? d.tree.count : 0;
    var actions = n ? thumbControls() + collapseAllBtn() : "";
    return sec("structure", t("secStructure"), rbox("structure", body), n ? String(n) : "", actions);
  }

  function thumbControls() {
    return (S.showThumbs
        ? '<input class="thumb-size" type="range" min="16" max="72" step="4" value="' + S.thumbSize +
          '" data-thumb-size title="' + esc(t("thumbSize")) + '" />'
        : "") +
      '<span class="hcheck' + (S.showThumbs ? " on" : "") + '" data-thumb-toggle title="' +
      esc(t("thumbToggle")) + '"><span class="box">' + (S.showThumbs ? "✓" : "") + "</span>" +
      esc(t("thumbLabel")) + "</span>";
  }

  function iconsTab(d) {
    var n = d.icons && d.icons.length ? d.icons.length : 0;
    if (!n) return sec("icons", t("secIcons"), iconsHtml(d), "", "");
    var a = iconAllOpts();
    // The section header is sticky, so the whole cluster stays put while the
    // card list scrolls under it.
    var actions =
      '<select data-all-scale class="mini"' + (a.fmt === "SVG" || a.fmt === "PDF" ? " disabled" : "") + ">" +
      [1, 2, 3, 4].map(function (m) {
        return '<option value="' + m + '"' + (m === a.scale ? " selected" : "") + ">" + m + "×</option>";
      }).join("") + "</select>" +
      '<select data-all-fmt class="mini">' +
      ["SVG", "PNG", "JPG", "PDF"].map(function (f) {
        return '<option value="' + f + '"' + (f === a.fmt ? " selected" : "") + ">" + f + "</option>";
      }).join("") + "</select>" +
      '<button class="xs ghost dots' + (a.open ? " on" : "") + '" data-all-more title="' +
      esc(t("exportSettings")) + '">•••</button>' +
      '<button class="xs primary" data-export-all' + (S.exporting ? " disabled" : "") + ">" +
      esc(S.exporting ? t("exportingN")(S.exporting.done, S.exporting.total) : t("exportAll")) +
      "</button>";
    // The options panel can't live in the sticky header without overlapping the
    // list, so it opens as the first thing in the body, right beneath it.
    var body = (a.open ? '<div class="all-opts">' + iconAllOptsHtml(a) + "</div>" : "") +
      (d.iconsTruncated
        ? '<div class="muted" style="padding:2px 2px 8px">' + esc(t("iconsTruncated")(n)) + "</div>"
        : "") +
      iconPagerHtml(d) + iconsHtml(d);
    return sec("icons", t("secIcons"), body, String(n), actions);
  }

  function iconAllOptsHtml(a) {
    return '<div class="exp-more">' +
      '<div class="exp-more-t">' + esc(t("exportAllSettings")) + "</div>" +
      expCheck("data-all-patch", a.patchStroke, t("svgPatch"), t("svgPatchTip")) +
      expCheck("data-all-label", a.labelParts, t("svgLabel"), t("svgLabelTip")) +
      expCheck("data-all-hidden", a.dropInvisible, t("svgDropHidden"), t("svgDropHiddenTip")) +
      expCheck("data-all-clip", a.cleanClip, t("svgCleanClip"), t("svgCleanClipTip")) +
      expCheck("data-all-svgid", a.svgIdAttribute, t("svgId"), t("svgIdTip")) +
      expCheck("data-all-svgstroke", a.svgSimplifyStroke, t("svgSimplify"), t("svgSimplifyTip")) +
      expCheck("data-all-svgtext", a.svgOutlineText, t("svgOutlineText"), t("svgOutlineTextTip")) +
      expCheck("data-all-contents", a.contentsOnly, t("ignoreOverlap"), t("ignoreOverlapTip")) +
      "</div>";
  }

  function languageTab(d) {
    return sec("language", t("secLanguage"), translationHtml(d),
      d.translation ? d.translation.collection : "");
  }

  function headerCard(d) {
    var h = '<div class="var-head">' +
      '<div class="leaf copy" data-copy="' + esc(d.name) + '">' + esc(d.name) + "</div>";

    if (d.main && !d.main.missing) {
      h += '<div class="grp">' + esc(t("instanceOf")) +
        '<span class="copy" data-copy="' + esc(d.main.name) + '"><b>' + esc(d.main.name) + "</b></span>" +
        (d.main.variant ? " · " + esc(d.main.variant) : "") +
        (d.main.remote ? " · " + esc(t("library")) : "") + "</div>";
    } else if (d.main && d.main.missing) {
      h += '<div class="grp">' + esc(t("detached")) + "</div>";
    }

    h += '<div class="badges">';
    for (var i = 0; i < d.badges.length; i++) {
      h += '<span class="badge' + (i === 0 ? " b-main" : "") + '">' + esc(val(d.badges[i])) + "</span>";
    }
    if (d.main && d.main.remote) h += '<span class="text-badge">' + esc(t("external")) + "</span>";
    h += "</div>";

    if (d.main && d.main.id && !d.main.missing && !d.main.remote && !d.main.isSelf) {
      h += '<div class="head-actions"><button class="sm" data-focus="1" data-nav="' + esc(d.main.id) + '">' +
        esc(t("mainBtn")) + "</button></div>";
    }

    if (d.description) h += '<div class="desc">' + esc(d.description) + "</div>";

    // Properties sit under the description, folded away by default.
    if (d.props && d.props.length) {
      h += '<div class="hp">' +
        '<button class="xs ghost" data-props-toggle>' +
        (S.propsOpen ? "▾ " : "▸ ") + esc(t("secProps")) + " (" + d.props.length + ")" +
        "</button>" +
        (S.propsOpen ? '<div class="hp-body">' + propsHtml(d) + "</div>" : "") +
        "</div>";
    }

    h += "</div>";
    return h;
  }

  /* --- component structure (wiki-style contents) --- */

  // key is what the thumbnail is OF (the main component, so instances of the
  // same component share one export); fromId is the row's own node, used to
  // resolve the component when it can't be reached by id.
  function thumbBox(key, fromId) {
    var src = S.thumbs[key];
    var px = S.thumbSize;
    return '<span class="tthumb" style="width:' + px + "px;height:" + px + 'px">' +
      '<img data-thumb="' + esc(key) + '" data-thumb-from="' + esc(fromId) + '"' +
      (src ? ' src="' + src + '"' : ' style="display:none"') + " /></span>";
  }

  // Only rows actually on screen are exported, and only once — the cache is
  // keyed by node, and the display size is pure CSS.
  function requestThumbs() {
    if (!S.showThumbs) return;
    var imgs = main.querySelectorAll("[data-thumb]");
    var asked = 0;
    for (var i = 0; i < imgs.length && asked < 40; i++) {
      var id = imgs[i].getAttribute("data-thumb");
      if (S.thumbs[id] || S.thumbAsked[id]) continue;
      S.thumbAsked[id] = true;
      asked++;
      post({ type: "thumb", nodeId: id, fromId: imgs[i].getAttribute("data-thumb-from") });
    }
  }

  function infoIcon(text) {
    return '<span class="tinfo" data-tip="' + esc(text) + '">' +
      '<svg viewBox="0 0 12 12">' +
      '<circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.2"/>' +
      '<rect x="5.4" y="5.1" width="1.2" height="3.9" rx=".6" fill="currentColor"/>' +
      '<circle cx="6" cy="3.3" r=".8" fill="currentColor"/></svg></span>';
  }

  function treeIsOpen(e) {
    return S.treeOpen[e.id] !== undefined ? S.treeOpen[e.id] : false;
  }

  function collapseAllBtn() {
    // Icon rather than a label: the header is narrow and shares space with the
    // thumbnail controls.
    return '<button class="xs ghost icon-btn" data-collapse-tree title="' + esc(t("collapseAll")) + '">' +
      '<svg viewBox="0 0 14 14">' +
      '<path d="M1.4 3h8M1.4 7h5.8M1.4 11h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' +
      '<path d="M9.4 8.6l3.2 3.2M12.6 8.6l-3.2 3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' +
      "</svg></button>";
  }

  // Decided once per render by structureHtml and read by treeRowHtml, which
  // runs synchronously underneath it. Exactly ONE row is ever highlighted, and
  // the most recent intent wins: a Go to Main Component marker, else the row
  // you clicked to select on canvas, else the inspected layer itself. They are
  // genuinely different rows — the panel keeps inspecting one layer while the
  // canvas selection moves to another — so without a single winner the tree
  // shows two selections at once.
  var originId = null;   // marker for this tree, if any
  var hlId = null;       // the row that gets the highlight
  var hlClass = "";      // which highlight it gets

  function treeHas(e, id) {
    if (e.id === id) return true;
    var kids = e.children || [];
    for (var i = 0; i < kids.length; i++) if (treeHas(kids[i], id)) return true;
    return false;
  }

  function structureHtml(d) {
    if (!d.tree) return "";
    var root = d.tree.root;

    // Reveal the selected layer when it changes, but leave the user's own
    // collapsing alone on every other render.
    if (d.id !== S.lastPathId) {
      openPathTo(root);
      S.lastPathId = d.id;
    }

    // Back on a tree we left: reveal the instance whose Go to Main Component we
    // followed. Highlighted only — the canvas selection stays where it is.
    // Re-expanded once per re-root, since re-rooting clears treeOpen; after that
    // the user's own collapsing stands.
    originId = null;
    var mo = S.noMark === d.id ? null : S.origins[d.tree.rootId];
    if (mo) {
      originId = mo.id;
      if (mo.gen !== S.treeGen) { openPathToId(root, mo.id); mo.gen = S.treeGen; }
    }

    hlId = null; hlClass = "";
    if (originId) { hlId = originId; hlClass = "origin"; }
    // A pick outside this tree (a colour swatch, say) leaves the tree's own
    // highlight alone rather than blanking it.
    else if (S.pickedId && treeHas(root, S.pickedId)) { hlId = S.pickedId; hlClass = "picked"; }

    // The anchored layer itself isn't listed — only its contents.
    if (!(root.children || []).length) {
      return '<div class="muted" style="padding:2px">' + esc(t("noNested")) + "</div>";
    }
    var h = kidsHtml(root.children);
    if (d.tree.truncated) h += '<div class="muted" style="padding:6px 6px 0">' + esc(t("truncatedList")) + "</div>";
    return h;
  }

  // Same, for an arbitrary node id rather than the selected one.
  function openPathToId(e, id) {
    if (e.id === id) return true;
    var found = false;
    var kids = e.children || [];
    for (var i = 0; i < kids.length; i++) {
      if (openPathToId(kids[i], id)) { S.treeOpen[e.id] = true; found = true; }
    }
    return found;
  }

  // Expand every ancestor of the current node so the highlight is visible.
  function openPathTo(e) {
    if (e.current) return true;
    var found = false;
    var kids = e.children || [];
    for (var i = 0; i < kids.length; i++) {
      if (openPathTo(kids[i])) { S.treeOpen[e.id] = true; found = true; }
    }
    return found;
  }

  function kidsHtml(kids) {
    return kids.map(function (c) {
      var h = treeRowHtml(c);
      if ((c.children || []).length && treeIsOpen(c)) {
        h += '<div class="tkids">' + kidsHtml(c.children) + "</div>";
      }
      return h;
    }).join("");
  }

  function treeRowHtml(e) {
    var glyph = e.type === "COMPONENT_SET" ? "◈" : (e.type === "COMPONENT" ? "◆" : (e.icon ? "★" : "◇"));
    var kids = (e.children || []).length;
    var open = treeIsOpen(e);
    // Only the selected layer is highlighted; every other row, root included,
    // stays clickable so you can walk back up the structure.
    var hl = hlId ? (e.id === hlId ? " " + hlClass : "") : (e.current ? " self" : "");
    return '<div class="trow' + (e.current ? " current" : "") + hl + '"' +
      (kids ? ' data-expand="' + esc(e.id) + '"' : "") +
      (e.current ? "" : ' data-pick="' + esc(e.id) + '" title="' + esc(t("selectOnCanvas")) + '"') + ">" +
      '<span class="tcaret' + (kids ? (open ? "" : " closed") : " leaf") + '"' +
      (kids ? ' data-tree="' + esc(e.id) + '"' : "") + ">▾</span>" +
      '<span class="tglyph">' + glyph + "</span>" +
      (S.showThumbs ? thumbBox(e.thumbId || e.id, e.id) : "") +
      '<span class="tname">' + esc(e.name) + "</span>" +
      (e.slot ? '<span class="tslot">' + esc(t("slot")) + infoIcon(t("slotTip")) + "</span>" : "") +
      (e.isVariant ? '<span class="tvariant" title="' + esc(t("variantTip")) + '">' +
        esc(t("variantBadge")) + "</span>" : "") +
      (kids && !open ? '<span class="tcount">' + kids + "</span>" : "") +
      (e.hidden ? '<span class="thidden">' + esc(t("hidden")) + "</span>" : "") +
      // A component from another file has no main component to jump to here.
      (e.remote
        ? '<span class="text-badge">' + esc(t("external")) + "</span>"
        // A variant has no main component to jump to — it IS one — so the row
        // offers to go to the variant itself, camera and all.
        : e.isVariant
          ? '<button class="xs tmain" style="white-space:nowrap" data-focus="1" data-nav="' +
            esc(e.id) + '" data-nav-from="' + esc(e.id) + '">' + esc(t("variantBtn")) + "</button>"
        : (e.mainId ? '<button class="xs tmain" style="white-space:nowrap" data-focus="1" data-nav="' +
            esc(e.mainId) + '" data-nav-from="' + esc(e.id) + '">' + esc(t("mainBtn")) + "</button>" : "")) +
      "</div>";
  }

  /* --- export: a mirror of Figma's own Export panel --- */

  var SCALE_STEPS = [0.5, 0.75, 1, 1.5, 2, 3, 4];

  // Figma pre-fills @2x, @3x… as you add rows; match that.
  function defaultExportRow(i) {
    var mult = i + 1;
    return {
      format: "PNG", scaleMode: "SCALE", scaleValue: mult,
      suffix: mult > 1 ? "@" + mult + "x" : "",
      contentsOnly: true, colorProfile: "SRGB",
      resampling: "BASIC",   // Basic rather than Figma's Detailed default
      svgIdAttribute: true,  // layer names become id attributes
      svgOutlineText: false,
      svgSimplifyStroke: true,
      patchStroke: true,     // repair the stroke-width Figma omits on groups
      labelParts: true,      // name the split fill/stroke paths
      dropInvisible: true,   // leave out layers parked at 0% opacity
      cleanClip: true,       // drop the clip path that only repeats the canvas
      open: false,
    };
  }

  function opts(list, cur) {
    return list.map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(cur) ? " selected" : "") +
        ">" + esc(o[1]) + "</option>";
    }).join("");
  }

  function exportTab(d) {
    var rows = S.exportRows || [defaultExportRow(0)];
    var h = '<div class="sec"><div class="sec-head" data-sec="export">' +
      '<span class="caret">▾</span><span>' + esc(t("secExport")) + "</span>" +
      '<span class="sec-actions"><button class="xs ghost icon-btn" data-export-add title="' +
      esc(t("addExport")) + '"><svg viewBox="0 0 14 14">' +
      '<path d="M7 2.4v9.2M2.4 7h9.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' +
      "</svg></button></span></div>" +
      '<div class="sec-body' + (S.open.export === false ? " hidden" : "") + '" data-secbody="export">';

    for (var i = 0; i < rows.length; i++) h += exportRowHtml(rows[i], i, rows.length);

    // Selecting the wrapper and exporting it gives you its layout box and a
    // root <g id="icon-frame">. The asset inside is what carries the real name.
    var target = exportTarget(d);
    if (d.exportAsset) {
      h += '<span class="hcheck' + (S.exportInner ? " on" : "") + '" data-export-inner' +
        ' title="' + esc(t("exportInnerTip")) + '" style="margin-top:10px">' +
        '<span class="box">' + (S.exportInner ? "✓" : "") + "</span>" +
        esc(t("exportInner")(d.exportAsset.name)) + "</span>";
    }
    h += '<button class="primary full" style="margin-top:10px" data-export-run>' +
      esc(t("exportNamed")(target.name)) + "</button>";

    // Preview reuses the thumbnail export, so it costs nothing extra.
    h += '<div class="exp-preview">' +
      '<button class="xs ghost" data-export-preview>' + (S.exportPreview ? "▾ " : "▸ ") +
      esc(t("preview")) + "</button>" +
      (S.exportPreview
        ? '<div class="exp-preview-box">' + thumbImg(d.id) + "</div>"
        : "") +
      "</div></div></div>";
    return h;
  }

  // Which layer the Export tab acts on: the icon inside the wrapper when there
  // is one and the option is on, otherwise the selection itself.
  function exportTarget(d) {
    return (d.exportAsset && S.exportInner) ? d.exportAsset : { id: d.id, name: d.name };
  }

  function thumbImg(id) {
    var src = S.thumbs[id];
    return '<img class="exp-preview-img" data-thumb="' + esc(id) + '" data-thumb-from="' + esc(id) + '"' +
      (src ? ' src="' + src + '"' : ' style="display:none"') + " />";
  }

  function expCheck(attr, on, label, tip) {
    return '<span class="hcheck' + (on ? " on" : "") + '" ' + attr +
      (tip ? ' title="' + esc(tip) + '"' : "") + ' style="margin-top:4px">' +
      '<span class="box">' + (on ? "✓" : "") + "</span>" + esc(label) + "</span>";
  }

  function exportRowHtml(r, i, total) {
    var raster = r.format === "PNG" || r.format === "JPG";
    var scaleOpts = SCALE_STEPS.map(function (v) { return [v, v + "×"]; })
      .concat([["W", t("widthMode")], ["H", t("heightMode")]]);
    var cur = r.scaleMode === "SCALE" ? r.scaleValue : (r.scaleMode === "WIDTH" ? "W" : "H");

    var h = '<div class="exp-row" data-exp-row="' + i + '">' +
      '<select data-exp-scale' + (raster ? "" : " disabled") + ">" + opts(scaleOpts, cur) + "</select>" +
      (raster && r.scaleMode !== "SCALE"
        ? '<input class="exp-num" type="number" min="1" value="' + esc(r.scaleValue) + '" data-exp-scaleval />'
        : "") +
      '<select class="grow" data-exp-format>' +
      opts([["PNG", "PNG"], ["JPG", "JPG"], ["SVG", "SVG"], ["PDF", "PDF"]], r.format) + "</select>" +
      '<button class="xs ghost dots' + (r.open ? " on" : "") + (r.format === "SVG" ? " has-opts" : "") +
      '" data-exp-more title="' + esc(t("exportSettings")) + '">•••</button>' +
      (total > 1
        ? '<button class="xs ghost" data-exp-del title="' + esc(t("removeExport")) + '">—</button>'
        : "") +
      "</div>";

    if (r.open) {
      h += '<div class="exp-more">' +
        '<div class="prow"><span class="pk">' + esc(t("suffix")) + "</span>" +
        '<span class="pv"><input type="text" class="exp-suffix" value="' + esc(r.suffix || "") +
        '" placeholder="' + esc(t("none")) + '" data-exp-suffix /></span></div>' +
        (raster
          ? '<div class="prow"><span class="pk">' + esc(t("colorProfile")) + "</span>" +
            '<span class="pv"><select data-exp-profile>' +
            opts([["SRGB", "sRGB"], ["DOCUMENT", t("documentProfile")], ["DISPLAY_P3_V4", "Display P3"]], r.colorProfile) +
            "</select></span></div>" +
            '<div class="prow"><span class="pk">' + esc(t("resampling")) + "</span>" +
            '<span class="pv"><select data-exp-resample>' +
            opts([["BASIC", t("basic")], ["DETAILED", t("detailed")]], r.resampling) +
            "</select></span></div>"
          : "") +
        (r.format === "SVG"
          ? '<div class="exp-checks">' +
            expCheck("data-exp-patch", r.patchStroke, t("svgPatch"), t("svgPatchTip")) +
            expCheck("data-exp-label", r.labelParts, t("svgLabel"), t("svgLabelTip")) +
            expCheck("data-exp-hidden", r.dropInvisible, t("svgDropHidden"), t("svgDropHiddenTip")) +
            expCheck("data-exp-clip", r.cleanClip, t("svgCleanClip"), t("svgCleanClipTip")) +
            expCheck("data-exp-svgid", r.svgIdAttribute, t("svgId"), t("svgIdTip")) +
            expCheck("data-exp-svgstroke", r.svgSimplifyStroke, t("svgSimplify"), t("svgSimplifyTip")) +
            expCheck("data-exp-svgtext", r.svgOutlineText, t("svgOutlineText"), t("svgOutlineTextTip")) +
            "</div>"
          : "") +
        expCheck("data-exp-contents", r.contentsOnly, t("ignoreOverlap"), t("ignoreOverlapTip")) +
        "</div>";
    }
    return h;
  }

  /* --- icons: same controls as Figma's export panel, minus having to select
         the icon layer itself --- */

  // Icon cards get the same settings the Export tab has — previously they were
  // stuck on hardcoded defaults with no way to reach them.
  // The Export all controls: the same set a single card offers, applied to the
  // whole list. Changing one writes through to every card, so the cards stay
  // the single visible source of truth for what will be exported.
  function iconAllOpts() {
    if (!S.iconAll) {
      S.iconAll = {
        fmt: "SVG", scale: 2, contentsOnly: true, svgIdAttribute: true,
        svgSimplifyStroke: true, svgOutlineText: false,
        patchStroke: true, labelParts: true, dropInvisible: true, cleanClip: true,
        open: false,
      };
    }
    return S.iconAll;
  }

  function applyToAllIcons(d, key, value) {
    if (!d || !d.icons) return;
    for (var i = 0; i < d.icons.length; i++) iconOpts(d.icons[i].nodeId)[key] = value;
  }

  function iconOpts(id) {
    if (!S.iconOpts[id]) {
      S.iconOpts[id] = {
        fmt: "SVG", scale: 2,
        contentsOnly: true, svgIdAttribute: true,
        svgSimplifyStroke: true, svgOutlineText: false,
        patchStroke: true, labelParts: true, dropInvisible: true, cleanClip: true,
        open: false,
      };
    }
    return S.iconOpts[id];
  }

  // Built from state rather than the DOM: Export all has to work with the
  // section collapsed, when no card inputs exist to read.
  function iconRow(id) {
    var o = iconOpts(id);
    return {
      format: o.fmt, scaleMode: "SCALE", scaleValue: o.scale, suffix: "",
      contentsOnly: o.contentsOnly, colorProfile: "SRGB", resampling: "BASIC",
      svgIdAttribute: o.svgIdAttribute, svgOutlineText: o.svgOutlineText,
      svgSimplifyStroke: o.svgSimplifyStroke,
      patchStroke: o.patchStroke, labelParts: o.labelParts,
      dropInvisible: o.dropInvisible, cleanClip: o.cleanClip,
    };
  }

  var ICONS_PER_PAGE = 50;

  function iconPageCount(d) {
    var n = d.icons ? d.icons.length : 0;
    return Math.max(1, Math.ceil(n / ICONS_PER_PAGE));
  }

  // Clamped on read, so a page number left over from a bigger selection can
  // never point past the end of a smaller one.
  function iconPageIndex(d) {
    return Math.min(Math.max(0, S.iconPage), iconPageCount(d) - 1);
  }

  function iconPageSlice(d) {
    if (!d.icons) return [];
    var from = iconPageIndex(d) * ICONS_PER_PAGE;
    return d.icons.slice(from, from + ICONS_PER_PAGE);
  }

  function iconPagerHtml(d) {
