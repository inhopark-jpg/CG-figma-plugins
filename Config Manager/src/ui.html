<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
/* @ds:begin — generated from doc/design-system. Edit there, then run `node scripts/sync-ds.mjs`. */
/* =========================================================================
   Figma Plugins — Shared Design Tokens
   Source of truth: doc/design-system/. Synced into each plugin by
   `node scripts/sync-ds.mjs` (see doc/design-system/README.md).
   =========================================================================
   Foundation layer: colors, type, resets. Load this before components.css.

   These are Figma plugin UI tokens: every color variable maps to a
   `--figma-color-*` CSS variable that the Figma desktop app injects at
   runtime (so the UI auto-matches the user's light/dark theme), with a
   static fallback for contexts where that variable isn't defined (e.g.
   previewing this file outside a Figma plugin iframe).

   If you're building a plain web app (not a Figma plugin), just drop the
   var(--figma-color-*, ...) wrapper and keep the fallback hex as the value.
   ========================================================================= */

:root {
  /* ---- color: surfaces ---- */
  --bg:        var(--figma-color-bg, #fff);              /* page / panel background */
  --bg-2:      var(--figma-color-bg-secondary, #f5f5f5);  /* recessed surface: headers, code blocks, field backgrounds */
  --bg-hover:  var(--figma-color-bg-hover, #f0f0f0);      /* hover state for rows, buttons, tabs */
  --bg-sel:    var(--figma-color-bg-selected, #e5f0ff);   /* selected / active row background */

  /* ---- color: borders & text ---- */
  --border:    var(--figma-color-border, #e6e6e6);
  --text:      var(--figma-color-text, #1a1a1a);          /* primary text */
  --text-2:    var(--figma-color-text-secondary, #888);   /* secondary / muted text, labels, hints */
  --text-3:    var(--figma-color-text-tertiary, #b3b3b3); /* faint text: prefixes, placeholders, chevrons */
  --bg-3:      var(--figma-color-bg-tertiary, #e9e9e9);   /* pills, switch track, scrollbar thumb */

  /* ---- color: brand & semantic ---- */
  --brand:      var(--figma-color-bg-brand, #0d99ff);     /* primary action, active states, focus accents */
  --brand-text: var(--figma-color-text-onbrand, #fff);    /* text/icon color on top of --brand */
  --text-brand: var(--figma-color-text-brand, #007be5);   /* brand-colored text on a normal surface (links, aliases) */
  --red:        var(--figma-color-text-danger, #f24822);  /* error text */
  /* Status surfaces are mixed from the text color rather than taken from Figma's
     bg-*-secondary tokens, which are solid fills in the dark theme. */
  --red-bg:     color-mix(in srgb, var(--red) 12%, var(--bg));   /* error surface (tint) */
  --red-solid:  var(--figma-color-bg-danger, #f24822);     /* destructive fill (danger button, danger menu hover) */
  --warn:       var(--figma-color-text-warning, #b86200);  /* warning text */
  --warn-bg:    color-mix(in srgb, var(--warn) 14%, var(--bg));  /* warning surface (tint) */
  --success:    var(--figma-color-icon-success, #14ae5c);  /* "live" / ok indicator dot */

  /* ---- elevation (floating layers only: tooltip, menu, dialog) ---- */
  --shadow-float: 0 8px 24px rgba(0, 0, 0, .3);
  --scrim:        rgba(0, 0, 0, .35);

  /* ---- typography ---- */
  --font-ui:   Inter, -apple-system, system-ui, sans-serif;
  --mono:      ui-monospace, Menlo, Consolas, monospace;

  /* ---- type scale (used inline throughout components.css) ----
     11px  – secondary/meta text (counts, hints, table sub-lines)
     12px  – base body size (default on <html>)
     13px  – panel title
     Weights: 400 body, 500 buttons/tabs/labels, 600 emphasis/headings */
}

/* Two extra reference-only tokens some UI components below hard-code by hex
   rather than a --figma-* variable, because they're Figma editor accent
   colors (component purple, slot pink) rather than theme-adaptive tokens.
   Keep them literal if you copy those components. */
:root {
  --figma-component-purple: #8a38f5;
  --figma-slot-pink: #ff45c0;
}

* { box-sizing: border-box; }

/* Native scrollbars render light-on-light in dark theme, so paint them from
   theme tokens instead. color-scheme covers overlay scrollbars some
   platforms draw; the webkit rules cover the rest. */
html { color-scheme: light dark; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--figma-color-bg-tertiary, #c9c9cd);
  border: 3px solid transparent;
  border-radius: 6px;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background-color: var(--text-2); background-clip: padding-box; }

/* Figma injects its theme <style> ahead of the plugin's HTML, so the page runs
   in quirks mode, where tables don't inherit font size (they fall back to 16px). */
table { font-size: inherit; }

html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: var(--font-ui);
  font-size: 12px; color: var(--text); background: var(--bg);
}

/* =========================================================================
   Figma Plugins — Shared Component Library
   =========================================================================
   Source of truth: doc/design-system/. Do not edit the copy inside a plugin's
   ui.html (between the @ds markers) — edit here, then `node scripts/sync-ds.mjs`.
   Load tokens.css first. Every color/spacing value here references a
   variable from tokens.css — don't hard-code new hex values into a
   component; add a token instead so both files stay themeable.

   General conventions used throughout:
   - Border radius: 4px (xs controls) / 5-6px (default) / 50% (circular icon buttons)
   - Border: 1px solid var(--border) almost everywhere
   - Font sizes: 11px (meta/secondary), 12px (body/default), 13px (title)
   - Font weights: 400 (body), 500 (interactive labels), 600 (emphasis)
   - Hover = var(--bg-hover) background swap, no color/shadow tricks
   - Active/selected = var(--bg-sel) background + var(--brand) border
   ========================================================================= */

body { display: flex; flex-direction: column; height: 100vh; }

/* ---- app header ---- */
header {
  display: flex; flex-direction: column; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
header .hrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
header .title { font-weight: 600; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* right-hand cluster of the top row: actions, then the language toggle last */
.hactions { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-shrink: 0; }

/* ---- segmented control (e.g. language switch, unit toggle) ---- */
.lang-toggle, .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.lang-btn, .seg-btn {
  border: none; border-radius: 0; padding: 4px 11px; font-size: 12px;
  background: var(--bg); color: var(--text-2); font-weight: 500; cursor: pointer;
}
.seg-btn { padding: 4px 10px; font-size: 11px; font-family: var(--mono); }
.seg-btn + .seg-btn { border-left: 1px solid var(--border); }
.lang-btn.active, .seg-btn.active { background: var(--brand); color: var(--brand-text); }
.seg-btn.active { font-weight: 600; }
.lang-btn:hover:not(.active), .seg-btn:hover:not(.active) { background: var(--bg-hover); }

/* ---- layout shell: header / scrolling body ---- */
/* `main` itself never scrolls — only `.tabbody` does, so scrolling inside a
   tab can't drag the whole panel. */
main {
  flex: 1; min-height: 0; padding: 0; position: relative;
  display: flex; flex-direction: column; overflow: hidden;
}
.top-fixed { flex-shrink: 0; padding: 12px 12px 0; }
.tabbody { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; }

.muted { color: var(--text-2); }
.center-msg {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; height: 100%; gap: 10px; color: var(--text-2); padding: 24px;
}
.empty-pane {
  height: 100%; display: flex; align-items: center; justify-content: center;
  color: var(--text-2); text-align: center; padding: 8px;
}
.empty { padding: 34px 18px; text-align: center; color: var(--text-2); line-height: 1.5; }
.empty .empty-t { font-weight: 600; color: var(--text); margin-bottom: 4px; font-size: 12px; }

/* ---- buttons ---- */
button {
  padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-family: inherit; font-size: 12px;
  cursor: pointer; font-weight: 500;
}
button:hover:not(:disabled) { background: var(--bg-hover); }
button:disabled { opacity: 0.38; cursor: default; }
button.primary { background: var(--brand); color: var(--brand-text); border-color: var(--brand); }
button.primary:hover:not(:disabled) { filter: brightness(1.05); }
button.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
button.ghost:hover:not(:disabled) { background: var(--bg-hover); }
button.full { width: 100%; }
button.sm { padding: 4px 8px; }
/* Secondary note inside a button, e.g. the scope of an action: "토큰 정리 · 현재 페이지" */
button .scope { color: var(--text-2); font-weight: 400; }
button .scope::before { content: '· '; }
button.xs { padding: 3px 7px; font-size: 11px; border-radius: 4px; }

.icon-btn {
  width: 30px; height: 26px; padding: 0; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn svg { width: 22px; height: 22px; display: block; }

/* ---- breadcrumb / back bar (navigation history) ---- */
.navbar {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; background: var(--bg-2);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.navbar .trail {
  flex: 1; min-width: 0; font-size: 11px; color: var(--text); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.navbtn {
  width: 26px; height: 26px; padding: 0; border-radius: 50%; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
}
.navbtn svg { width: 15px; height: 15px; display: block; }
.navbtn:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--text-2); }
.navbar .lang-toggle, header .lang-toggle { flex-shrink: 0; }
/* the language toggle is always compact in the top row (header or navbar) */
.navbar .lang-btn, header .lang-btn { padding: 2px 8px; font-size: 11px; }

/* ---- floating tooltip ---- */
/* position:fixed and outside scroll containers, so a pane with overflow:auto
   can't clip it. */
.tip {
  position: fixed; z-index: 200; max-width: 250px;
  background: var(--figma-color-bg-inverse, #1e1e1e);
  color: var(--figma-color-text-oninverse, #fff);
  padding: 7px 9px; border-radius: 6px; font-size: 11px; line-height: 1.45;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .3); pointer-events: none;
}
.tinfo {
  width: 11px; height: 11px; margin-left: 4px; flex-shrink: 0;
  display: inline-flex; align-items: center; vertical-align: -1px;
  opacity: .8; cursor: help; pointer-events: auto;
}
.tinfo:hover { opacity: 1; }
.tinfo svg { width: 100%; height: 100%; display: block; }

/* ---- resizable panes (drag handle, like a layers panel) ---- */
.rbox { position: relative; }
.rbox-body { overflow-y: auto; overflow-x: hidden; }
.rhandle {
  height: 11px; margin: 0 0 4px; cursor: ns-resize; user-select: none;
  display: flex; align-items: center; justify-content: center;
}
.rhandle::after {
  content: ""; width: 30px; height: 2px; border-radius: 2px;
  background: var(--border); transition: background .1s ease;
}
.rhandle:hover::after { background: var(--text-2); }

/* ---- tabs ---- */
.tabs {
  display: flex; gap: 2px; margin: 0 -12px 0; padding: 0 10px;
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.tab {
  border: none; background: transparent; border-radius: 0; margin-bottom: -1px;
  padding: 9px 10px; font-size: 12px; font-weight: 500; color: var(--text-2);
  border-bottom: 2px solid transparent; cursor: pointer;
  display: flex; align-items: center; gap: 5px; white-space: nowrap;
}
.tab:hover:not(:disabled) { background: transparent; }
.tab:hover:not(:disabled):not(.active) { color: var(--text); }
.tab.active { color: var(--text); font-weight: 600; border-bottom-color: var(--brand); }
.tab:disabled { opacity: .35; cursor: default; }
.tab .tb {
  font-size: 10px; font-weight: 600; color: var(--text-2);
  background: var(--figma-color-bg-tertiary, #e9e9e9);
  border-radius: 8px; padding: 0 6px; line-height: 15px;
}
.tab.active .tb { color: var(--text); }

/* ---- collapsible section ---- */
.sec { margin: 0 -12px; }
.sec-head {
  position: sticky; top: -12px; z-index: 5;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; background: var(--bg-2);
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: 12px; cursor: pointer; user-select: none;
}
.sec-head:hover { background: var(--bg-hover); }
.sec-head .caret {
  width: 15px; flex-shrink: 0; color: var(--text-2); font-size: 14px;
  line-height: 1; transition: transform .1s ease; display: inline-block;
  transform-origin: 45% 50%;
}
.sec-head.closed .caret { transform: rotate(-90deg); }
.sec-head .sc { color: var(--text-2); font-weight: 400; }
.sec-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.sec-actions button { font-weight: 500; }
.sec-actions .mini {
  padding: 2px 4px; font-size: 11px; border: 1px solid var(--border);
  border-radius: 5px; background: var(--bg); color: var(--text);
  font-family: inherit; font-weight: 500;
}
.sec-actions .mini:disabled { opacity: .45; }
.sec-body { padding: 8px 12px 10px; }
.sec-body.hidden { display: none; }

/* ---- property row (label / value pair) ---- */
.prow { display: flex; align-items: baseline; gap: 8px; padding: 2px 0; line-height: 1.5; }
.prow .pk { color: var(--text-2); width: 104px; flex-shrink: 0; }
.prow .pv { flex: 1; min-width: 0; word-break: break-word; }
.prow.flag .pv { color: var(--brand); font-weight: 600; }
.copy { cursor: pointer; border-radius: 3px; padding: 1px 3px; margin: 0 -3px; }
.copy:hover { background: var(--bg-hover); }
.mono { font-family: var(--mono); }

/* ---- token pill (e.g. a bound variable name) ---- */
.tok {
  display: inline-block; margin-left: 6px; font-size: 11px; font-family: var(--mono);
  padding: 1px 6px; border-radius: 4px; word-break: break-all; cursor: pointer;
  background: var(--figma-color-bg-tertiary, #e9e9e9);
  color: var(--text); border: 1px solid var(--border);
}
.tok:hover { background: var(--bg-hover); border-color: var(--text-2); }
.tok-none {
  display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px;
  color: var(--text-2); border: 1px dashed var(--border); font-style: italic;
}

/* ---- swatch (color preview square) ---- */
.sw {
  width: 10px; height: 10px; border-radius: 2px; border: 1px solid var(--border);
  display: inline-block; vertical-align: -1px; margin-right: 5px; flex-shrink: 0;
}

/* checkerboard background for translucent/transparent content previews */
.checker {
  background-color: #f0f0f2;
  background-image:
    linear-gradient(45deg, #dededf 25%, transparent 25%, transparent 75%, #dededf 75%),
    linear-gradient(45deg, #dededf 25%, transparent 25%, transparent 75%, #dededf 75%);
  background-size: 10px 10px;
  background-position: 0 0, 5px 5px;
}

/* ---- labeled field chip (e.g. layout inspector: "W 240") ---- */
.lp { display: flex; flex-direction: column; gap: 8px; }
.lp-row { display: flex; align-items: flex-start; gap: 8px; }
.lp-row .lp-label { width: 96px; flex-shrink: 0; color: var(--text-2); padding-top: 5px; line-height: 1.3; }
.lp-fields { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lp-fields.cols4 { display: grid; grid-template-columns: repeat(4, 1fr); flex-wrap: nowrap; }
.lp-fields.cols4 .lp-field { min-width: 0; }
.lp-fields.cols4 .lp-fv { overflow: hidden; text-overflow: ellipsis; }
.lp-field {
  display: inline-flex; align-items: center; gap: 5px; min-width: 0;
  padding: 4px 7px; border: 1px solid var(--border); border-radius: 5px;
  background: var(--bg-2); max-width: 100%;
}
.lp-field .lp-fk {
  font-size: 10px; font-weight: 600; color: var(--text-2); flex-shrink: 0;
  letter-spacing: .02em; text-transform: uppercase;
}
.lp-field .lp-fv { font-family: var(--mono); word-break: break-all; }
.lp-field .lp-fm { color: var(--text-2); font-size: 11px; flex-shrink: 0; }
.lp-field .tok { margin-left: 1px; }
.lp-ic { width: 12px; height: 12px; flex-shrink: 0; color: var(--text-2); display: inline-flex; }
.lp-ic svg { width: 100%; height: 100%; display: block; }

/* ---- checkbox row (custom checkbox, ticks/toggles) ---- */
.lp-check, .hcheck {
  display: inline-flex; align-items: center; gap: 6px; color: var(--text-2);
}
.hcheck { gap: 5px; flex-shrink: 0; padding: 2px 5px; border-radius: 4px; cursor: pointer; user-select: none; font-weight: 500; }
.hcheck:hover { background: var(--bg-hover); color: var(--text); }
.hcheck.on { color: var(--text); }
.lp-check .box, .hcheck .box {
  width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; line-height: 1; flex-shrink: 0; background: var(--bg);
}
.lp-check.on .box, .hcheck.on .box { background: var(--brand); border-color: var(--brand); color: var(--brand-text); }
.lp-check.on { color: var(--text); }

/* ---- subsection divider inside a section (e.g. Fill / Stroke groups) ---- */
.subsec {
  font-weight: 600; margin: 12px 0 6px; padding-top: 10px;
  border-top: 1px solid var(--border);
}
.subsec:first-child { margin-top: 0; padding-top: 0; border-top: none; }

/* ---- data table ---- */
.tr-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
/* table-layout:fixed makes a dragged column width land exactly */
.tr-table { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 12px; table-layout: fixed; }
.tr-table th, .tr-table td {
  padding: 6px 9px; text-align: left; vertical-align: top;
  border-bottom: 1px solid var(--border); white-space: pre-wrap; overflow-wrap: break-word;
}
.tr-table tr:last-child th, .tr-table tr:last-child td { border-bottom: none; }
.tr-table thead th {
  background: var(--bg-2); font-weight: 600; position: sticky; top: 0; z-index: 2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tr-table thead th .tr-def { color: var(--text-2); font-weight: 400; font-size: 11px; }
.tr-name {
  position: sticky; left: 0; z-index: 1; background: var(--bg);
  font-weight: 600; word-break: break-all; border-right: 1px solid var(--border);
}
.tr-desc { color: var(--text-2); font-weight: 400; word-break: break-word; border-right: 1px solid var(--border); }
.tr-desc.none { color: var(--text-2); opacity: .55; }
.tr-table thead .tr-name { z-index: 3; background: var(--bg-2); }
.tr-table tbody tr { cursor: pointer; }
.tr-table tbody td:hover, .tr-table tbody .tr-name:hover { background: var(--bg-hover); }
.tr-table td.empty { color: var(--red); font-style: italic; }
.tr-sub { color: var(--text-2); font-weight: 400; font-size: 11px; margin-top: 2px; }
/* copy affordance revealed on cell hover */
.cp-ic { margin-left: 5px; color: var(--text-2); visibility: hidden; font-size: 11px; }
.tr-table td:hover .cp-ic, .tr-table .tr-name:hover .cp-ic { visibility: visible; }
/* column resize handle */
.colres { position: absolute; top: 0; right: -4px; bottom: 0; width: 9px; cursor: col-resize; z-index: 6; }
.colres::after {
  content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 1px;
  background: var(--brand); opacity: 0; transition: opacity .1s ease;
}
.colres:hover::after, .colres.on::after { opacity: 1; }
.tr-pad { padding: 0 !important; }

/* ---- form controls ---- */
select, .exp-num, .exp-suffix {
  padding: 5px 6px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); font-family: inherit; font-size: 12px;
}
select { font-size: 11px; cursor: pointer; }
select:disabled { opacity: .4; cursor: default; }
.exp-num { width: 56px; padding: 5px 6px; }

/* range slider */
.thumb-size {
  width: 64px; height: 20px; margin: 0 3px; padding: 0; cursor: pointer; flex-shrink: 0;
  -webkit-appearance: none; appearance: none; background: transparent;
}
.thumb-size::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--text-2); opacity: .5; }
.thumb-size:hover::-webkit-slider-runnable-track { opacity: .75; }
.thumb-size::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; margin-top: -4px;
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--brand); cursor: pointer;
  border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--text-2);
}

/* ---- card ---- */
.card { border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; margin-bottom: 6px; }
.card-head { display: flex; align-items: center; gap: 6px; }
.card-head .ch-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.card-head .ch-sub { color: var(--text-2); font-size: 11px; }
.card.own { border-color: var(--brand); }
.card.clickable { cursor: pointer; }
.card.clickable:hover { background: var(--bg-hover); }
/* selected/picked state, reused for tree rows and cards alike */
.picked { background: var(--bg-sel) !important; border-color: var(--brand) !important; border-radius: 6px; }

/* ---- header/summary card (e.g. an inspected item's identity block) ---- */
.var-head { background: var(--bg-2); border-radius: 6px; padding: 8px 10px; }
.var-head .leaf { font-weight: 600; word-break: break-all; }
.var-head .grp { color: var(--text-2); font-size: 11px; word-break: break-all; margin-top: 3px; }
.var-head .desc {
  margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border);
  color: var(--text-2); line-height: 1.45; white-space: pre-wrap; word-break: break-word;
}
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.badge {
  font-size: 11px; padding: 1px 7px; border-radius: 10px;
  background: var(--bg); border: 1px solid var(--border); color: var(--text-2);
}
.badge.b-main { background: var(--bg); border-color: var(--text-2); color: var(--text); font-weight: 600; }
.head-actions { display: flex; gap: 6px; margin-top: 8px; }
.head-actions button { flex: 1; }

/* ---- style pill (e.g. a picked text/fill/effect style) ---- */
.style-pill {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); cursor: pointer; text-align: left; margin-bottom: 6px;
}
.style-pill:hover { background: var(--bg-hover); }
.style-pill .sp-name { flex: 1; min-width: 0; font-weight: 600; word-break: break-all; }
.style-pill .sp-hint { color: var(--text-2); font-size: 11px; flex-shrink: 0; }
.sp-icon {
  width: 15px; height: 15px; flex-shrink: 0; color: var(--text-2);
  display: inline-flex; align-items: center; justify-content: center;
}
.sp-icon svg { width: 100%; height: 100%; display: block; }
.thidden { font-size: 11px; color: var(--text-2); flex-shrink: 0; }

/* ---- tree row (nested, expandable list — e.g. a layer/component tree) ---- */
.trow {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
  user-select: none;
}
.trow:hover { background: var(--bg-hover); }
.trow.current { cursor: default; }
.trow.self { background: var(--bg-sel); border-color: var(--brand); }
.trow.origin { background: var(--bg-sel); border-color: var(--brand) !important; }
.trow .tname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .tsub { color: var(--text-2); font-size: 11px; flex-shrink: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .tglyph { flex-shrink: 0; color: var(--text-2); font-size: 11px; }
.tkids { margin-left: 9px; padding-left: 8px; border-left: 1px solid var(--border); }
.tcount { color: var(--text-2); font-size: 11px; flex-shrink: 0; }
.tcaret {
  width: 17px; height: 17px; flex-shrink: 0; text-align: center; color: var(--text-2);
  font-size: 14px; line-height: 17px; cursor: pointer; border-radius: 3px;
  transform-origin: 45% 50%;
}
.tcaret:hover { background: var(--bg-hover); color: var(--text); }
.tcaret.closed { transform: rotate(-90deg); }
.tcaret.leaf { cursor: default; opacity: 0; }
/* secondary action revealed only on hover of its row */
.trow .tmain { visibility: hidden; }
.trow:hover .tmain, .trow.current .tmain { visibility: visible; }

/* ---- thumbnail (with checkerboard for transparency) ---- */
.tthumb, .icon-prev {
  flex-shrink: 0; border: 1px solid var(--border); border-radius: 3px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.tthumb {
  margin-right: 2px;
  background-color: #f0f0f2;
  background-image:
    linear-gradient(45deg, #dededf 25%, transparent 25%, transparent 75%, #dededf 75%),
    linear-gradient(45deg, #dededf 25%, transparent 25%, transparent 75%, #dededf 75%);
  background-size: 8px 8px; background-position: 0 0, 4px 4px;
}
.tthumb img, .icon-prev img { max-width: 100%; max-height: 100%; display: block; }
.icon-prev {
  width: 44px; height: 44px; margin-right: 9px; border-radius: 4px;
  background-color: #f0f0f2;
  background-image:
    linear-gradient(45deg, #dededf 25%, transparent 25%, transparent 75%, #dededf 75%),
    linear-gradient(45deg, #dededf 25%, transparent 25%, transparent 75%, #dededf 75%);
  background-size: 10px 10px; background-position: 0 0, 5px 5px;
}
.icon-prev img { max-width: 82%; max-height: 82%; }

/* ---- category tags (fixed brand colors — match Figma's own editor accents) ---- */
/* Slot pink, matching the color Figma gives slots in the editor. */
.tslot {
  flex-shrink: 0; font-size: 10px; font-weight: 600; line-height: 16px;
  text-transform: uppercase; letter-spacing: .03em; padding: 0 6px; border-radius: 8px;
  color: var(--figma-slot-pink); background: rgba(255, 69, 192, .14); border: 1px solid rgba(255, 69, 192, .45);
}
/* Component purple, matching the color Figma gives components in the editor. */
.tvariant {
  flex-shrink: 0; font-size: 10px; font-weight: 600; line-height: 16px;
  text-transform: uppercase; letter-spacing: .03em; padding: 0 6px; border-radius: 8px;
  color: var(--figma-component-purple); background: rgba(138, 56, 245, .14); border: 1px solid rgba(138, 56, 245, .5);
}
.text-badge {
  flex-shrink: 0; font-size: 10px; font-weight: 600; line-height: 16px;
  text-transform: uppercase; letter-spacing: .03em; padding: 0 6px; border-radius: 8px;
  color: var(--text-2); border: 1px solid var(--border); background: var(--bg-2);
}

/* ---- auto layout direction widget ---- */
.al-widget { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.al-grid {
  width: 46px; height: 46px; flex-shrink: 0; padding: 4px;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  border: 1px solid var(--border); border-radius: 4px; background: var(--bg-2);
}
.al-cell { display: flex; align-items: center; justify-content: center; }
.al-cell .dot { width: 2px; height: 2px; border-radius: 50%; background: var(--text-2); opacity: .55; }
.al-bars { display: flex; align-items: center; justify-content: center; gap: 2px; }
.al-bars.spread { justify-content: space-between; }
.al-bars.h { flex-direction: row; height: 100%; }
.al-bars.v { flex-direction: column; width: 100%; }
.al-bar { background: var(--brand); border-radius: 1px; }
.al-bars.h .al-bar { width: 3px; height: 9px; }
.al-bars.v .al-bar { width: 9px; height: 3px; }
.al-caption .al-dir { font-weight: 600; }
.al-caption .al-sub { color: var(--text-2); font-size: 11px; margin-top: 2px; }

/* ---- content / code preview box ---- */
.content-box {
  font-family: var(--mono); background: var(--bg-2); padding: 6px 8px;
  border-radius: 4px; word-break: break-word; white-space: pre-wrap; max-height: 120px; overflow-y: auto;
}
.detail-box { border-left: 2px solid var(--border); padding: 4px 0 4px 10px; margin: 0 0 8px 4px; }
.hidden-flag { color: var(--text-2); font-size: 11px; }

/* ---- pagination ---- */
.pager {
  position: sticky; top: 22px; z-index: 4;
  display: flex; align-items: center; gap: 6px;
  margin: 0 -12px 8px; padding: 6px 12px;
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.pager .pgbtn { display: inline-flex; align-items: center; padding: 2px 5px; }
.pager .pgbtn svg { width: 13px; height: 13px; display: block; }
.pager .pgbtn:disabled { opacity: .35; cursor: default; }
.pg-n { font-weight: 600; font-size: 11px; }
.pg-range { margin-left: auto; color: var(--text-2); font-size: 11px; }

/* ---- misc row/list primitives seen across panels ---- */
.paint-row { display: flex; align-items: baseline; flex-wrap: wrap; padding: 2px 0; line-height: 1.5; }
.paint-row .pv-line { width: 100%; }
.pv-line { margin-top: 3px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.pv-line .tok { margin-left: 0; }
.arrow { color: var(--text-2); flex-shrink: 0; }
.sc-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; }
.sc-row:hover { background: var(--bg-hover); }
.sc-sw {
  width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0; border: 1px solid var(--border);
  background-image:
    linear-gradient(45deg, #c8c8cc 25%, transparent 25%, transparent 75%, #c8c8cc 75%),
    linear-gradient(45deg, #c8c8cc 25%, transparent 25%, transparent 75%, #c8c8cc 75%);
  background-size: 8px 8px; background-position: 0 0, 4px 4px; background-color: #fff;
  position: relative; overflow: hidden;
}
.sc-sw i { position: absolute; inset: 0; display: block; }
.sc-val { font-family: var(--mono); flex-shrink: 0; }
.sc-mid { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sc-count { color: var(--text-2); font-size: 11px; flex-shrink: 0; }
.eff-item { padding: 4px 0 0; }
.eff-item + .eff-item { border-top: 1px dashed var(--border); margin-top: 4px; }
.eff-title { display: flex; align-items: center; gap: 6px; }
.eff-title .et-label { font-weight: 500; }
.eff-title .et-sum { color: var(--text-2); font-family: var(--mono); font-size: 11px; word-break: break-all; }

/* ---- Export-panel specific composites ---- */
.exp-row { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; flex-shrink: 0; }
.exp-row .grow { flex: 1; min-width: 0; }
.exp-row select { min-width: 0; }
.dots { letter-spacing: 1px; padding: 4px 6px; }
.dots.on { color: var(--brand); background: var(--bg-sel); }
.dots.has-opts:not(.on) { color: var(--text); }
.exp-more { border: 1px solid var(--border); border-radius: 6px; padding: 8px 9px; margin: 0 0 8px; background: var(--bg-2); }
.exp-more-t { font-weight: 600; margin-bottom: 6px; }
.exp-more .pk { width: 92px; }
.exp-more select, .exp-suffix { width: 100%; }
.exp-checks { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.exp-more .hcheck { padding-left: 0; }
.exp-preview { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 8px; }
.exp-preview-box {
  margin-top: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 6px;
  display: flex; align-items: center; justify-content: center; min-height: 60px;
  background-color: #f0f0f2;
  background-image:
    linear-gradient(45deg, #dededf 25%, transparent 25%, transparent 75%, #dededf 75%),
    linear-gradient(45deg, #dededf 25%, transparent 25%, transparent 75%, #dededf 75%);
  background-size: 12px 12px; background-position: 0 0, 6px 6px;
}
.exp-preview-img { max-width: 100%; max-height: 220px; display: block; }
.exp-controls { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
.exp-controls .grow { flex: 1; }
.tok-opts { margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.tok-opts-head { display: flex; align-items: center; gap: 4px; color: var(--text-2); font-size: 11px; margin-bottom: 6px; }
.all-opts { padding-top: 2px; }

/* =========================================================================
   Additions shared by i18n / Config Manager / Arrow Connect /
   Change Marker. Same visual language as above: tokens only, 6px radius,
   12px text, hover = --bg-hover, focus/selected = --brand.
   ========================================================================= */

/* ---- text inputs ---- */
input:not([type]), input[type="text"], input[type="password"], input[type="number"],
input[type="search"], input[type="date"], textarea {
  padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); font-family: inherit; font-size: 12px;
  min-width: 0;
}
textarea { line-height: 1.4; resize: vertical; }
input:not([type]):focus, input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus,
input[type="search"]:focus, input[type="date"]:focus, textarea:focus, select:focus { outline: none; border-color: var(--brand); }
input:disabled, textarea:disabled { opacity: .4; }
input.invalid, textarea.invalid { border-color: var(--red); }
::placeholder { color: var(--text-3); }
/* borderless until hovered — inline rename fields */
input.bare { border-color: transparent; background: transparent; }
input.bare:hover { border-color: var(--border); }
input.bare:focus { border-color: var(--brand); background: var(--bg); }

/* labeled field: small muted label above its control */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field > label, .field > .lbl { color: var(--text-2); font-size: 11px; font-weight: 500; }
.field-err { color: var(--red); font-size: 11px; }

/* ---- semantic buttons ---- */
button.danger { color: var(--red); }
button.danger-fill { background: var(--red-solid); border-color: var(--red-solid); color: var(--brand-text); }
button.danger-fill:hover:not(:disabled) { background: var(--red-solid); filter: brightness(1.05); }
button.selected { background: var(--bg-sel); border-color: transparent; color: var(--text-brand); }
button.selected:disabled { opacity: 1; }

/* ---- small pills: warning / danger / link variants of .badge ---- */
.badge.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.badge.danger { background: var(--red-bg); border-color: transparent; color: var(--red); }
.badge.link { background: var(--bg-sel); border-color: transparent; color: var(--text-brand); cursor: pointer; }

/* ---- inline notices ---- */
.notice {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px; margin-bottom: 8px;
  border: 1px dashed var(--border); border-radius: 6px; color: var(--text-2); font-size: 11px; line-height: 1.4;
}
.notice > span:not(.ico) { flex: 1; }
/* Colored text on a tinted surface is hard to read (especially in dark mode),
   so status notices keep body text at --text and carry the color in a left bar. */
.notice.err, .notice.warn, .notice.info {
  border-style: solid; border-width: 1px 1px 1px 3px; color: var(--text); font-size: 12px; line-height: 1.45;
}
.notice.err { border-color: var(--red); background: var(--red-bg); }
.notice.warn { border-color: var(--warn); background: var(--warn-bg); }
.notice.info { border-color: var(--border); border-left-color: var(--brand); background: var(--bg-2); }
.notice .ico { flex: 0 0 14px; width: 14px; height: 14px; margin-top: 1px; }
.notice.err .ico { color: var(--red); }
.notice.warn .ico { color: var(--warn); }

/* ---- toast (in-panel, bottom) ---- */
.toast {
  position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 60;
  padding: 8px 10px; border-radius: 6px; font-size: 12px; white-space: pre-line;
  background: var(--red-bg); color: var(--red); display: none;
}
.toast.show { display: block; }
.toast.warn { background: var(--warn-bg); color: var(--warn); }

/* ---- modal dialog (Figma's iframe blocks window.confirm/prompt) ---- */
.overlay {
  position: fixed; inset: 0; z-index: 100; padding: 16px;
  background: var(--scrim); display: flex; align-items: center; justify-content: center;
}
.dialog {
  width: 100%; max-width: 360px; padding: 12px; border-radius: 6px;
  background: var(--bg); border: 1px solid var(--border); box-shadow: var(--shadow-float);
  display: flex; flex-direction: column; gap: 12px;
}
.dialog input { width: 100%; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 6px; }

/* ---- dropdown menu (dark, like Figma's own menus) ---- */
.menu {
  position: fixed; z-index: 110; min-width: 200px; max-width: 320px; padding: 6px;
  background: var(--figma-color-bg-menu, #1e1e1e); color: var(--figma-color-text-menu, #fff);
  border-radius: 6px; box-shadow: var(--shadow-float);
  font-size: 12px; line-height: 18px; display: flex; flex-direction: column;
}
.menu input[type="text"] {
  background: rgba(255, 255, 255, .08); border-color: transparent; color: inherit; margin-bottom: 4px;
}
.menu input[type="text"]:focus { border-color: var(--brand); }
.menu-list { overflow-y: auto; }
.menu-group { padding: 6px 8px 2px; font-size: 11px; opacity: .55; }
.menu-item { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
.menu-item .meta { margin-left: auto; opacity: .55; font-size: 11px; white-space: nowrap; }
.menu-item .check { width: 12px; flex: none; text-align: center; }
.menu-item:hover, .menu-item.active { background: var(--brand); color: var(--brand-text); }
.menu-item:hover .meta, .menu-item.active .meta { opacity: .85; }
.menu-item.danger { color: var(--figma-color-text-menu-danger, #ff8a7a); }
.menu-item.danger:hover, .menu-item.danger.active { background: var(--red-solid); color: var(--brand-text); }
.menu-empty { padding: 8px; opacity: .6; }
.menu-sep { height: 1px; margin: 4px 2px; background: rgba(255, 255, 255, .12); }

/* ---- toggle switch (on <input type=checkbox class=switch> or a <span>) ---- */
.switch {
  appearance: none; -webkit-appearance: none; position: relative; flex: none; margin: 0; cursor: pointer;
  width: 28px; height: 16px; border-radius: 8px; background: var(--bg-3); transition: background .12s;
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 6px;
  background: var(--figma-color-icon-onbrand, #fff); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: left .12s;
}
.switch:checked, .switch.on { background: var(--brand); }
.switch:checked::after, .switch.on::after { left: 14px; }
.switch:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* ---- window resize grip (bottom-right; plugin resizes itself via figma.ui.resize) ---- */
.resize-grip {
  position: fixed; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; z-index: 120;
  background: linear-gradient(135deg, transparent 50%, var(--text-3) 50%, var(--text-3) 58%, transparent 58%,
    transparent 70%, var(--text-3) 70%, var(--text-3) 78%, transparent 78%);
}

/* ---- busy spinner ---- */
.spin {
  width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; display: inline-block;
  border: 2px solid var(--border); border-top-color: var(--brand); animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- footer bar ---- */
.foot {
  flex-shrink: 0; padding: 8px 12px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-2); line-height: 1.4;
}
/* @ds:end */

  /* ---- Config Manager only (shared pieces come from the block above) ---- */
  button, input, select { font: inherit; color: inherit; }

  /* Top bar: tabs on the left, language toggle at the right end */
  nav { display: flex; align-items: center; gap: 2px; padding: 0 12px 0 10px; height: 40px; border-bottom: 1px solid var(--border); flex: none; }
  nav .tab { height: 40px; }
  nav .lang-btn { padding: 2px 8px; font-size: 11px; }
  .spacer { flex: 1; }
  /* This plugin's body scrolls as a whole (no tab body), unlike the shared shell. */
  main { display: block; flex: 1; overflow: auto; padding: 12px 12px 24px; }

  /* Typography + layout */
  h2 { font-size: 13px; line-height: 20px; font-weight: 600; margin: 0; }
  .faint { color: var(--text-3); }
  .small { font-size: 11px; line-height: 15px; }
  .row { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .grow { flex: 1; min-width: 0; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Buttons: shared <button> look at the compact sizes this dense UI needs
     (.btn ≈ shared .sm, .btn.sm ≈ shared .xs). */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 4px 8px; white-space: nowrap; flex: none; }
  .btn.ghost { color: var(--text); }
  .btn.icon { width: 26px; height: 26px; padding: 0; }
  .btn.sm { padding: 2px 6px; font-size: 11px; border-radius: 4px; }
  .btn.sm.icon { width: 20px; height: 20px; padding: 0; }
  .btn.selected .ico { color: inherit; }
  input[type=text], select { height: 26px; padding: 0 8px; }
  select { padding-right: 2px; font-size: 12px; }
  .title-input { font-weight: 600; font-size: 13px; height: 28px; }
  label.field { margin-bottom: 0; }
  label.field > input, label.field > select, label.field > .row { color: var(--text); flex: none; }

  /* Cards + lists */
  .card { padding: 12px; margin-bottom: 0; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item {
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .item:hover { background: var(--bg-hover); }
  .item .name { font-weight: 600; }
  .empty { padding: 40px 24px; }
  .empty p { margin: 0 0 6px; }
  .toolbar { display: flex; align-items: center; gap: 6px; }
  .hint { color: var(--text-2); background: var(--bg-2); border-radius: 6px; padding: 8px 10px; }

  /* Detail header */
  .detail-head { display: flex; align-items: center; gap: 4px; }
  .detail-head .prefix { color: var(--text-3); padding-left: 2px; }

  /* Page preview bar: which config mode the current page shows */
  .page-bar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--bg-2);
  }
  .page-bar .lead { display: flex; align-items: center; gap: 6px; color: var(--text-2); white-space: nowrap; }
  .page-bar .lead b { color: var(--text); font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .page-bar .note { flex-basis: 100%; color: var(--text-2); }
  /* Segmented control with the shared .seg look; mode names, so not monospace */
  .seg { flex-wrap: wrap; background: var(--bg); }
  .seg button { height: auto; padding: 4px 10px; border: 0; border-radius: 0; background: var(--bg); color: var(--text-2); white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button:hover:not(.on):not(:disabled) { background: var(--bg-hover); color: var(--text); }
  .seg button.on { background: var(--brand); color: var(--brand-text); font-weight: 600; cursor: default; opacity: 1; }
  .seg button.none.on { background: var(--bg-2); color: var(--text); }
  /* The column whose values are live on the page */
  table.grid th.live, table.grid td.live { background: color-mix(in srgb, var(--brand) 9%, var(--bg)); }
  table.grid tbody tr:hover td.live { background: color-mix(in srgb, var(--brand) 14%, var(--bg)); }
  .live-tag {
    flex: none; margin-left: 4px; padding: 0 7px; line-height: 16px; border-radius: 10px; font-size: 11px; font-weight: 600;
    background: var(--brand); color: var(--brand-text);
  }

  /* Dropdown menu: shared .menu; icons keep the menu's text color */
  .menu-item .ico { color: inherit; opacity: .8; }

  /* Grid — mirrors Figma's variables table */
  .grid-wrap { overflow-x: auto; margin: 0 -12px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  table.grid { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
  table.grid col.c-add { width: 40px; }

  table.grid th:first-child, table.grid td:first-child { box-shadow: inset -1px 0 0 var(--border); }

  <button class="tab" data-tab="configs"></button>
  <button class="tab" data-tab="presets"></button>
  <div class="spacer"></div>
  <div class="lang-toggle" id="langToggle"></div>

<main id="main"></main>
<div id="toast" class="toast"></div>
<div id="resize" class="resize-grip"></div>

<script>
// ---------------------------------------------------------------------------
// Messaging
// ---------------------------------------------------------------------------
let requestSeq = 0;
const pending = new Map();
function send(type, payload = {}) {
  const requestId = ++requestSeq;
  parent.postMessage({ pluginMessage: { type, requestId, ...payload } }, '*');
  return new Promise((resolve) => pending.set(requestId, resolve));
}
async function act(type, payload) {
  const res = await send(type, payload);
  if (!res.ok) showToast(res.error);
  else if (res.warnings && res.warnings.length) showToast(res.warnings.join('\n'), true);
  return res;
}

let state = { presets: [], configs: [] };
let applied = { target: '', configs: {} };
let selectedTableOf = null; // collection whose canvas table is currently selected
let compDetail = null; // live component info for the open preset (componentDetail in code.ts)
let watched = null; // preset id the main thread is watching
let selComp = null; // component (or an instance's main component) selected on the canvas; see selectedComponent() in code.ts
const ui = { tab: 'configs', configId: null, presetId: null, creating: false, search: '', dragging: false, report: null, fromReport: false, cleaning: false,
  editing: false, selected: new Set(), configSearch: '', configReport: false, fromConfigReport: false };

// Column widths per collection, like Figma's variables table. Saved in Figma's per-user plugin storage
// (the plugin iframe has no reliable localStorage); the main thread sends them back on launch.
const LABEL_W = 200, MODE_W = 200, MIN_W = { label: 120, mode: 80 };
let colWidths = {};
const widthOf = (cid, colId) => colWidths[`${cid}:${colId}`] || (colId === 'label' ? LABEL_W : MODE_W);
function saveWidth(cid, colId, w) {
  colWidths[`${cid}:${colId}`] = w;
  parent.postMessage({ pluginMessage: { type: 'saveColWidths', widths: colWidths } }, '*');
}

window.onmessage = (e) => {
  const msg = e.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'state') { state = msg.state; render(); }
  else if (msg.type === 'reveal') reveal(msg.collectionId);
  else if (msg.type === 'selectedTable') {
    if (selectedTableOf !== msg.collectionId) { selectedTableOf = msg.collectionId; render(); }
  }
  else if (msg.type === 'selection') {
    const prev = selComp;
    selComp = msg.component;
    // Like i18n's key layer: selecting a component (or its instance) opens its preset.
    if (ui.tab === 'presets' && selComp && selComp.presetId && selComp.presetId !== ui.presetId && (!prev || prev.id !== selComp.id)) go({ presetId: selComp.presetId });
    else if (ui.tab === 'presets') render();
  }
  else if (msg.type === 'componentDetail') {
    if (msg.presetId === watched) { compDetail = msg.detail; if (ui.tab === 'presets') render(); }
  }
  else if (msg.type === 'lang') { if (msg.lang !== lang) { lang = msg.lang; applyLang(); render(); } }
  else if (msg.type === 'colWidths') { colWidths = msg.widths || {}; render(); }
  else if (msg.type === 'applied') { applied = msg.applied; if (ui.tab === 'configs' && ui.configId) render(); }
  else if (msg.type === 'result') {
    const resolve = pending.get(msg.requestId);
    if (resolve) { pending.delete(msg.requestId); resolve(msg); }
  }
};

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

/** Text input that commits on Enter/blur only when changed. */
function commitInput(value, onCommit, attrs = {}) {
  const input = h('input', { type: 'text', value, ...attrs });
  let committed = value;
  const commit = () => {
    if (input.value === committed) return;
    committed = input.value;
    onCommit(input.value);
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = committed; input.blur(); }
  });
  input.addEventListener('blur', commit);
  return input;
}

function dialog({ text, input, okLabel = t('ok'), danger }) {

    const cancelValue = field ? null : false;
    const close = (v) => { overlay.remove(); resolve(v); };
    const ok = () => close(field ? field.value.trim() || null : true);
    const overlay = h('div', { class: 'overlay', onclick: (e) => e.target === overlay && close(cancelValue) },
      h('div', { class: 'dialog' },
        h('div', {}, text),
        field,
        h('div', { class: 'dialog-actions' },
          btn(t('cancel'), () => close(cancelValue), 'ghost'),
          btn(okLabel, ok, danger ? 'danger-fill' : 'primary'))));
    overlay.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close(cancelValue);
      if (e.key === 'Enter') { e.preventDefault(); ok(); }

/** Dropdown menu (native <select> popups render tiny inside Figma).
 *  groups: [{label?, items:[{id, label, meta?, icon?, checked?}]}] */
let closeMenu = () => {};
function openMenu(anchor, groups, onPick, { search = true, align = 'left' } = {}) {
  closeMenu();
  const filter = h('input', { type: 'text', placeholder: t('search'), style: search ? '' : 'position:absolute;opacity:0;pointer-events:none;height:0' });
  const list = h('div', { class: 'menu-list' });
  const menu = h('div', { class: 'menu' }, filter, list);
  const hasChecks = groups.some((g) => g.items.some((it) => it.checked !== undefined));
  let visible = [];
  let active = search ? 0 : -1; // no pre-highlight without search, so Enter never picks e.g. Delete by accident
  const draw = () => {
    const q = filter.value.toLowerCase();
    visible = [];
    const nodes = [];
    for (const g of groups) {
      const items = g.items.filter((it) => !q || it.label.toLowerCase().includes(q));
      if (!items.length) continue;
      if (g.label) nodes.push(h('div', { class: 'menu-group' }, g.label));
      else if (nodes.length) nodes.push(h('div', { class: 'menu-sep' }));
      for (const it of items) {
        const idx = visible.length;
        visible.push(it);
        nodes.push(h('div', {
          class: 'menu-item' + (idx === active ? ' active' : '') + (it.danger ? ' danger' : ''),
          onmousedown: (e) => { e.preventDefault(); pick(it); },
          onmouseenter: () => { active = idx; },
        },
          hasChecks && h('span', { class: 'check' }, it.checked ? '✓' : ''),
          it.icon && icon(it.icon),
          h('span', { class: 'ellipsis' }, it.label),
          it.meta && h('span', { class: 'meta' }, it.meta)));
      }
    }
    list.replaceChildren(...(nodes.length ? nodes : [h('div', { class: 'menu-empty' }, t('nothingToAdd'))]));
  };
  const pick = (it) => { closeMenu(); onPick(it); };
  filter.addEventListener('input', () => { active = 0; draw(); });
  filter.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMenu();
    else if (e.key === 'ArrowDown') { active = Math.min(active + 1, visible.length - 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter' && visible[active]) pick(visible[active]);
  });
  const onDown = (e) => { if (!menu.contains(e.target)) closeMenu(); };
  closeMenu = () => {
    menu.remove();
    document.removeEventListener('mousedown', onDown, true);
    closeMenu = () => {};
  };
  draw();
  document.body.append(menu);
  // Place under the anchor, or above it when there isn't room below.
  const r = anchor.getBoundingClientRect();
  const below = window.innerHeight - r.bottom - 12, above = r.top - 12;
  const room = Math.max(below, above);
  menu.style.minWidth = `${Math.max(180, Math.min(r.width, 240))}px`;
  if (align === 'right') menu.style.minWidth = '200px';
  const left = align === 'right' ? r.right - menu.offsetWidth : r.left;
  menu.style.left = `${Math.max(8, Math.min(left, window.innerWidth - menu.offsetWidth - 8))}px`;
  menu.style.maxHeight = `${Math.min(room, 360)}px`;
  if (below >= 200 || below >= above) menu.style.top = `${r.bottom + 4}px`;
  else menu.style.bottom = `${window.innerHeight - r.top + 4}px`;
  document.addEventListener('mousedown', onDown, true);
  setTimeout(() => filter.focus(), 0);
}

function render() {

  document.querySelectorAll('nav .tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === ui.tab));
  const main = document.getElementById('main');
  const scroll = main.scrollTop;
  const prevWrap = main.querySelector('.grid-wrap');
  const scrollX = prevWrap ? prevWrap.scrollLeft : 0;
  // Ask the main thread to read the open preset's component (one node per poll, not all of them).
  const want = ui.tab === 'presets' && ui.presetId ? ui.presetId : null;
  if (want !== watched) {
    watched = want;
    compDetail = null;
    send('watchPreset', { id: want });

  main.replaceChildren(
    ui.tab === 'configs' ? (ui.configId ? configDetail() : ui.configReport ? configReportView() : configList())
    : (ui.presetId ? presetDetail() : ui.report ? reportView() : presetList())

function reveal(collectionId) {

    if (ui.configId && ui.configId !== cfg.id) leaveConfig({ tab: 'configs', configId: cfg.id });
    else go({ tab: 'configs', configId: cfg.id });
  } else if (col && col.isPreset) {
    if (ui.tab === 'presets' && ui.presetId === col.id) return;
    go({ tab: 'presets', presetId: col.id });
  }

/** Drag handle on a header cell's right edge. */
function resizer(cid, colId) {
  const min = colId === 'label' ? MIN_W.label : MIN_W.mode;
  return h('div', {
    class: 'col-resizer',
    title: t('dragResize'),
    onpointerdown: (e) => {
      e.preventDefault();
      e.stopPropagation();
      const handle = e.currentTarget;
      const table = handle.closest('table');
      const col = table.querySelector(`col[data-col="${CSS.escape(colId)}"]`);
      const startX = e.clientX, startW = col.getBoundingClientRect().width || widthOf(cid, colId);
      const fixedTotal = () => [...table.querySelectorAll('col[data-col]')].reduce((a, c) => a + parseFloat(c.style.width || 0), 0);
      let w = startW;
      ui.dragging = true;
      handle.classList.add('active');
      document.body.classList.add('resizing');
      handle.setPointerCapture(e.pointerId);
      const move = (ev) => {
        w = Math.max(min, Math.round(startW + ev.clientX - startX));
        col.style.width = `${w}px`;
        table.style.minWidth = `${fixedTotal() + 40}px`;
      };
      const up = () => {
        handle.removeEventListener('pointermove', move);
        handle.removeEventListener('pointerup', up);
        handle.classList.remove('active');
        document.body.classList.remove('resizing');
        ui.dragging = false;
        saveWidth(cid, colId, w);
        if (deferredRender) { deferredRender = false; render(); }
      };
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', up);
    },
    ondblclick: (e) => {
      // Double-click resets to the default width.
      e.stopPropagation();
      delete colWidths[`${cid}:${colId}`];
      saveWidth(cid, colId, colId === 'label' ? LABEL_W : MODE_W);
      render();
    },
  });
}

/** Presets (`autoName`): add "mode N" at once and put its name up for editing, like Figma. Configs ask for a name. */
function addModeHeader(collectionId, autoName = false) {

/**
 * Edit mode for the config / preset lists: tick several items and delete them at once

 */
function editTools(items, kind) {
  if (!ui.editing) return btn(t('edit'), () => go({ editing: true, selected: new Set() }), '', { disabled: !items.length });
  const ids = items.map((it) => it.id).filter((id) => ui.selected.has(id));

/** A list row: opens the item, or (edit mode) toggles its checkbox. */
function listItem(id, open, ...children) {

/** What's wrong with a preset, from the variable table and the last component check (cleanup / opened preset). */
function presetFlag(p) {
  if (!p || !p.isPreset) return null;
  if (!p.component) return t('noComponent');
  if (p.componentMissing) return t('componentMissing');
  if (p.issueCount) return t('nIssues', p.issueCount);

/** Search box that keeps focus and caret while the list under it re-renders. */
function searchBox(value, placeholder, onInput, view) {
  const input = h('input', { type: 'text', placeholder, value, class: 'grow' });
  input.addEventListener('input', () => {
    onInput(input.value);
    const pos = input.selectionStart;
    const next = view();
    document.getElementById('main').replaceChildren(next);
    const again = next.querySelector('.toolbar input');
    again.focus();
    again.setSelectionRange(pos, pos);
  });
  return input;
}

/**
 * Everything to clean up in a config. Unlike presets this needs only the variable table (no canvas nodes),
 * so it covers every config and stays live. Preset problems are as of the last preset check.
 */
function configIssues(cfg) {
  const out = [];
  if (!cfg.rows.length) out.push(t('ciEmpty'));
  for (const r of cfg.rows) {
    const col = collectionById(r.presetId);
    if (!r.validType) { out.push(t('ciType', r.name)); continue; }
    if (!col) { out.push(t('ciGone', r.name)); continue; }
    const bad = cfg.modes.filter((m) => rowProblem(r, m.id)).length;
    if (bad) out.push(t('ciInvalid', col.name, bad));
    const flag = presetFlag(col);
    if (flag) out.push(`${col.name}: ${flag}`);
  }
  return out;
}

const typeLabel = (type) => t('type')[type];

function toHex(c) {
  const x = (n) => Math.round(n * 255).toString(16).padStart(2, '0');
  return `#${x(c.r)}${x(c.g)}${x(c.b)}`;
}
function fromHex(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: ((n >> 16) & 255) / 255, g: ((n >> 8) & 255) / 255, b: (n & 255) / 255, a: 1 };
}

function valueEditor(token, modeId) {
  const cell = token.values[modeId];
  if (!cell) return h('span', { class: 'faint' }, '—');
  if (cell.kind === 'alias') return h('span', { class: 'alias ellipsis', title: t('aliasTitle') }, `→ ${cell.name}`);
  const set = (value) => act('setTokenValue', { id: token.id, modeId, value });
  switch (token.type) {
    case 'BOOLEAN':
      return h('label', { class: 'bool' },
        h('input', { type: 'checkbox', role: 'switch', class: 'switch', checked: cell.value === true, onchange: (e) => set(e.target.checked) }),
        cell.value ? t('true') : t('false'));
    case 'FLOAT':
      return commitInput(String(cell.value), (v) => set(Number(v)), { class: 'bare', inputmode: 'decimal' });
    case 'COLOR': {
      const c = cell.value;
      return h('label', { class: 'color-val' },
        h('input', { type: 'color', value: toHex(c), onchange: (e) => set({ ...fromHex(e.target.value), a: c.a }) }),
        toHex(c).slice(1).toUpperCase(),
        c.a < 1 && h('span', { class: 'muted' }, `${Math.round(c.a * 100)}%`));
    }
    default:
      return commitInput(String(cell.value), (v) => set(v), { class: 'bare', placeholder: t('empty') });
  }
}

    section(t('secMissing'), r.missing, (e) => item(e, t('componentMissing') + (e.componentName ? ` · ${e.componentName}` : ''), () => open(e))),
    section(t('secUnlinked'), r.unlinked, (e) => item(e, t('noComponent'), () => open(e))),
    section(t('secElsewhere'), r.elsewhere, (e) => item(e, `${e.componentName} · ${t('onPageNamed', e.pageName || '?')}`,
      () => act('locateComponent', { id: e.presetId }))),
    r.elsewhere.length > 0 && h('div', { class: 'muted small' }, t('elsewhereHint')),
  );
}

/** Editor for a property value — the control follows the property type (Boolean switch, text, variant option). */
function propEditor(pr, cell, onSet) {
  if (cell && cell.kind === 'alias') return h('span', { class: 'alias ellipsis', title: t('aliasTitle') }, `→ ${cell.name}`);
  const value = cell ? cell.value : pr.defaultValue;
  switch (pr.kind) {
    case 'BOOLEAN':
      return h('label', { class: 'bool' },
        h('input', { type: 'checkbox', role: 'switch', class: 'switch', checked: value === true, onchange: (e) => onSet(e.target.checked) }),
        value === true ? t('true') : t('false'));
    case 'VARIANT': {
      const options = pr.options || [];
      const invalid = !options.includes(value);
      const pick = (e) => openMenu(e.currentTarget,
        [{ items: options.map((o) => ({ id: o, label: o, checked: o === value })) }],
        (it) => it.id !== value && onSet(it.id),
        { search: options.length > 8 });
      return h('button', { class: 'value-btn' + (invalid ? ' invalid' : ''), onclick: pick },
        h('span', { class: 'ellipsis' }, invalid ? `⚠ ${value || t('unset')}` : value),
        h('span', { class: 'chev' }, icon('chevron')));
    }
    default:
      return commitInput(String(value ?? ''), (v) => onSet(v), { class: 'bare', placeholder: t('empty') });
  }
}

/** Text for a PresetIssue from the main thread (componentDetail in code.ts). */
function issueText(issue) {
  const n = issue.tokenName;
  switch (issue.kind) {
    case 'unbound': return t('issueUnbound', n);
    case 'other': return t('issueOther', n, issue.otherName);
    case 'renamed': return t('issueRenamed', n, issue.propName);
    case 'orphan': return t('issueOrphan', n);
    case 'invalid': return t('issueInvalid', n, issue.value);
  }
  return '';
}

/** A cleanup line with its fix. Nothing is fixed automatically — the user decides. */
function issueNotice(issue) {
  const id = issue.tokenId;
  const action =
    issue.kind === 'unbound' || issue.kind === 'other' ? btn(t('rebind'), () => act('rebindToken', { id }), 'sm')
    : issue.kind === 'renamed' ? btn(t('renameToProp'), () => act('renameTokenToProp', { id }), 'sm')
    : issue.kind === 'orphan' ? btn(t('deleteToken'), async () => (await confirmAction(t('confirmDeleteToken', issue.tokenName))) && act('deleteToken', { id }), 'sm danger')
    : null;
  return h('div', { class: 'notice warn' }, h('span', {}, issueText(issue)), action);
}

/** Component line under the header: locate it, or (no / deleted component) link the selected one. */
function componentBar(p, detail) {
  const comp = p.component;
  const canLink = selComp && !selComp.library && !selComp.presetId;
  const linkBtn = btn(canLink ? t('linkSelected', selComp.name) : t('linkExisting'), async () => {
    await act('linkPreset', { presetId: p.id, componentId: selComp.id });
  }, 'sm', { disabled: !canLink, title: canLink ? t('linkExistingTitle') : t('selectHint') });
  if (!comp) return h('div', { class: 'notice warn' }, icon('component'), h('span', {}, t('unlinkedNotice')), linkBtn);
  if (detail && detail.status === 'missing') return h('div', { class: 'notice err' }, icon('component'), h('span', {}, t('missingNotice', comp.name)), linkBtn);
  return h('div', { class: 'comp-row small' }, t('componentLabel'),
    btn([icon('component'), h('span', { class: 'ellipsis' }, comp.name)], () => act('locateComponent', { id: p.id }), 'ghost', { title: t('locateTitle') }));
}

function presetDetail() {
  const p = collectionById(ui.presetId);
  if (!p || !p.isPreset) { ui.presetId = null; return presetList(); }
  const inConfigs = state.configs.filter((c) => c.rows.some((r) => r.presetId === p.id));
  // The component is read live by the main thread for the open preset only (see watchPreset).
  const detail = compDetail && compDetail.presetId === p.id ? compDetail : null;
  const loading = !!p.component && !detail;
  const comp = detail && detail.status === 'ok' ? detail : null;
  const issues = comp ? comp.issues : [];
  const flagged = new Set(issues.map((i) => i.tokenId));
  const tokenById = new Map(p.tokens.map((tk) => [tk.id, tk]));
  const flag = (tk) => flagged.has(tk.id) && h('span', { class: 'flag', title: issues.filter((i) => i.tokenId === tk.id).map(issueText).join('\n') }, '⚠');
  const deleteBtn = (tk, linked) => btn('×', async () => (await confirmAction(t(linked ? 'confirmDeletePropToken' : 'confirmDeleteToken', tk.name))) && act('deleteToken', { id: tk.id }),
    'ghost sm icon hover-only', { title: t('deleteToken') });

  // One row per property of the component. A property without a token is "not added": editing any
  // of its values creates the token (that value in that mode, the component default elsewhere) and binds it.
  const propRows = comp ? comp.props.map((pr) => {
    const tk = pr.tokenId && tokenById.get(pr.tokenId);
    if (tk) {
      return h('tr', {},
        h('td', {},
          h('div', { class: 'name-cell', title: `${t('property')}: ${pr.name} · ${t('kind')[pr.kind]}` },
            icon(pr.kind), h('span', { class: 'text' }, tk.name), flag(tk), deleteBtn(tk, true))),
        p.modes.map((m) => h('td', { class: 'cell' },
          propEditor(pr, tk.values[m.id], (value) => act('setTokenValue', { id: tk.id, modeId: m.id, value })))),
        fillerCell());
    }
    const add = (modeId, value) => act('addPropToken', { presetId: p.id, ref: pr.ref, modeId, value });
    return h('tr', { class: 'unadded' },
      h('td', {},
        h('div', { class: 'name-cell', title: pr.binding === 'other' ? t('otherBoundTitle', pr.otherName) : t('notAddedTitle') },
          icon(pr.kind), h('span', { class: 'text' }, pr.name),
          pr.binding === 'other' && h('span', { class: 'flag' }, '⚠'),
          btn(t('add'), () => add(p.modes[0].id, pr.defaultValue), 'sm add-prop', { title: t('addWithDefaults') }))),
      p.modes.map((m) => h('td', { class: 'cell' }, propEditor(pr, null, (value) => add(m.id, value)))),
      fillerCell());
  }) : [];

  // Tokens that aren't bound to a property of the component (or every token, while there's no component).
  const mapped = new Set(comp ? comp.props.map((pr) => pr.tokenId).filter(Boolean) : []);
  const otherRows = loading ? [] : p.tokens.filter((tk) => !mapped.has(tk.id)).map((tk) => h('tr', {},
    h('td', {},
      h('div', { class: 'name-cell', title: typeLabel(tk.type) },
        icon(tk.type), h('span', { class: 'text' }, tk.name), flag(tk), deleteBtn(tk, false))),
    p.modes.map((m) => h('td', { class: 'cell' }, valueEditor(tk, m.id))),
    fillerCell()));

  return h('div', { class: 'stack' },
    ui.fromReport && h('div', { class: 'notice info' }, h('span', {}, t('fromReportNote')),
      btn(t('backToReport'), runCleanup, 'sm')),
    detailHead({
      onBack: () => (ui.fromReport ? runCleanup() : go({ presetId: null })),
      name: p.name,
      onRename: (name) => act('renamePreset', { id: p.id, name }),
      item: p,
      onDelete: async () => (await confirmAction(t('confirmDeletePreset', p.name, inConfigs.map((c) => c.name).join(', ')))) &&
        act('deletePreset', { id: p.id }).then((r) => r.ok && go({ presetId: null })),
    }),
    componentBar(p, detail),
    inConfigs.length > 0 && h('div', { class: 'row muted small' }, t('usedIn'),
      inConfigs.map((c) => h('span', { class: 'badge link', onclick: () => go({ tab: 'configs', configId: c.id }) }, c.name))),
    issues.length > 0 && h('div', { class: 'issues' }, issues.map(issueNotice)),
    comp && comp.props.length === 0 && h('div', { class: 'notice info' }, h('span', {}, t('noProps'))),
    loading && h('div', { class: 'row muted small' }, h('span', { class: 'spin' }), t('loadingComponent')),
    gridTable(p.id, p.modes,
      h('thead', {}, h('tr', {},
        labelHeader(p.id, p.component ? t('properties') : t('tokenId')),
        p.modes.map((m) => modeHeader(p.id, m, p.modes.length > 1)),
        addModeHeader(p.id, true),
      )),
      h('tbody', {}, propRows, otherRows),
    ),
  );
}

// ---------------------------------------------------------------------------
// Window resize handle (plugin windows can only be resized from the plugin side)
// ---------------------------------------------------------------------------
(() => {
  const grip = document.getElementById('resize');
  let start = null;
  const size = (e) => ({ w: start.w + e.clientX - start.x, h: start.h + e.clientY - start.y });
  grip.addEventListener('pointerdown', (e) => {
    start = { x: e.clientX, y: e.clientY, w: window.innerWidth, h: window.innerHeight };
    grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener('pointermove', (e) => {
    if (start) parent.postMessage({ pluginMessage: { type: 'resize', ...size(e) } }, '*');
  });
  grip.addEventListener('pointerup', (e) => {
    if (!start) return;
    parent.postMessage({ pluginMessage: { type: 'resize', ...size(e), done: true } }, '*');
    start = null;
  });
})();

applyLang();
render();
parent.postMessage({ pluginMessage: { type: 'ready' } }, '*');
</script>
</body>
