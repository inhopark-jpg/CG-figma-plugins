      keyLayerIsCurrent: "✓ 현재 레이어가 key 레이어입니다",
      noKeyLayerNote: "이 토큰에 지정된 key 레이어가 없습니다 — key 레이어 재지정으로 설정하세요.",
      done: "완료",
      importComplete: "가져오기 완료",
      importStat: function (p) {
        return "토큰 " + (p.updated || 0) + "개 업데이트됨" +
          (p.newModes ? " · 새 모드 " + p.newModes + "개" : "") + ".";
      },
      newModesLabel: "새 모드: ",
      unmatchedBanner: function (n) {
        return "토큰 ID와 일치하지 않는 행 " + n + "개를 건너뛰었습니다 — 새 토큰은 생성되지 않았습니다.";
      },
      blank: "(비어 있음)",
      importConfirm: "CSV를 가져와 토큰 값을 덮어씁니다.\n\n토큰은 ID(Variable Name 열)로 매칭됩니다. 일치하는 행은 파일의 값으로 모드 값이 교체되고, 새 모드 열은 추가됩니다. 파일에 Description 열이 있으면 설명도 교체됩니다(빈 칸은 설명을 지웁니다). 해당 열이 없으면 설명은 그대로 유지됩니다. 일치하는 토큰이 없는 행은 건너뜁니다(새로 생성되지 않음). 이 작업은 되돌릴 수 없습니다.",
      cleanupConfirm: '현재 페이지를 기준으로 "language" 컬렉션을 정리합니다: ID 부여, 이 페이지에서 발견된 key 레이어 재그룹화, 홈이 이 페이지이지만 사라진 key 레이어 표시, 번역이 누락된 토큰 보고. 다른 페이지에 있는 key 레이어는 건드리지 않습니다 — 각 페이지에서 정리를 실행하면 동기화됩니다. 이 작업은 되돌릴 수 없습니다.',
      csvNoData: "CSV에 데이터 행이 없습니다.",
      noVarsFound: '"language" 컬렉션에 토큰이 없습니다.',
    },
  };

  function t(key) {
    const dict = I18N[S.lang] || I18N.en;
    let v = dict[key];
    if (v == null) v = I18N.en[key];
    return v == null ? key : v;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function post(msg) { parent.postMessage({ pluginMessage: msg }, "*"); }

  // 16×16 stroke icons (currentColor) for buttons and panel headings.
  const ICON = {
    token: '<rect x="2.5" y="4" width="11" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 8h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>',
    swap: '<path d="M3 5.5h9.5M10 3l2.5 2.5L10 8M13 10.5H3.5M6 8l-2.5 2.5L6 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>',
    key: '<circle cx="5.5" cy="8" r="2.75" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8.25 8H14M12 8v2.5M14 8v1.75" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>',
    target: '<circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/>',
    go: '<path d="M5 11l6-6M6 5h5v5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>',
    back: '<path d="M13 8H3.5M7 4.5L3.5 8 7 11.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>',
    link: '<path d="M6.5 9.5l3-3M7 4.5l1-1a2.5 2.5 0 013.5 3.5l-1 1M9 11.5l-1 1A2.5 2.5 0 014.5 9l1-1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>',
    unlink: '<path d="M7 4.5l1-1a2.5 2.5 0 013.5 3.5l-1 1M9 11.5l-1 1A2.5 2.5 0 014.5 9l1-1M3 3l10 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>',
    trash: '<path d="M3.5 4.5h9M6.5 4.5V3h3v1.5M5 4.5l.5 8.5h5l.5-8.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>',
    copy: '<rect x="5.5" y="5.5" width="7.5" height="7.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3 10.5V4.5A1.5 1.5 0 014.5 3h6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>',
    check: '<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 8.2l1.7 1.7 3.3-3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>',
    warn: '<path d="M8 2.5L14 13H2L8 2.5Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 6.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="11.4" r=".75" fill="currentColor"/>',
    dash: '<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 8h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>',
    plus: '<path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>',
  };
  const ico = (name) => '<span class="ico"><svg viewBox="0 0 16 16">' + (ICON[name] || "") + "</svg></span>";
  const ibtn = (id, iconName, label, cls) =>
    '<button id="' + id + '" class="ibtn ' + (cls || "") + '">' + ico(iconName) + "<span>" + esc(label) + "</span></button>";

  // The "master section" of a group path = its top-most segment. Assign/swap
  // scoping groups variables by master section rather than the exact layer.
  function masterKey(groupPath) {
    if (!groupPath) return "";
    return String(groupPath).split("/")[0];
  }

  // ---- incoming -----------------------------------------------------------
  onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "state") {
      // While relocating, track the live selection to drive the Confirm button.
      if (S.relocating) {
        S.relocSelection = msg.selection;
        S.relocNodeName = msg.nodeName || "";
        renderRelocate();
        return;
      }
      // While a cleanup/import report is showing, ignore selection/page-change
      // refreshes so the report stays put (e.g. after clicking a broken layer).
      if (S.reportOpen && !S.reportPeek) return;
      // Keep the "go back to previous" affordance only while the selection is
      // still the node we jumped to. Deselecting (no nodeId) or selecting
      // anything else drops it, so re-selecting the key layer by hand shows the
      // "this is the key layer" indicator instead. Comparing ids rather than
      // counting messages keeps this correct when a cross-page jump fires both
      // currentpagechange and selectionchange.
      if (!S.keyNavTarget || msg.nodeId !== S.keyNavTarget) {
        S.keyNavTarget = null;
        S.backNodeId = null;
      }
      Object.assign(S, {
        selection:    msg.selection,
        modes:        msg.modes || [],
        defaultModeId: msg.defaultModeId || null,
        hasVar:       !!msg.hasVar,
        varMissing:   !!msg.varMissing,
        variable:     msg.variable || null,
        bindingKind:  msg.bindingKind || null,
        groupPath:    msg.groupPath || "",
        masterGroup:  msg.masterGroup || "",
        groupVars:    msg.groupVars || [],
        allVars:      msg.allVars || [],
        recentIds:    msg.recentIds || [],
        multiCount:   msg.count || 0,
        nodeId:       msg.nodeId || "",
        nodeName:     msg.nodeName || "",
        nodeText:     msg.nodeText || "",
        table:        msg.table || null,
      });
      if (msg.lang) S.lang = msg.lang;
      S.view = "primary";
      S.search = "";
      S.searchAll = false;
      applyLang();
    } else if (msg.type === "export-data") {
      if (!msg.vars || !msg.vars.length) {
        post({ type: "notify", message: t("noVarsFound") });
        return;
      }
      downloadCSV(generateCSV(msg.vars, msg.modes));
    } else if (msg.type === "cleanup-result") {
      renderReport(msg);
    } else if (msg.type === "import-result") {
      renderImportReport(msg);
    } else if (msg.type === "relocate-result") {
      if (msg.ok) {
        const origin = S.relocOrigin;
        S.relocating = null;
        S.relocOrigin = null;
        if (origin === "report") {
          // Drop this variable from the flagged list, back to the report.
          const idx = (S.reportFlagged || []).findIndex(f => f.id === msg.variableId);
          if (idx >= 0) S.reportFlagged.splice(idx, 1);
          if (S.reportTotals) S.reportTotals.flagged = Math.max(0, S.reportTotals.flagged - 1);
          renderReportView();
        } else {
          // Launched from the edit view — refresh to show the updated group/name.
          post({ type: "refresh" });
        }
      }
      // On failure a toast was already shown; stay in the relocate view.
    } else if (msg.type === "assign-broken-result") {
      if (msg.ok) {
        // Variable bound (assigned or newly created) — drop from the broken list.
        const idx = (S.reportBroken || []).findIndex(b => b.nodeId === msg.nodeId);
        if (idx >= 0) S.reportBroken.splice(idx, 1);
        if (S.reportTotals) S.reportTotals.broken = Math.max(0, S.reportTotals.broken - 1);
        S.assignBroken = null;
        S.assignCreating = false;
        // If a new variable was created, add it to the cached list for subsequent picks.
        if (msg.newVarId && S.allVars && !S.allVars.find(v => v.id === msg.newVarId)) {
          post({ type: "refresh" }); // let pushState refresh allVars
        }
        renderReportView();
      } else {
        // On failure a toast was already shown; stay in the picker/form.
        if (S.assignCreating) renderAssignBroken();
      }
    } else if (msg.type === "navigate-usage-result") {
      const p = S.peekPending;
      S.peekPending = null;
      if (!p || p.varId !== msg.variableId) return;
      if (msg.ok) { S.reportPeek = p; return; } // the state that follows renders the edit view
      if (p.kind === "missing") {
        const m = S.reportMissing[p.idx];
        if (m) openMissingEditor(m, p.idx);
      }
    } else if (msg.type === "save-missing-result") {
      if (msg.ok) {
        const idx = (S.reportMissing || []).findIndex(m => m.varId === msg.variableId);
        if (idx >= 0) {
          const entry = msg.entry || {};
          if (entry.modes && entry.modes.length) {
            // Still missing some modes — keep the row but refresh its values/modes.
            S.reportMissing[idx].modes = entry.modes;
            if (entry.valuesByMode) S.reportMissing[idx].valuesByMode = entry.valuesByMode;
          } else {
            // Fully filled — drop it from the list.
            S.reportMissing.splice(idx, 1);
            if (S.reportTotals) S.reportTotals.missing = Math.max(0, S.reportTotals.missing - 1);
          }
        }
        S.missingEditing = null;
        renderReportView();
      }
      // On failure a toast was already shown; stay in the editor.
    }
  };

  // ---- render -------------------------------------------------------------
  // While a report item is open in the normal views ("peek"), every view gets
  // a bar back to the report.
  function render() {
    renderView();
    if (S.reportOpen && S.reportPeek) {
      main.insertAdjacentHTML("afterbegin",
        '<button id="backToReport" class="ibtn ghost sm back">' + ico("back") + "<span>" + esc(t("backToReport")) + "</span></button>");
      $("backToReport").onclick = leavePeek;
    }
  }

  // Back to the report: drop items the user fixed while away.
  function leavePeek() {
    const p = S.reportPeek;
    S.reportPeek = null;
    const v = S.variable && p && S.variable.id === p.varId ? S.variable : null;
    const deleted = p && S.deletedIds && S.deletedIds[p.varId];
    if (p && p.kind === "missing") {
      const i = S.reportMissing.findIndex((m) => m.varId === p.varId);
      if (i >= 0) {
        const stillMissing = v ? S.modes.some((mo) => { const x = v.valuesByMode[mo.modeId]; return x == null || x === "" || x === "--"; }) : !deleted;
        if (deleted || !stillMissing) {
          S.reportMissing.splice(i, 1);
          if (S.reportTotals) S.reportTotals.missing = Math.max(0, S.reportTotals.missing - 1);
        } else if (v) S.reportMissing[i].valuesByMode = v.valuesByMode;
      }
    }
    if (p && (p.kind === "flagged" || deleted)) {
      const i = S.reportFlagged.findIndex((f) => f.id === p.varId);
      const fixed = v && (v.keyStatus === "current" || v.keyStatus === "elsewhere");
      if (i >= 0 && (deleted || fixed)) {
        S.reportFlagged.splice(i, 1);
        if (S.reportTotals) S.reportTotals.flagged = Math.max(0, S.reportTotals.flagged - 1);
      }
    }
    renderReportView();
  }

  function renderView() {
    if (S.selection === "no-collection") return renderMessage(
      t("noCollectionTitle"), t("noCollectionBody")
    );
    if (S.selection === "none") return renderHome();
    if (S.selection === "multiple") return renderMessage(
      t("multipleTitle"), t("multipleBody")
    );
    if (S.selection === "unsupported") return renderMessage(
      t("unsupportedTitle"), t("unsupportedBody")
    );
    if (S.selection === "multi-node") return renderMulti();
    if (S.selection === "table-source" || S.selection === "table-table") return renderTable();
    if (S.selection !== "node") return renderMessage("…", "");

    if (S.view === "list")   return renderList(true);
    if (S.view === "create") return renderCreate();
    return renderPrimary();
  }

  // ---- translation table ---------------------------------------------------
  // A top-level layer ("table-source") can get a table; a selected table
  // ("table-table") can be refreshed or traced back to its layer.
  function renderTable() {
    const tb = S.table || {};
    const isTable = S.selection === "table-table";
    let html = '<div class="var-head"><div class="leaf">' +
      esc(isTable ? t("tableTitle") : tb.sourceName) + "</div>" +
      '<div class="grp">' + esc(isTable ? (tb.sourceName ? t("tableOf")(tb.sourceName) : "") : t("tableVarsFound")(tb.varCount || 0)) +
      "</div></div>";
    if (tb.tplStatus === "missing") {
      html += '<div class="notice err"><span>' + esc(t("tplMissing")) + "</span>" +
        '<button id="tplRestore" class="xs">' + esc(t("tplRestore")) + "</button></div>";
    }
    if (isTable) {
      if (!tb.sourceId) html += '<div class="notice err"><span>' + esc(t("tableSourceGone")) + "</span></div>";
      html += '<div class="actions">' +
        '<button id="tblUpdate" class="primary"' + (tb.sourceId && tb.tplStatus !== "missing" ? "" : " disabled") + ">" + esc(t("tableUpdate")) + "</button>" +
        '<button id="tblGoSource"' + (tb.sourceId ? "" : " disabled") + ">" + esc(t("tableGoToSource")) + "</button></div>";
    } else {
      if (!tb.varCount) html += '<div class="notice"><span>' + esc(t("tableNoVars")) + "</span></div>";
      html += '<button id="tblCreate" class="primary full"' +
        (tb.varCount && tb.tplStatus !== "missing" ? "" : " disabled") + ">" +
        esc(tb.tableId ? t("tableUpdate") : t("tableCreate")) + "</button>";
      if (tb.tableId) html += '<button id="tblGo" class="full" style="margin-top:8px">' + esc(t("tableGoTo")) + "</button>";
      if (tb.varCount) html += '<div class="muted" style="margin-top:10px;font-size:11px;line-height:1.5">' + esc(t("tableHint")) + "</div>";
    }
    main.innerHTML = html;
    const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
    on("tplRestore", () => post({ type: "table-restore" }));
    on("tblCreate", () => post({ type: "table-create" }));
    on("tblGo", () => post({ type: "navigate-to-node", nodeId: tb.tableId }));
    on("tblUpdate", () => post({ type: "table-update", tableId: tb.tableId }));
    on("tblGoSource", () => post({ type: "navigate-to-node", nodeId: tb.sourceId }));
  }

  function renderMessage(title, body) {
    main.innerHTML =
      '<div class="center-msg"><div style="font-weight:600;color:var(--text)">' +
      esc(title) + '</div><div>' + esc(body) + "</div></div>";
  }

  // ---- primary view -------------------------------------------------------
  function renderPrimary() {
    if (S.hasVar) return renderEdit();

    let html = "";

    if (S.varMissing) {
      html +=
        '<div class="error-banner">' +
        '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-top:1px">' +
        '<path d="M8 2L14 13H2L8 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>' +
        '<path d="M8 6.5V9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' +
        '<circle cx="8" cy="11.5" r="0.75" fill="currentColor"/>' +
        '</svg>' +
        '<span>' + esc(t("varMissingBanner")) + '</span>' +
        "</div>";
    } else {
      // Clearly "no token here" — the form only opens on request, so an empty
      // layer is never mistaken for a linked one.
      html +=
        '<div class="notice info">' + ico("dash") + "<span><b>" + esc(t("noVarLinked")) + "</b><br>" +
        esc(t("noVarLinkedHint")) + "</span></div>" +
        '<div class="muted" style="font-size:11px;margin:-2px 0 12px">' + esc(t("groupPrefix")) + esc(S.groupPath || t("pageRoot")) + "</div>";
    }
    html += '<button id="startCreate" class="ibtn primary full">' + ico("plus") + "<span>" + esc(t("createTokenBtn")) + "</span></button>";
    main.innerHTML = html;
    $("startCreate").onclick = () => { S.createOrigin = "primary"; S.view = "create"; render(); };
  }

  // ---- edit view ----------------------------------------------------------
  function renderEdit() {
    const v = S.variable;
    const titleVal = v.valuesByMode[S.defaultModeId];
    let html =
      '<div class="var-head">' +
      '<div class="leaf">' + esc(typeof titleVal === "string" && titleVal !== "" ? titleVal : "—") + "</div>" +
      '<div class="grp">ID ' + esc(v.varId || v.leaf) + " · " + esc(v.group || t("pageRoot")) + "</div>" +
      '<div class="kind">' +
      esc(S.bindingKind === "property" ? t("boundProperty") : t("boundText")) +
      "</div></div>";

    // Capture original values to drive confirm-button disabled state.
    const originals = {};
    for (let i = 0; i < S.modes.length; i++) {
      const m = S.modes[i];
      const raw = v.valuesByMode[m.modeId];
      originals[m.modeId] = typeof raw === "string" ? raw : null;
    }
    const originalDesc = typeof v.description === "string" ? v.description : "";

    // Description sits above the per-mode values — it describes the variable
    // as a whole, not any single mode.
    html +=
      '<div class="field">' +
      '<span class="mode-tag">' + esc(t("descLabel")) + "</span>" +
      '<textarea id="desc" placeholder="' + esc(t("descPlaceholder")) + '">' +
      esc(originalDesc) + "</textarea>" +
      "</div>";

    html += '<div id="modes">';
    for (let i = 0; i < S.modes.length; i++) {
      const m = S.modes[i];
      const val = v.valuesByMode[m.modeId];
      const isAlias = val === null;
      html +=
        '<div class="field">' +
        '<span class="mode-tag">' + esc(m.name) + (m.isDefault ? esc(t("defaultSuffix")) : "") + "</span>" +
        '<textarea data-mode="' + m.modeId + '"' + (isAlias ? " disabled" : "") + ">" +
        esc(isAlias ? "" : val) + "</textarea>" +
        (isAlias ? '<div class="muted" style="margin-top:4px">' + esc(t("aliasNote")) + '</div>' : "") +
        "</div>";
    }
    html += "</div>";

    html +=
      '<div class="actions">' +
      '<button id="cancel">' + esc(t("cancel")) + '</button>' +
      '<button id="confirm" class="primary" disabled>' + esc(t("confirm")) + '</button>' +
      "</div>";

    // Below the values, one panel per concern — token, key layer, link — each
    // holding its own status, actions and explanation.
    //   Key layer status comes from the main thread (checked on every selection):
    //   current | elsewhere | missing | none.
    const keyNodeId = v.keyNodeId || "";
    const keyStatus = v.keyStatus || (keyNodeId ? "elsewhere" : "none");
    const isKey = keyStatus === "current";

    html +=
      '<div class="panel">' +
      '<div class="panel-head">' + ico("token") + "<span>" + esc(t("panelToken")) + "</span></div>" +
      '<div class="btns">' + ibtn("swap", "swap", t("swapVar"), "full") + "</div>" +
      '<div class="panel-note">' + esc(t("swapVarHint")) + "</div>" +
      "</div>";

    const statusRow = (cls, iconName, text) =>
      '<div class="status ' + cls + '">' + ico(iconName) + "<span>" + esc(text) + "</span></div>";
    let keyHtml = "";
    if (isKey) keyHtml += statusRow("ok", "check", t("keyStatusCurrent"));
    else if (keyStatus === "elsewhere") keyHtml += statusRow("muted-status", "key", t("keyStatusElsewhere"));
    else if (keyStatus === "missing") keyHtml += '<div class="notice warn">' + ico("warn") + "<span>" + esc(t("keyStatusMissing")) + "</span></div>";
    else keyHtml += statusRow("muted-status", "dash", t("keyStatusNone"));
    keyHtml += '<div class="btns">';
    if (S.backNodeId) keyHtml += ibtn("goBack", "back", t("goBackPrevious"), "full");
    else if (keyStatus === "elsewhere") keyHtml += ibtn("gotoKey", "go", t("goToKeyLayer"), "full");
    if (!isKey) keyHtml += ibtn("makeKey", "target", t("makeKeyHere"), "full");
    if (!isKey) keyHtml += ibtn("relocEdit", "key", t("relocateKeyOther"), "full ghost");
    keyHtml += "</div>";
    html +=
      '<div class="panel">' +
      '<div class="panel-head">' + ico("key") + "<span>" + esc(t("panelKey")) + "</span></div>" +
      keyHtml +
      '<div class="panel-note">' + esc(t("keyIntro")) + "</div>" +
      "</div>";

    // Unlink / delete: on the key layer this deletes the token (unlinking
    // its other uses on this page); anywhere else it only unlinks this layer.
    html +=
      '<div class="panel">' +
      '<div class="panel-head">' + ico("link") + "<span>" + esc(t("panelLink")) + "</span></div>" +
      '<div class="btns">' +
      (isKey ? ibtn("delVar", "trash", t("deleteVarBtn"), "danger full") : ibtn("unlinkSel", "unlink", t("unlinkThisBtn"), "full")) +
      "</div>" +
      '<div class="panel-note">' + esc(isKey ? t("deleteVarHint") : t("unlinkThisHint")) + "</div>" +
      "</div>";

    main.innerHTML = html;

    const confirmBtn = $("confirm");

    const descBox = $("desc");

    // Enable confirm only when at least one editable field has changed.
    const checkChanged = () => {
      let changed = descBox.value !== originalDesc;
      const areas = main.querySelectorAll("textarea[data-mode]");
      for (let i = 0; i < areas.length && !changed; i++) {
        const t = areas[i];
        if (!t.disabled && t.value !== (originals[t.getAttribute("data-mode")] || "")) {
          changed = true;
        }
      }
      confirmBtn.disabled = !changed;
    };

    const areas = main.querySelectorAll("textarea[data-mode]");
    for (let i = 0; i < areas.length; i++) {
      areas[i].oninput = checkChanged;
    }
    descBox.oninput = checkChanged;

    $("cancel").onclick = () => render();
    confirmBtn.onclick = () => {
      const values = {};
      const all = main.querySelectorAll("textarea[data-mode]");
      for (let i = 0; i < all.length; i++) {
        if (!all[i].disabled) values[all[i].getAttribute("data-mode")] = all[i].value;
      }
      post({ type: "save", values, description: descBox.value });
    };
    $("swap").onclick = () => { S.listMode = "swap"; S.view = "list"; S.search = ""; render(); };
    const unlinkBtn = $("unlinkSel");
    if (unlinkBtn) unlinkBtn.onclick = () => post({ type: "unlink-node", nodeId: S.nodeId, refresh: true });
    const delBtn = $("delVar");
    if (delBtn) {
      // Two clicks: the first arms the button, the second deletes.
      delBtn.onclick = () => {
        if (!delBtn.classList.contains("danger-fill")) {
          delBtn.classList.add("danger-fill");
          delBtn.querySelector("span:last-child").textContent = t("deleteVarConfirm");
          return;
        }
        delBtn.disabled = true;
        (S.deletedIds = S.deletedIds || {})[v.id] = true;
        post({ type: "delete-var", variableId: v.id, refresh: true });
      };
    }
    const gotoKeyBtn = $("gotoKey");
    if (gotoKeyBtn) {
      gotoKeyBtn.onclick = () => {
        // Remember where we came from; the state handler keeps this alive only
        // while the selection stays on keyNodeId.
        S.keyNavTarget = keyNodeId;
        S.backNodeId = S.nodeId || null;
        post({ type: "navigate-to-node", nodeId: keyNodeId });
      };
    }

    const goBackBtn = $("goBack");
    if (goBackBtn) {
      goBackBtn.onclick = () => {
        const target = S.backNodeId;
        S.keyNavTarget = null;
        S.backNodeId = null;
        post({ type: "navigate-to-node", nodeId: target });
      };
    }
    const makeKeyBtn = $("makeKey");
    if (makeKeyBtn) {
      // The selection already is this layer, so relocate straight to it.
      makeKeyBtn.onclick = () => {
        S.relocOrigin = "edit";
        post({ type: "relocate-key", variableId: v.id });
      };
    }
    const relocBtn = $("relocEdit");
    if (relocBtn) relocBtn.onclick = () => {
      S.relocating = { id: v.id, leaf: v.varId || v.leaf, group: v.group };
      S.relocOrigin = "edit";
      S.relocSelection = null;
      S.relocNodeName = "";
      renderRelocate();
      post({ type: "refresh" }); // fetch current selection to drive Confirm
    };
  }

  // ---- list view ----------------------------------------------------------
  function matchesSearch(v, q) {
    if (!q) return true;
    q = q.toLowerCase();
    if (v.leaf.toLowerCase().includes(q) || v.name.toLowerCase().includes(q)) return true;
    for (const mid in v.valuesByMode) {
      const val = v.valuesByMode[mid];
      if (typeof val === "string" && val.toLowerCase().includes(q)) return true;
    }
    return false;
  }

  // Renders only the scrollable list body — called on every search keystroke
  // without touching the sticky header, so the <input> is never destroyed
  // and Korean IME composition works correctly.
  function renderListBody() {
    const listBody = $("list-body");
    if (!listBody) return;

    const isMulti   = S.selection === "multi-node";
    const isImport  = !isMulti && S.listMode === "import";
    const swapMsg   = isMulti ? "multi-swap" : "swap";
    const currentId = S.variable ? S.variable.id : null;

    // One scope only: every token in the collection, filtered by the search.
    const LIST_LIMIT = 100;
    const matched = S.allVars.filter(v => matchesSearch(v, S.search));
    if (matched.length === 0) {
      listBody.innerHTML = '<div class="muted" style="padding:4px 2px">' +
        esc(S.allVars.length ? t("noMatch") : t("noVarsFound")) + "</div>";
      return;
    }
    // Keep the current token visible at the top of an unfiltered swap list.
    if (currentId && !S.search) {
      const ci = matched.findIndex(v => v.id === currentId);
      if (ci > 0) matched.unshift(matched.splice(ci, 1)[0]);
    }
    const vars = matched.slice(0, LIST_LIMIT);
    const sectionLabel = t("homeCount")(matched.length);

    const defId = S.defaultModeId;
    let html = sectionLabel
      ? '<div class="list-section-label">' + esc(sectionLabel) + "</div>"
      : "";
    html += '<div class="list">';
    for (let i = 0; i < vars.length; i++) {
      const v = vars[i];
      const isCurrent = !isMulti && v.id === currentId;
      const preview = v.valuesByMode[defId];
      const idLabel = v.varId || v.leaf;
      html +=
        '<div class="list-item' + (isCurrent ? " current" : "") + '" data-id="' + v.id + '">' +
        '<div class="li-leaf">' + esc(typeof preview === "string" && preview !== "" ? preview : "—") +
        (isCurrent ? ' <span class="li-current-tag">' + esc(t("current")) + '</span>' : "") + "</div>" +
        '<div class="li-val">' + esc(idLabel) + " · " + esc(v.group || t("pageRoot")) + "</div>" +
        "</div>";
    }
    html += "</div>";
    if (matched.length > LIST_LIMIT) html += '<div class="muted" style="padding:8px 2px">' + esc(t("homeMore")(LIST_LIMIT)) + "</div>";

    listBody.innerHTML = html;
    listBody.querySelectorAll(".list-item").forEach((el) => {
      el.onclick = () => {
        const id = el.getAttribute("data-id");
        if (!isImport) return post({ type: swapMsg, variableId: id });
        // Copy values only — the new token gets its own ID; nothing is linked.
        const src = S.allVars.find((x) => x.id === id) || S.groupVars.find((x) => x.id === id);
        if (!src) return;
        const d = draftFor();
        for (const m of S.modes) {
          const val = src.valuesByMode[m.modeId];
          d.values[m.modeId] = typeof val === "string" ? val : "";
        }
        d.copiedFrom = src.varId || src.leaf;
        S.listMode = null; S.searchAll = false;
        S.view = S.returnView === "create" ? "create" : "primary";
        render();
      };
    });
  }

  function renderList(scrollToCurrent) {
    const currentId = S.variable ? S.variable.id : null;

    // Sticky header — rebuilt once per navigation; stable DOM so IME is not disrupted.
    let html =
      '<div class="list-sticky">' +
      '<div class="list-nav">' +
      '<button id="back" class="ghost sm">' + esc(t("back")) + '</button>' +
      "</div>" +
      (S.listMode === "import" ? '<div class="view-title" style="margin-bottom:8px">' + esc(t("importPick")) + "</div>" : "") +
      '<div class="list-actions">' +
      '<input id="search" type="text" placeholder="' + esc(t("searchPlaceholder")) + '" value="' + esc(S.search) + '" />' +
      (S.listMode === "import" ? "" : '<button id="create" class="primary sm" style="white-space:nowrap">' + esc(t("newVariable")) + '</button>') +
      "</div>" +
      "</div>" +
      '<div id="list-body" class="list-body"></div>';

    main.innerHTML = html;

    $("back").onclick = () => {
      S.searchAll = false;
      if (S.listMode === "import") { S.listMode = null; S.view = S.returnView === "create" ? "create" : "primary"; }
      else S.view = "primary";
      render();
    };
    const createBtn = $("create");
    if (createBtn) createBtn.onclick = () => { S.createOrigin = "list"; S.view = "create"; render(); };

    // Wire up search with IME support: never re-render the sticky header,
    // only update the list body via renderListBody().
    const search = $("search");
    let composing = false;
    search.addEventListener("compositionstart", () => { composing = true; });
    search.addEventListener("compositionend", () => {
      composing = false;
      S.search = search.value;
      renderListBody();
    });
    search.addEventListener("input", () => {
      if (composing) return;
      S.search = search.value;
      renderListBody();
    });

    renderListBody();

    // Center the active variable in the list only on first open.
    if (scrollToCurrent && S.listMode === "swap" && currentId) {
      const cur = main.querySelector(".list-item.current");
      if (cur) cur.scrollIntoView({ block: "center" });
    }
  }

  // ---- multi-select view --------------------------------------------------
  // Shown when multiple valid text/instance layers are selected.
  // Always operates in "all vars" mode — no group filter, no create button.
  function renderMulti() {
    const count = S.multiCount;
    let html =
      '<div class="list-sticky">' +
      '<div class="list-nav" style="margin-bottom:8px">' +
      '<span class="view-title">' +
      esc(t("layersSelected")(count)) +
      "</span>" +
      "</div>" +
      '<div class="list-actions">' +
      '<input id="search" type="text" placeholder="' + esc(t("searchPlaceholder")) + '" value="' + esc(S.search) + '" />' +
      "</div>" +
      "</div>" +
      '<div id="list-body" class="list-body"></div>';

    main.innerHTML = html;

    const search = $("search");
    let composing = false;
    search.addEventListener("compositionstart", () => { composing = true; });
    search.addEventListener("compositionend", () => {
      composing = false; S.search = search.value; renderListBody();
    });
    search.addEventListener("input", () => {
      if (composing) return; S.search = search.value; renderListBody();
    });

    renderListBody();
  }

  // ---- create view --------------------------------------------------------
  // Inline under the "no token" header for an unlinked layer (`head` given),
  // or on its own from the swap list. Values live in S.draft so they survive
  // a trip to the "copy values from another token" picker.
  function draftFor() {
    if (!S.draft || S.draft.nodeId !== S.nodeId) {
      // Hard-coded text (no token linked, or a broken link): start the default
      // value from what the layer shows now.
      const values = {};
      if (!S.hasVar && S.nodeText && S.defaultModeId) values[S.defaultModeId] = S.nodeText;
      S.draft = { nodeId: S.nodeId, values, prefilled: !!values[S.defaultModeId], copiedFrom: "" };
    }
    return S.draft;
  }

  function saveDraftFromForm() {
    const d = draftFor();
    main.querySelectorAll("textarea[data-mode]").forEach((ta) => { d.values[ta.getAttribute("data-mode")] = ta.value; });
  }

  function renderCreate(head) {
    const inline = typeof head === "string";
    const d = draftFor();
    let html = inline ? head : '<button id="back" class="ghost sm back">' + esc(t("back")) + "</button>";
    html +=
      '<div class="field"><span class="mode-tag">' + esc(t("newVarIn")) +
      esc(S.groupPath || t("pageRoot")) + "</span></div>";

    if (d.copiedFrom) {
      html += '<div class="notice info">' + ico("copy") + "<span>" + esc(t("copiedFrom")(d.copiedFrom)) + "</span></div>";
    }
    for (let i = 0; i < S.modes.length; i++) {
      const m = S.modes[i];
      const val = d.values[m.modeId] || "";
      html +=
        '<div class="field">' +
        '<label>' + esc(m.name) +
        (m.isDefault ? esc(t("defaultSuffix")) + ' <span class="req">*</span>' : "") + "</label>" +
        '<textarea data-mode="' + m.modeId + '" data-default="' + (m.isDefault ? "1" : "") +
        '" placeholder="' + esc(m.isDefault ? t("required") : "--") + '">' + esc(val) + "</textarea>" +
        "</div>";
    }

    html +=
      '<div class="muted" style="margin-bottom:10px">' + esc(t("idAssignedNote")) + '</div>' +
      '<button id="createBtn" class="ibtn primary full">' + ico("plus") + "<span>" + esc(t("createAssign")) + "</span></button>" +
      '<button id="copyFrom" class="ibtn full ghost" style="margin-top:6px">' + ico("copy") + "<span>" + esc(t("importValues")) + "</span></button>";

    main.innerHTML = html;

    const back = $("back");
    if (back) back.onclick = () => {
      saveDraftFromForm();
      S.view = S.createOrigin === "primary" ? "primary" : "list";
      render();
    };
    $("copyFrom").onclick = () => {
      saveDraftFromForm();
      S.returnView = S.view;
      S.listMode = "import"; S.view = "list"; S.search = "";
      render();
    };
    $("createBtn").onclick = () => {
      const values = {};
      const areas = main.querySelectorAll("textarea[data-mode]");
      for (let i = 0; i < areas.length; i++) {
        values[areas[i].getAttribute("data-mode")] = areas[i].value;
      }
      post({ type: "create", values });
    };
  }

  // ---- home: nothing selected — search tokens, jump to their key layer ------
  const HOME_LIMIT = 100;
  function renderHome() {
    main.innerHTML =
      '<div class="home-hint">' + esc(t("homeHint")) + "</div>" +
      '<input id="homeSearch" type="text" style="width:100%" placeholder="' + esc(t("searchPlaceholder")) + '" value="' + esc(S.homeSearch || "") + '" />' +
      '<div id="home-body" class="list-body"></div>';
    const search = $("homeSearch");
    let composing = false;
    search.addEventListener("compositionstart", () => { composing = true; });
    search.addEventListener("compositionend", () => { composing = false; S.homeSearch = search.value; renderHomeBody(); });
    search.addEventListener("input", () => { if (composing) return; S.homeSearch = search.value; renderHomeBody(); });
    renderHomeBody();
  }

  function renderHomeBody() {
    const body = $("home-body");
    if (!body) return;
    const all = S.allVars.filter((v) => matchesSearch(v, S.homeSearch || ""));
    if (!all.length) {
      body.innerHTML = '<div class="muted" style="padding:4px 2px">' + esc(S.allVars.length ? t("noMatch") : t("noVarsFound")) + "</div>";
      return;
    }
    const shown = all.slice(0, HOME_LIMIT);
    const defId = S.defaultModeId;
    let html = '<div class="list-section-label">' + esc(t("homeCount")(all.length)) + "</div><div class=\"list\">";
    for (const v of shown) {
      const preview = v.valuesByMode[defId];
      html +=
        '<div class="list-item"' + (v.keyNodeId ? ' data-key="' + esc(v.keyNodeId) + '"' : ' style="cursor:default"') + ">" +
        '<div class="li-leaf">' + esc(typeof preview === "string" && preview !== "" ? preview : "—") + "</div>" +
        '<div class="li-val">' + esc(v.varId || v.leaf) + " · " + esc(v.group || t("pageRoot")) + "</div>" +
        (v.keyNodeId
          ? '<div class="li-go">→ ' + esc(t("goToKeyLayer")) + "</div>"
          : '<div class="li-nokey">' + esc(t("homeNoKey")) + "</div>") +
        "</div>";
    }
    html += "</div>";
    if (all.length > HOME_LIMIT) html += '<div class="muted" style="padding:8px 2px">' + esc(t("homeMore")(HOME_LIMIT)) + "</div>";
    body.innerHTML = html;
    body.querySelectorAll("[data-key]").forEach((el) => {
      el.onclick = () => post({ type: "navigate-to-node", nodeId: el.getAttribute("data-key") });
    });
  }

  // ---- cleanup report -----------------------------------------------------
  // Shown after "Clean up variables" when one or more variables are missing
  // their key layer. Lists where each one expects its key so it can be re-made.
  // Each missing-key item has a Delete button that removes the variable in place.
  function renderReport(r) {
    S.reportOpen = "cleanup";
    S.reportPage = r.pageName || "";
    if (r.allVars) S.allVars = r.allVars; // fresh post-cleanup list for the assign picker
    if (r.modes) S.modes = r.modes;       // for the in-report missing-value editor
    if (r.defaultModeId) S.defaultModeId = r.defaultModeId;
    S.reportFlagged = (r.flagged       || []).slice();
    S.reportBroken  = (r.brokenNodes   || []).slice();
    S.reportMissing = (r.missingValues || []).slice();
    S.reportTotals  = {
      flagged: r.flaggedTotal != null ? r.flaggedTotal : (r.flagged || []).length,
      broken:  r.brokenTotal  != null ? r.brokenTotal  : (r.brokenNodes || []).length,
      missing: r.missingTotal != null ? r.missingTotal : (r.missingValues || []).length,
    };
    S.reportStats   = { renamed: r.renamed, regrouped: r.regrouped || 0, migrated: r.migrated || 0 };
    renderReportView();
  }

  function cappedNote(shown, total) {
    return total > shown
      ? '<div class="muted" style="padding:4px 2px">' + esc(t("showingSome")(shown, total)) + "</div>"
      : "";
  }

  function renderReportView() {
    const r       = S.reportStats   || { renamed: 0, regrouped: 0, migrated: 0 };
    const flagged = S.reportFlagged || [];
    const broken  = S.reportBroken  || [];
    const missing = S.reportMissing || [];
    const totals  = S.reportTotals  || { flagged: flagged.length, broken: broken.length, missing: missing.length };

    let html = '<div class="view-title" style="margin-bottom:6px">' + esc(t("cleanupComplete")(S.reportPage || "")) + '</div>';
    html += '<div class="muted" style="margin-bottom:10px">' + esc(t("cleanupStat")(r)) + "</div>";

    function sectionHead(label, count) {
      return '<div class="report-section-head">' + esc(label) +
        ' <span class="rs-count">(' + count + ')</span></div>';
    }

    // Tokens whose key layer is gone, split in two: still used on this page
    // (relocate the key to one of those layers) vs. not used here at all
    // (usually safe to delete). Item indexes stay those of S.reportFlagged.
    function flaggedItem(f, i, unused) {
      // Only the text block is clickable — Relocate/Delete are siblings, so
      // their clicks never reach it and need no stopPropagation.
      const hasUse = !!f.usageNodeId;
      return '<div class="list-item" style="cursor:default;display:flex;align-items:center;gap:8px">' +
        '<div style="flex:1;min-width:0' + (hasUse ? ";cursor:pointer" : "") + '"' +
        (hasUse ? ' data-usage="' + i + '"' : "") + ">" +
        '<div class="li-leaf">⚠️ ' + esc(f.leaf) +
        (unused ? "" : ' <span class="badge warn" title="' + esc(t("linkedBadgeTip")) + '">' + esc(t("linkedBadge")(f.usageCount)) + "</span>") +
        "</div>" +
        '<div class="li-val">' + esc(f.value ? f.value : "—") + "</div>" +
        '<div class="li-grp">' + esc(f.group || t("noGroup")) + "</div>" +
        (hasUse
          ? '<div class="li-use">\u2192 ' + esc(t("usedAt")) + esc(f.usageGroup || t("pageRoot")) +
            (f.usageCount > 1 ? esc(t("usedMore")(f.usageCount - 1)) : "") + "</div>"
          : "") +
        "</div>" +
        '<button class="sm" style="flex-shrink:0" data-reloc="' + i + '">' + esc(t("relocate")) + '</button>' +
        '<button class="sm danger" style="flex-shrink:0" data-del="' + i + '"' +
        (f.usageCount > 0 ? ' title="' + esc(t("delLinkedTip")(f.usageCount)) + '"' : "") + ">" + esc(t("del")) + "</button>" +
        "</div>";
    }
    const linkedIdx = [], unusedIdx = [];
    flagged.forEach((f, i) => (f.usageCount > 0 ? linkedIdx : unusedIdx).push(i));

    if (linkedIdx.length) {
      html += '<div class="report-section">';
      html += sectionHead(t("missingKeyHeading"), linkedIdx.length);
      html += '<div class="muted report-section-note">' + esc(t("missingKeyNote")) + '</div>';
      html += '<div class="list">' + linkedIdx.map((i) => flaggedItem(flagged[i], i, false)).join("") + "</div>";
      html += "</div>";
    }
    if (unusedIdx.length) {
      html += '<div class="report-section">';
      html += sectionHead(t("unusedHeading"), unusedIdx.length);
      html += '<div class="muted report-section-note">' + esc(t("unusedNote")) + '</div>';
      html += '<div class="list">' + unusedIdx.map((i) => flaggedItem(flagged[i], i, true)).join("") + "</div>";
      html += "</div>";
    }
    if (flagged.length) html += cappedNote(flagged.length, totals.flagged);

    if (broken.length) {
      html += '<div class="report-section">';
      html += sectionHead(t("brokenHeading"), totals.broken);
      html += '<div class="list">';
      for (let i = 0; i < broken.length; i++) {
        const b = broken[i];
        html +=
          '<div class="list-item" style="cursor:pointer;display:flex;align-items:center;gap:8px" data-nav="' + esc(b.nodeId) + '">' +
          '<div style="flex:1;min-width:0">' +
          '<div class="li-leaf">' + esc(b.nodeName) + "</div>" +
          '<div class="li-grp">' + esc(b.groupPath || t("noGroup")) + "</div>" +
          "</div>" +
          '<button class="sm" style="flex-shrink:0" data-assign="' + esc(b.nodeId) + '">' + esc(t("assignBtn")) + '</button>' +
          '<button class="sm" style="flex-shrink:0" data-unlink="' + i + '">' + esc(t("unlink")) + '</button>' +
          "</div>";
      }
      html += "</div>";
      html += cappedNote(broken.length, totals.broken);
      html += "</div>";
    }

    if (missing.length) {
      html += '<div class="report-section">';
      html += sectionHead(t("missingHeading"), totals.missing);
      html += '<div class="muted report-section-note">' + esc(t("missingNote")) + '</div>';
      html += '<div class="list">';
      for (let i = 0; i < missing.length; i++) {
        const m = missing[i];
        html +=
          '<div class="list-item" style="cursor:pointer" data-miss="' + i + '">' +
          '<div class="li-leaf">' + esc(m.id) + "</div>" +
          '<div class="li-grp">' + esc(m.group || t("noGroup")) + " · " + esc(t("missingPrefix")) + esc(m.modes.join(", ")) + "</div>" +
          (m.usageCount > 0 ? "" : '<div class="li-grp">' + esc(t("notUsedOnPage")) + "</div>") +
          "</div>";
      }
      html += "</div>";
      html += cappedNote(missing.length, totals.missing);
      html += "</div>";
    }

    html += '<div class="report-footer"><button id="reportDone" class="primary full">' + esc(t("done")) + '</button></div>';
    main.innerHTML = html;

    main.querySelectorAll("[data-del]").forEach((btn) => {
      btn.onclick = () => {
        const idx = parseInt(btn.getAttribute("data-del"), 10);
        const f = S.reportFlagged[idx];
        if (!f) return;
        // Still used on this page: arm first, so it's clear the layers get unlinked.
        if (f.usageCount > 0 && !btn.classList.contains("danger-fill")) {
          btn.classList.add("danger-fill");
          btn.textContent = t("delLinkedConfirm")(f.usageCount);
          return;
        }
        post({ type: "delete-var", variableId: f.id });
        S.reportFlagged.splice(idx, 1);
        if (S.reportTotals) S.reportTotals.flagged = Math.max(0, S.reportTotals.flagged - 1);
        renderReportView();
      };
    });

    main.querySelectorAll("[data-usage]").forEach((el) => {
      el.onclick = () => {
        const idx = parseInt(el.getAttribute("data-usage"), 10);
        const f = S.reportFlagged[idx];
        if (!f || !f.usageNodeId) return;
        S.peekPending = { kind: "flagged", varId: f.id, idx: idx };
        post({ type: "navigate-to-usage", variableId: f.id }); // nearest layer using it
      };
    });

    main.querySelectorAll("[data-reloc]").forEach((btn) => {
      btn.onclick = () => {
        const idx = parseInt(btn.getAttribute("data-reloc"), 10);
        const f = S.reportFlagged[idx];
        if (!f) return;
        S.relocating = f;
        S.relocOrigin = "report";
        S.relocSelection = null;
        S.relocNodeName = "";
        renderRelocate();
        post({ type: "refresh" }); // fetch current selection to drive Confirm
      };
    });

    main.querySelectorAll("[data-nav]").forEach((item) => {
      item.onclick = () => post({ type: "navigate-to-node", nodeId: item.getAttribute("data-nav") });
    });

    main.querySelectorAll("[data-assign]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation(); // don't also trigger the row's navigate
        const nodeId = btn.getAttribute("data-assign");
        const b = (S.reportBroken || []).find(x => x.nodeId === nodeId);
        if (!b) return;
        S.assignBroken = b;
        S.assignSearch = "";
        renderAssignBroken();
        post({ type: "navigate-to-node", nodeId: nodeId }); // show the layer on canvas
      };
    });

    main.querySelectorAll("[data-unlink]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation(); // prevent row click from also navigating
        const idx = parseInt(btn.getAttribute("data-unlink"), 10);
        const b = S.reportBroken[idx];
        if (!b) return;
        post({ type: "unlink-node", nodeId: b.nodeId });
        S.reportBroken.splice(idx, 1);
        if (S.reportTotals) S.reportTotals.broken = Math.max(0, S.reportTotals.broken - 1);
        renderReportView();
      };
    });

    // Untranslated item: select the token on the canvas (key layer, else the
    // nearest layer using it on this page, else the first one on another page)
    // and open the full edit view for it. Used nowhere → the report's own
    // editor instead (navigate-usage-result).
    main.querySelectorAll("[data-miss]").forEach((item) => {
      item.onclick = () => {
        const idx = parseInt(item.getAttribute("data-miss"), 10);
        const m = S.reportMissing[idx];
        if (!m || !m.varId) return;
        S.peekPending = { kind: "missing", varId: m.varId, idx: idx };
        post({ type: "navigate-to-usage", variableId: m.varId });
      };
    });

    $("reportDone").onclick = () => { S.reportOpen = false; S.reportPeek = null; post({ type: "refresh" }); };
  }

  // ---- edit a missing-value variable --------------------------------------
  // Sub-view of the cleanup report: fill in a variable's empty mode values
  // without leaving the report. Mirrors the normal edit view's textarea layout.
  function openMissingEditor(m, idx) {
    S.missingEditing = m;
    S.missingEditingIdx = idx;
    renderMissingEdit();
  }

  function renderMissingEdit() {
    const m = S.missingEditing;
    if (!m || !m.varId) { renderReportView(); return; }
    const modes = S.modes || [];
    const vals = m.valuesByMode || {};

    let html =
      '<button id="missBack" class="ghost sm back">' + esc(t("back")) + '</button>' +
      '<div class="var-head">' +
      '<div class="leaf">' + esc(m.id) + '</div>' +
      '<div class="grp">' + esc(m.group || t("noGroup")) + '</div></div>' +
      '<div class="notice info">' + ico("dash") + "<span>" + esc(t("notUsedEditNote")) + "</span></div>" +
      '<div class="field"><span class="mode-tag">' + esc(t("descLabel")) + "</span>" +
      '<textarea id="missDesc" placeholder="' + esc(t("descPlaceholder")) + '">' + esc(m.description || "") + "</textarea></div>";

    for (let i = 0; i < modes.length; i++) {
      const mode = modes[i];
      let cur = vals[mode.modeId];
      if (cur == null || cur === "--") cur = "";
      html +=
        '<div class="field">' +
        '<span class="mode-tag">' + esc(mode.name) + (mode.isDefault ? esc(t("defaultSuffix")) : "") + "</span>" +
        '<textarea data-mode="' + esc(mode.modeId) + '">' + esc(cur) + "</textarea>" +
        "</div>";
    }

    html +=
      '<div class="actions">' +
      '<button id="missCancel" class="ghost">' + esc(t("cancel")) + '</button>' +
      '<button id="missConfirm" class="primary">' + esc(t("confirm")) + '</button></div>';

    main.innerHTML = html;

    $("missBack").onclick = () => { S.missingEditing = null; renderReportView(); };
    $("missCancel").onclick = () => { S.missingEditing = null; renderReportView(); };
    $("missConfirm").onclick = () => {
      const values = {};
      main.querySelectorAll("textarea[data-mode]").forEach((ta) => {
        values[ta.getAttribute("data-mode")] = ta.value;
      });
      m.description = $("missDesc").value;
      post({ type: "save-missing", variableId: m.varId, values: values, description: m.description });
    };
  }

  // ---- relocate key layer -------------------------------------------------
  // Sub-view of the cleanup report: pick a text layer on the canvas to become
  // the key layer for a flagged variable. Confirm enables only when exactly one
  // resolvable layer is selected (selection === "node").
  function renderRelocate() {
    const v = S.relocating;
    if (!v) { renderReportView(); return; }
    const canConfirm = S.relocSelection === "node";

    let html =
      '<button id="relocBack" class="ghost sm back">' + esc(t("back")) + '</button>' +
      '<div class="var-head">' +
      '<div class="leaf">' + (S.relocOrigin === "report" ? "⚠️ " : "") + esc(v.leaf) + '</div>' +
      '<div class="grp">' + esc(v.group || t("noGroup")) + '</div></div>' +
      '<div class="muted" style="margin-bottom:10px">' + esc(t("relocatePrompt")) + '</div>' +
      (canConfirm
        ? '<div class="preview">' + esc(t("relocateSelectedLabel")) + esc(S.relocNodeName) + '</div>'
        : '<div class="muted">' + esc(t("relocateNoSel")) + '</div>') +
      '<div class="report-footer"><button id="relocConfirm" class="primary full"' +
      (canConfirm ? "" : " disabled") + '>' + esc(t("relocateConfirm")) + '</button></div>';

    main.innerHTML = html;
    $("relocBack").onclick = () => {
      const origin = S.relocOrigin;
      S.relocating = null;
      S.relocOrigin = null;
      if (origin === "report") renderReportView();
      else post({ type: "refresh" }); // edit origin — re-sync to the live selection
    };
    $("relocConfirm").onclick = () => { if (S.relocSelection === "node") post({ type: "relocate-key", variableId: v.id }); };
  }

  // ---- in-report assign picker (broken-link layers) -----------------------
  // A self-contained variable picker shown inside the cleanup report so broken
  // layers can be assigned one after another without re-running cleanup. Uses
  // the cached (post-cleanup) S.allVars; search is IME-safe like the main list.
  function renderAssignBroken() {
    const a = S.assignBroken;
    if (!a) { renderReportView(); return; }

    // ---- create form sub-view ----
    if (S.assignCreating) {
      let html =
        '<button id="abCreateBack" class="ghost sm back">' + esc(t("back")) + '</button>' +
        '<div class="field"><span class="mode-tag">' + esc(t("newVarIn")) + esc(a.groupPath || t("pageRoot")) + '</span></div>';
      for (let i = 0; i < S.modes.length; i++) {
        const m = S.modes[i];
        html +=
          '<div class="field">' +
          '<label>' + esc(m.name) + (m.isDefault ? esc(t("defaultSuffix")) + ' <span class="req">*</span>' : "") + '</label>' +
          '<textarea data-mode="' + m.modeId + '" data-default="' + (m.isDefault ? "1" : "") +
          '" placeholder="' + esc(m.isDefault ? t("required") : "--") + '"></textarea>' +
          '</div>';
      }
      html +=
        '<div class="muted" style="margin-bottom:10px">' + esc(t("idAssignedNote")) + '</div>' +
        '<button id="abCreateBtn" class="primary full">' + esc(t("createAssign")) + '</button>';
      main.innerHTML = html;
      $("abCreateBack").onclick = () => { S.assignCreating = false; renderAssignBroken(); };
      $("abCreateBtn").onclick = () => {
        const values = {};
        const areas = main.querySelectorAll("textarea[data-mode]");
        for (let i = 0; i < areas.length; i++) {
          values[areas[i].getAttribute("data-mode")] = areas[i].value;
        }
        post({ type: "create-for-broken", values: values, nodeId: a.nodeId });
      };
      return;
    }

    // ---- variable list sub-view (mirrors renderList for visual consistency) ----
    let html =
      '<div class="list-sticky">' +
      '<div class="list-nav">' +
      '<button id="abBack" class="ghost sm">' + esc(t("back")) + '</button>' +
      '<span class="grp-label">' + esc(t("assignVarTo")) + esc(a.nodeName) + '</span>' +
      "</div>" +
      '<div class="list-actions">' +
      '<input id="abSearch" type="text" placeholder="' + esc(t("searchPlaceholder")) + '" value="' + esc(S.assignSearch) + '" />' +
      '<button id="abCreate" class="primary sm" style="white-space:nowrap">' + esc(t("newVariable")) + '</button>' +
      "</div>" +
      "</div>" +
      '<div id="ab-body" class="list-body"></div>';

    main.innerHTML = html;
    $("abBack").onclick = () => { S.assignBroken = null; renderReportView(); };
    $("abCreate").onclick = () => { S.assignCreating = true; renderAssignBroken(); };

    const search = $("abSearch");
    let composing = false;
    search.addEventListener("compositionstart", () => { composing = true; });
    search.addEventListener("compositionend", () => { composing = false; S.assignSearch = search.value; renderAssignBrokenBody(); });
    search.addEventListener("input", () => { if (composing) return; S.assignSearch = search.value; renderAssignBrokenBody(); });
    search.focus();

    renderAssignBrokenBody();
  }

  function renderAssignBrokenBody() {
    const body = $("ab-body");
    if (!body) return;
    const a = S.assignBroken;
    const q = (S.assignSearch || "").trim();
    // One scope only: every token, filtered by the search (first 100 shown).
    const matched = (S.allVars || []).filter(v => matchesSearch(v, q));
    const vars = matched.slice(0, 100);

    const defId = S.defaultModeId;
    let html = "";

    if (!vars.length) {
      html = '<div class="muted" style="padding:4px 2px">' + esc(q ? t("noMatch") : t("noVarsFound")) + "</div>";
      body.innerHTML = html;
      return;
    }

    html += '<div class="list-section-label">' + esc(t("homeCount")(matched.length)) + '</div><div class="list">';
    for (let i = 0; i < vars.length; i++) {
      const v = vars[i];
      const preview = v.valuesByMode[defId];
      html +=
        '<div class="list-item" data-vid="' + esc(v.id) + '">' +
        '<div class="li-leaf">' + esc(typeof preview === "string" && preview !== "" ? preview : "—") + "</div>" +
        '<div class="li-val">' + esc(v.varId || v.leaf) + " · " + esc(v.group || t("pageRoot")) + "</div>" +
        "</div>";
    }
    html += "</div>";
    if (matched.length > vars.length) html += '<div class="muted" style="padding:8px 2px">' + esc(t("homeMore")(vars.length)) + "</div>";

    body.innerHTML = html;
    body.querySelectorAll("[data-vid]").forEach((el) => {
      el.onclick = () => post({ type: "assign-to-broken", nodeId: a.nodeId, variableId: el.getAttribute("data-vid") });
    });
  }

  // ---- CSV export ---------------------------------------------------------
  function parseGroupPath(groupPath) {
    var sections = [], layer = "";
    if (!groupPath) return { sections: sections, layer: layer };
    var parts = groupPath.split("/");
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].indexOf("section-") === 0) sections.push(parts[i].slice(8));
      else if (parts[i].indexOf("layer-") === 0) layer = parts[i].slice(6);
    }
    return { sections: sections, layer: layer };
  }

  function csvCell(s) {
    s = String(s == null ? "" : s);
    if (s.search(/[,"\r\n]/) !== -1) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function generateCSV(vars, modes) {
    var sorted = vars.slice().sort(function(a, b) {
      var na = (a.group || "") + "/" + a.leaf;
      var nb = (b.group || "") + "/" + b.leaf;
      return na < nb ? -1 : na > nb ? 1 : 0;
    });
    var rows = [];
    // "Description" is a reserved header — code.js locates it by name on import.
    var header = ["1st Section", "2nd Section", "3rd Section", "Layer Name", "Variable Name", "Description"];
    for (var i = 0; i < modes.length; i++) header.push(modes[i].name);
    rows.push(header.map(csvCell).join(","));
    for (var vi = 0; vi < sorted.length; vi++) {
      var v = sorted[vi];
      var parsed = parseGroupPath(v.group);
      var row = [
        parsed.sections[0] || "",
        parsed.sections[1] || "",
        parsed.sections[2] || "",
        parsed.layer || "",
        v.leaf.replace(/^⚠️\s*/, ""),
        typeof v.description === "string" ? v.description : "",
      ];
      for (var mi = 0; mi < modes.length; mi++) {
        var val = v.valuesByMode[modes[mi].modeId];
        row.push(typeof val === "string" ? val : "");
      }
      rows.push(row.map(csvCell).join(","));
    }
    return rows.join("\r\n");
  }

  function downloadCSV(content) {
    var blob = new Blob(["﻿" + content], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "language-variables.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  $("exportcsv").onclick = () => post({ type: "export-csv" });

  // ---- CSV import ---------------------------------------------------------
  // Parser handles quoted fields, escaped quotes (""), embedded commas/newlines,
  // and a leading UTF-8 BOM. Returns an array of row arrays.
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const rows = [];
    let row = [], field = "", inQuotes = false, i = 0;
    while (i < text.length) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ",") { row.push(field); field = ""; i++; continue; }
      if (c === "\r") { i++; continue; }
      if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
      field += c; i++;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    // Drop fully-empty rows.
    return rows.filter(r => r.some(cell => String(cell).trim() !== ""));
  }

  $("importcsv").onclick = () => {
    if (!confirm(t("importConfirm"))) {
      return;
    }
    $("fileinput").click();
  };

  $("fileinput").onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const rows = parseCSV(String(reader.result || ""));
      $("fileinput").value = ""; // allow re-picking the same file
      if (rows.length < 2) {
        post({ type: "notify", message: t("csvNoData") });
        return;
      }
      post({ type: "import-csv", headers: rows[0], rows: rows.slice(1) });
    };
    reader.readAsText(file);
  };

  // ---- import report ------------------------------------------------------
  function renderImportReport(r) {
    S.reportOpen = "import";
    S.importResult = r;
    renderImportReportView();
  }

  function renderImportReportView() {
    const r = S.importResult || {};
    let html = '<div class="view-title" style="margin-bottom:6px">' + esc(t("importComplete")) + '</div>';
    html += '<div class="muted" style="margin-bottom:10px">' +
      esc(t("importStat")({ updated: r.updated, newModes: r.newModes ? r.newModes.length : 0 })) + "</div>";

    if (r.newModes && r.newModes.length) {
      html += '<div class="muted" style="margin-bottom:10px">' + esc(t("newModesLabel")) + r.newModes.map(esc).join(", ") + "</div>";
    }

    if (r.unmatched && r.unmatched.length) {
      html +=
        '<div class="error-banner" style="display:block">' +
        esc(t("unmatchedBanner")(r.unmatched.length)) +
        "</div>";
      html += '<div class="list" style="margin-top:8px">';
      for (let i = 0; i < r.unmatched.length; i++) {
        const u = r.unmatched[i];
        const loc = [u.section1, u.section2, u.section3, u.layer].filter(Boolean).join(" / ");
        html +=
          '<div class="list-item" style="cursor:default">' +
          '<div class="li-leaf">' + esc(u.variableName || t("blank")) + "</div>" +
          '<div class="li-grp">' + esc(loc || t("noLocation")) + "</div>" +
          "</div>";
      }
      html += "</div>";
    }

    html += '<div class="report-footer"><button id="reportDone" class="primary full">' + esc(t("done")) + '</button></div>';
    main.innerHTML = html;
    $("reportDone").onclick = () => { S.reportOpen = false; S.reportPeek = null; post({ type: "refresh" }); };
  }

  // ---- header tools -------------------------------------------------------
  $("cleanup").onclick = () => {
    if (confirm(t("cleanupConfirm"))) {
      post({ type: "cleanup" });
    }
  };

  // ---- language toggle ----------------------------------------------------
  // Updates the static header labels + toggle state, then re-renders the body.
  function applyLang() {
    $("exportcsv").textContent = t("exportCsv");
    $("importcsv").textContent = t("importCsv");
    // The cleanup only looks at the current page — say so on the button, so it isn't read as a whole-file cleanup.
    $("cleanup").innerHTML = esc(t("cleanup")) + ' <span class="scope">' + esc(t("currentPage")) + "</span>";
    $("lang-en").classList.toggle("active", S.lang === "en");
    $("lang-ko").classList.toggle("active", S.lang === "ko");
    // Don't blow away an open report/relocate/assign view when language changes.
    if (S.relocating) renderRelocate();
    else if (S.assignBroken || S.assignCreating) renderAssignBroken();
    else if (S.missingEditing) renderMissingEdit();
    else if (S.reportPeek) render(); // a report item is open in the normal views
    else if (S.reportOpen === "cleanup") renderReportView();
    else if (S.reportOpen === "import") renderImportReportView();
    else render();
  }

  function setLang(lang) {
    if (S.lang === lang) return;
    S.lang = lang;
    post({ type: "set-lang", lang: lang });
    applyLang();
  }
  $("lang-en").onclick = () => setLang("en");
  $("lang-ko").onclick = () => setLang("ko");

  applyLang(); // initial labels before the first state arrives
  post({ type: "ready" });
</script>
</body>
</html>
